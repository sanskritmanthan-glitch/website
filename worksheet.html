<style>
:root{--paper:#f6f1e7;--ink:#2b2118;--muted:#6f6152;--line:#ddd2bf;--card:#fffaf1;--saffron:#b4531f}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 "Tiro Devanagari Sanskrit","Noto Serif Devanagari",serif}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}header{border-bottom:1px solid var(--line)}header .wrap{padding:10px 16px}.brand{font-weight:600;font-size:1.5rem;color:var(--saffron);text-decoration:none}
h1{font-weight:400;margin:20px 0 0}.sub{color:var(--muted);font-family:Spectral,serif;margin:0 0 14px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ctl label{display:flex;flex-direction:column;font:14px Spectral,serif;color:var(--muted);gap:3px}select,input{font:inherit;font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff}
.btn{border:0;border-radius:22px;padding:9px 18px;font:600 15px Spectral,serif;cursor:pointer;background:var(--saffron);color:#fff}.btn.o{background:none;border:1px solid var(--saffron);color:var(--saffron)}
.sheet{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:28px 34px;margin:18px 0}
.sheet h2{text-align:center;font-weight:400;margin:0}.sheet .meta{display:flex;justify-content:space-between;font:14px Spectral,serif;border-bottom:1px solid #999;padding-bottom:8px;margin:10px 0 12px}
.sheet ol{columns:2;column-gap:40px;padding-left:22px;margin:0}.sheet li{break-inside:avoid;margin:0 0 14px;font-size:17px}.sheet li .ln{display:inline-block;min-width:140px;border-bottom:1px dotted #777}
.sheet .key li{font-size:15px;margin-bottom:6px}.sheet .key b{color:#7a2e0e}.ft{text-align:center;font:12px Spectral,serif;color:#777;margin-top:14px}
@media print{body{background:#fff}header,.ctl,.sub,h1,.np{display:none!important}.wrap{max-width:none;padding:0}.sheet{border:0;margin:0;padding:10mm 12mm}.pb{break-before:page}}

<body>
<header><div class="wrap"><a class="brand" href="./">संस्कृतमन्थनम्</a></div></header>
<div class="wrap">
<h1>अभ्यासपत्रम् · Worksheets</h1>
<p class="sub">For teachers and students: a fresh worksheet every time, with an answer key on the second page — every answer generated by Pāṇini's rules (vidyut-prakriyā). Print it, or save as PDF from the print dialog.</p>
<div class="ctl">
 <label>Exercise<select id="kind"><option value="sandhi">सन्धिः · Vowel sandhi</option><option value="shabda">शब्दरूपाणि · Noun forms</option><option value="dhatu">धातुरूपाणि · Verb forms</option><option value="mixed">मिश्रम् · Mixed</option></select></label>
 <label>Level<select id="lvl"><option value="1">Easy</option><option value="2">Medium</option><option value="3">Hard</option></select></label>
 <label>Questions<select id="n"><option>10</option><option selected>20</option><option>30</option></select></label>
 <label>Title<input id="ttl" value="संस्कृत-अभ्यासः" size="16"></label>
 <button class="btn" id="go">⟳ New worksheet</button><button class="btn o" id="pr">🖨 Print / PDF</button>
</div>
<div id="out"><p class="sub np" style="margin-top:20px">Loading the grammar engine…</p></div>
</div>
<script type="module">
import * as C from './vy/core.js';
const $=s=>document.querySelector(s);const R=n=>Math.floor(Math.random()*n),pick=a=>a[R(a.length)];
const PAIRS=[['rAma','iti'],['deva','indra'],['mahA','fzi'],['tava','eva'],['vidyA','Alaya'],['su','Agatam'],['iti','Adi'],['sUrya','udaya'],['gaRa','ISa'],['hima','Alaya'],['ne','anam'],['pitf','AjYA'],['pra','fzi'],['yadi','api'],['guru','upadeSa'],['ca','eva'],['na','asti'],['mahA','ISa'],['parama','Atman'],['maDu','ari'],['sadA','eva'],['rAjA','indra'],['sva','icCA'],['devI','iyam'],['BAnu','udaya'],['gaNgA','udaka'],['vana','oza'],['mAtf','AjYA'],['dIpa','AvalI'],['saha','eva'],['jaya','Atman'],['nara','indra'],['upa','IkzA'],['tatra','eva'],['iha','eva'],['ati','uttamam']];
const STEMS={1:[['rAma','P'],['Pala','N'],['latA','S']],2:[['hari','P'],['guru','P'],['mati','S'],['nadI','S'],['vAri','N'],['maDu','N'],['DenU','S']],3:[['pitf','P'],['mAtf','S'],['rAjan','P'],['vAc','S'],['manas','N'],['Atman','P'],['marut','P'],['jagat','N']]};
const LAKS={1:[0],2:[0,6,5],3:[0,6,5,3,7]};
let GD=null;
const sd=x=>C.s2d(x);
function qSandhi(l){const [a,b]=pick(PAIRS);const r=window.__join(a,b);return {q:`${sd(a)} + ${sd(b)} =`,a:sd(r.out.replace(/'/g,"'"))+(r.rule?'':'')}}
function qShabda(l){const pool=[].concat(...Object.entries(STEMS).filter(([k])=>+k<=l).map(([,v])=>v));const [s,g]=pick(pool);const vi=R(l===1?3:7),va=R(3);const f=C.supForms(s,g,vi,va);if(!f.length)return null;
  return {q:`${sd(s)} (${C.LIND[g].replace('सकलिङ्गम्','').replace('लिङ्गम्','')+'.'}) — ${C.VIBD[vi]}, ${C.VACD[va]} =`,a:f.map(sd).join(' / ')}}
function qDhatu(l){const di=pick(GD.slice(0,l===1?12:l===2?30:70)),la=pick(LAKS[l]),pu=R(3),va=R(3);const f=C.tinForms(di,la,0,pu,va);if(!f.length)return null;
  const g=f.filter(x=>!(/[dgqb]$/.test(x)&&f.includes(x.slice(0,-1)+{d:'t',g:'k',q:'w',b:'p'}[x.slice(-1)])));return {q:`${C.dhatuPlain(C.DH[di][1])} — ${C.LAKD[la]}, ${C.PURD[pu]}, ${C.VACD[va]} =`,a:g.map(sd).join(' / ')}}
function make(){const k=$('#kind').value,l=+$('#lvl').value,n=+$('#n').value,qs=[],seen=new Set();let guard=0;
  while(qs.length<n&&guard++<n*20){const kk=k==='mixed'?pick(['sandhi','shabda','dhatu']):k;const q=(kk==='sandhi'?qSandhi:kk==='shabda'?qShabda:qDhatu)(l);if(!q||seen.has(q.q))continue;seen.add(q.q);qs.push(q)}
  const T={sandhi:'सन्धिं कुरुत · Join with sandhi',shabda:'रूपाणि लिखत · Write the noun forms',dhatu:'रूपाणि लिखत · Write the verb forms',mixed:'प्रश्नानाम् उत्तराणि लिखत · Answer the questions'}[k];
  const dt=new Date().toLocaleDateString('en-IN');
  $('#out').innerHTML=`<div class="sheet"><h2>${$('#ttl').value}</h2><div class="meta"><span>नाम · Name: ____________________</span><span>${T}</span><span>दिनाङ्कः · Date: __________</span></div>
   <ol>${qs.map(x=>`<li>${x.q} <span class="ln">&nbsp;</span></li>`).join('')}</ol><div class="ft">sanskritmanthan.in/worksheet · अभ्यासपत्रम्</div></div>
   <div class="sheet pb key"><h2>उत्तराणि · Answer key</h2><div class="meta"><span>${$('#ttl').value}</span><span>${dt}</span></div><ol>${qs.map(x=>`<li>${x.q} <b>${x.a}</b></li>`).join('')}</ol><div class="ft">Answers generated with vidyut-prakriyā (Pāṇinian engine) · sanskritmanthan.in</div></div>`}
(async()=>{await C.engine();GD=await C.getJSON('vy/game_dhatus.json');const S=await import('./vy/sandhi.js');window.__join=S.join;
  const p=new URLSearchParams(location.search);if(p.get('k'))$('#kind').value=p.get('k');if(p.get('l'))$('#lvl').value=p.get('l');
  make();$('#go').onclick=make;$('#pr').onclick=()=>print();for(const id of ['kind','lvl','n'])$('#'+id).onchange=make})();
</script>
<script src="/sri.js?v=8" defer></script>
</body>
</html>
