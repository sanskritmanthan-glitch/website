<style>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let CAT=null, MET=null, TX={}, KEYS={}, SCRIPT='dv', LIMIT=200, TAB='poets';
const SEL={id:null,s:null,v:null,poet:null,metre:null}, OPEN={text:null,poet:null,ptext:null};
try{SCRIPT=localStorage.getItem('sl-script')||'dv';TAB=localStorage.getItem('sl-tab')||'poets'}catch(e){}
/* ---------- transliteration (Devanagari → Telugu / IAST) ---------- */
const V={'अ':'a','आ':'ā','इ':'i','ई':'ī','उ':'u','ऊ':'ū','ऋ':'ṛ','ॠ':'ṝ','ऌ':'ḷ','ए':'e','ऐ':'ai','ओ':'o','औ':'au'};
const M={'ा':'ā','ि':'i','ी':'ī','ु':'u','ू':'ū','ृ':'ṛ','ॄ':'ṝ','ॢ':'ḷ','े':'e','ै':'ai','ो':'o','ौ':'au'};
const K={'क':'k','ख':'kh','ग':'g','घ':'gh','ङ':'ṅ','च':'c','छ':'ch','ज':'j','झ':'jh','ञ':'ñ','ट':'ṭ','ठ':'ṭh','ड':'ḍ','ढ':'ḍh','ण':'ṇ','त':'t','थ':'th','द':'d','ध':'dh','न':'n','प':'p','फ':'ph','ब':'b','भ':'bh','म':'m','य':'y','र':'r','ल':'l','ळ':'ḷ','व':'v','श':'ś','ष':'ṣ','स':'s','ह':'h'};
function d2i(s){let o='';for(let i=0;i<s.length;i++){const c=s[i],n=s[i+1];
  if(K[c]){o+=K[c];if(n==='्'){i++}else if(M[n]){o+=M[n];i++}else o+='a'}
  else if(V[c])o+=V[c];else if(c==='ं')o+='ṃ';else if(c==='ः')o+='ḥ';else if(c==='ँ')o+='m̐';else if(c==='ऽ')o+="'";else if(c==='।')o+='|';else if(c==='॥')o+='||';else o+=c}return o}
const d2t=s=>s.replace(/[ऀ-ॿ]/g,c=>c==='ऽ'?'ఽ':c==='।'||c==='॥'?c:String.fromCharCode(c.charCodeAt(0)+0x300));
const t2d=s=>s.replace(/[ఀ-౿]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x300));
const show=s=>SCRIPT==='te'?d2t(s):SCRIPT==='la'?d2i(s):s;
function loose(s){ // same rule as the Python builder
  if(/[ఀ-౿]/.test(s))s=t2d(s); if(/[ऀ-ॿ]/.test(s))s=d2i(s);
  s=s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'').replace(/sh/g,'s');
  return s.replace(/[nm](?=[kgcjtdpb])/g,'n')}
/* ---------- scansion of a Devanagari pāda ---------- */
const CONS=/[क-हक़-य़]/, LONGV=/[आईऊॠॡएऐओऔ]/, LONGM=/[ाीूॄॣेैोौ]/, VOW=/[अ-औ]/, MAT=/[ा-ौॢॣ]/;
function sylls(txt){ // → [{t:akṣara text, w:'G'|'L'}]
  const out=[];let i=0,on='',lead='';const s=txt;
  while(i<s.length){const c=s[i];
    if(CONS.test(c)){let j=i+1;if(s[j]==='़')j++;
      if(s[j]==='्'){ // consonant without vowel: onset of next or coda of previous
        let k=j+1;while(s[k]===' '||s[k]==='ऽ')k++;
        const nextIsVowelish=k<s.length&&(CONS.test(s[k])||VOW.test(s[k]));
        if(!nextIsVowelish||(s[j+1]===' '&&out.length)){ // word-final: coda of previous syllable
          if(out.length){out[out.length-1].t+=s.slice(i,j+1);out[out.length-1].coda=true}else on+=s.slice(i,j+1)}
        else on+=s.slice(i,j+1);
        i=j+1;continue}
      // consonant + vowel sign / inherent a
      let t=lead+on+s.slice(i,j);let long=false;
      if(MAT.test(s[j]||'')){long=LONGM.test(s[j]);t+=s[j];j++}
      while(s[j]==='ं'||s[j]==='ः'||s[j]==='ँ'){t+=s[j];j++}
      const nc=(on.match(/्/g)||[]).length+1;
      out.push({t,long,anu:/[ंः]/.test(t),onset:nc});on='';lead='';i=j;continue}
    if(VOW.test(c)){let t=lead+on+c,j=i+1;while(s[j]==='ं'||s[j]==='ः'||s[j]==='ँ'){t+=s[j];j++}
      out.push({t,long:LONGV.test(c),anu:/[ंः]/.test(t),onset:on?((on.match(/्/g)||[]).length):0});on='';lead='';i=j;continue}
    if(c===' '){if(out.length)out[out.length-1].t+=' ';i++;continue}
    if(c==='ऽ'){if(out.length)out[out.length-1].t+='ऽ';i++;continue}
    i++}
  if(on&&out.length){out[out.length-1].t+=on;out[out.length-1].coda=true}
  return out}
function weigh(padas){ // weights computed across pāda junctions
  const all=[],idx=[];padas.forEach((p,pi)=>{const ss=sylls(p);ss.forEach(x=>{x.p=pi;all.push(x)});idx.push(ss.length)});
  all.forEach((x,k)=>{const nx=all[k+1];x.w=(x.long||x.anu||x.coda||(nx&&nx.onset>=2))?'G':'L'});
  const res=[];let k=0;idx.forEach(n=>{res.push(all.slice(k,k+n));k+=n});return res}
const GN={'LGG':'य','GGG':'म','GGL':'त','GLG':'र','LGL':'ज','GLL':'भ','LLL':'न','LLG':'स'};
const mark=w=>w==='G'?'–':w==='L'?'⏑':'×';
function scanHTML(padas,md){ // md: metre info (optional) for gaṇa grouping / yati / mātrā
  const W=weigh(padas), mat=md&&md.mat, yati=md&&md.yati||[];
  return W.map((ss,pi)=>{let h='',m=0;
    if(mat||md&&md.iast==='anuṣṭubh'){ // mātrā metres: groups of four mātrās; anuṣṭubh: groups of four syllables
      let grp=[],cnt=0;const flush=lab=>{if(grp.length)h+=`<span class="g"${lab?` data-g="${lab}"`:''}>${grp.join('')}</span>`;grp=[];cnt=0};
      ss.forEach((x,k)=>{const v=x.w==='G'?2:1;m+=v;grp.push(`<span class="sy"><b>${mark(x.w)}</b><span>${esc(show(x.t.trim()))}</span></span>`);
        if(mat){cnt+=v;if(cnt>=4)flush()}else if((k+1)%4===0)flush()});flush();
      return `<div class="scanrow"><div class="pl">${pi+1} · ${ss.length} अक्षराणि · ${m} मात्राः</div><div class="scan">${h}</div></div>`}
    let pat=ss.map(x=>x.w).join('');
    for(let k=0;k<ss.length;k+=3){const g=ss.slice(k,k+3),key=pat.slice(k,k+3),lab=g.length===3?(GN[key]||''):'';
      const parts=g.map((x,j)=>{const n=k+j+1;return `<span class="sy"><b>${mark(x.w)}</b><span>${esc(show(x.t.trim()))}</span></span>`+(yati.includes(n)&&n<ss.length?'<span class="y" title="यतिः"></span>':'')});
      if(g.length===3)h+=`<span class="g" data-g="${lab}">${parts.join('')}</span>`;else g.forEach((x,j)=>h+=`<span class="g" data-g="${x.w==='G'?'ग':'ल'}">${parts[j]}</span>`);}
    return `<div class="scanrow"><div class="pl">${pi+1} · ${ss.length} अक्षराणि · ${ss.reduce((a,x)=>a+(x.w==='G'?2:1),0)} मात्राः</div><div class="scan">${h}</div></div>`}).join('')}
/* ---------- data ---------- */
const get=u=>fetch(u).then(r=>r.json());
async function text(id){if(!TX[id])TX[id]=await get('sl/t/'+id+'.json');return TX[id]}
async function keys(id){if(!KEYS[id])KEYS[id]=await get('sl/k/'+id+'.json');return KEYS[id]}
const T=id=>CAT.texts.find(t=>t.id===id);
const MD=dev=>MET&&MET.find(m=>m.dev===dev);
const MS=slug=>MET&&MET.find(m=>m.slug===slug);
const multi=t=>t.sargas.length>1;
const unitN=(t,s)=>s===0?'आरम्भः':`${t.unit}ः ${s}`;
const chipN=s=>s===0?'आ':s;
const ref=(id,s,v)=>{const t=T(id);return multi(t)?`${show(t.title)} ${s===0?'आ':s}.${v}`:`${show(t.title)} ${v}`};

function verseHTML(p){return p.map((x,i)=>`<div class="${i%2?'l2':''}">${esc(show(x))}${i%2?(i===p.length-1?' ॥':' ।'):''}</div>`).join('')}
function metreLink(m){return m?`<button class="ml" data-m="${esc(m)}">${esc(show(m))}</button>`:''}

async function openVerse(id,s,v,push=true){
  const t=await text(id), all=t.v, ix=all.findIndex(x=>x[0]===s&&x[1]===v); if(ix<0)return;

  Object.assign(SEL,{id,s:S,v:Vn,metre:null});OPEN.text=id;
  $('#out').innerHTML=`<div class="card"><div class="hd"><span>${esc(show(meta.title))} · ${esc(show(meta.poet))}${multi(meta)?` · ${esc(show(unitN(meta,S)))}`:''} · ${Vn}</span><span class="mt">${metreLink(m)}</span></div>
   <div class="v">${verseHTML(P)}॥${Vn}॥</div>
   <div class="nav"><button id="pv" ${ix?'':'disabled'}>‹ पूर्वः</button><button id="nx" ${ix<all.length-1?'':'disabled'}>परः ›</button>
   <button id="sg">सम्पूर्णः ${multi(meta)?show(meta.unit+'ः'):'ग्रन्थः'}</button><button id="sc">छन्दोविश्लेषणम् · scansion</button><button id="cp">लिङ्कं प्रतिलिखतु · copy link</button></div>

  $('#pv').onclick=()=>openVerse(id,all[ix-1][0],all[ix-1][1]);$('#nx').onclick=()=>openVerse(id,all[ix+1][0],all[ix+1][1]);
  $('#sg').onclick=()=>openSarga(id,S,Vn);$('#cp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(location.href);$('#cp').textContent='✓'};
  $('#sc').onclick=()=>{const b=$('#scanbox');b.hidden=!b.hidden;if(!b.hidden&&!b.innerHTML){const d=MD(m);
    b.innerHTML=`<h3>छन्दोविश्लेषणम्${d?' · '+esc(show(d.dev)):''}</h3>`+scanHTML(P,d)+`<p class="note">– guru (heavy) · ⏑ laghu (light) · gaṇas of three syllables are named below each group${d&&d.yati&&d.yati.length?'; the saffron bar marks the yati (caesura)':''}. ${d&&d.mat?'Mātrā metres are grouped in gaṇas of four mātrās.':''}</p>`}};
  if(push)history.replaceState(null,'',`#${id}/${S}/${Vn}`);syncNav();window.scrollTo({top:0,behavior:'smooth'});
}
async function openSarga(id,s,hl,push=true){
  const t=await text(id), meta=T(id), vs=t.v.filter(x=>x[0]===s);
  Object.assign(SEL,{id,s,v:hl||null,metre:null});OPEN.text=id;
  const sg=meta.sargas.map(x=>x[0]), k=sg.indexOf(s);
  $('#info').textContent=`${show(meta.title)} · ${multi(meta)?show(unitN(meta,s))+' · ':''}${vs.length} verses`;
  $('#out').innerHTML=`<div class="nav" style="margin:0 0 8px"><button id="ov">‹ ${esc(show(meta.title))}</button><button id="pt">प्रतीकसूची · first lines</button>${k>0?`<button id="ps">‹ ${esc(show(unitN(meta,sg[k-1])))}</button>`:''}${k<sg.length-1?`<button id="ns">${esc(show(unitN(meta,sg[k+1])))} ›</button>`:''}</div>
   <div class="sarga">`+vs.map(x=>`<div class="vs${x[1]===hl?' on':''}" id="v${x[1]}"><div class="n" title="open">${x[1]}</div><div><div class="v">${verseHTML(x[2])}</div><div class="mt">${metreLink(x[3])}</div></div></div>`).join('')+`</div>`;
  wireMetreLinks($('#out'));
  $('#ov').onclick=()=>openText(id);$('#pt').onclick=()=>pratika(id,s);
  if($('#ps'))$('#ps').onclick=()=>openSarga(id,sg[k-1]);if($('#ns'))$('#ns').onclick=()=>openSarga(id,sg[k+1]);
  $$('.sarga .vs').forEach(el=>{el.ondblclick=()=>openVerse(id,s,+el.id.slice(1));el.querySelector('.n').onclick=()=>openVerse(id,s,+el.id.slice(1))});
  if(push)history.replaceState(null,'',`#${id}/${s}`);syncNav();
  if(hl&&$('#v'+hl))$('#v'+hl).scrollIntoView({block:'center'});else window.scrollTo({top:0});
}
async function openText(id,push=true){
  const t=await text(id), meta=T(id);
  Object.assign(SEL,{id,s:null,v:null,metre:null});OPEN.text=id;
  const mc={};t.v.forEach(x=>{if(x[3])mc[x[3]]=(mc[x[3]]||0)+1});
  const ms=Object.entries(mc).sort((a,b)=>b[1]-a[1]);
  const first={};t.v.forEach(x=>{if(!first[x[0]])first[x[0]]=x[2][0]});
  $('#info').textContent='';
  $('#out').innerHTML=`<div class="card"><div class="hd"><span>${esc(show(meta.gdev))}</span><span>${meta.verses} verses</span></div>
   <h2 class="nm">${esc(show(meta.title))}</h2><div><button class="ml" id="pl">${esc(show(meta.poet))}</button></div>
   ${ms.length?`<h3>छन्दांसि · metres</h3><div class="tags">${ms.map(([m,n])=>`<span class="tag">${metreLink(m)} ${n}</span>`).join('')}</div>`:''}
   <h3>${multi(meta)?esc(show(meta.unit+'ाः'))+' · chapters':'पठतु · read'}</h3>
   <ul class="sgl">${meta.sargas.map(([s,n])=>`<li data-s="${s}"><span class="n">${esc(show(multi(meta)?unitN(meta,s):'सम्पूर्णम्'))}</span><span class="pd">${esc(show(first[s]||''))} …</span><span class="mt">${n}</span></li>`).join('')}</ul></div>`;
  wireMetreLinks($('#out'));
  $('#pl').onclick=()=>openPoet(meta.poet);
  $$('.sgl li').forEach(li=>li.onclick=()=>openSarga(id,+li.dataset.s));

function openPoet(name,push=true){

  if(TAB!=='poets')setTab('poets',false);
  $('#info').textContent='';

   <ul class="sgl">${ids.map(id=>{const t=T(id);return `<li data-t="${id}"><span class="n">${esc(show(t.gdev))}</span><span class="pd">${esc(show(t.title))}</span><span class="mt">${t.verses}</span></li>`}).join('')}</ul></div>`;

  if(push)history.replaceState(null,'','#p/'+encodeURIComponent(name));syncNav();window.scrollTo({top:0});

function metreCard(d,full=true){
  if(!d)return'';
  const tags=[d.kind,d.sub,d.cls?`${d.cls} (${d.syl[0]})`:'',d.syl&&!d.cls?d.syl.join(' / ')+' अक्षराणि':'',d.mat?d.mat.join(' + ')+' मात्राः':''].filter(Boolean);
  let scheme='';
  if(d.rule){scheme=d.rule.map((r,i)=>`<div class="scanrow"><div class="pl">${i?'समपादौ (2, 4)':'विषमपादौ (1, 3)'}</div><div class="scan"><span class="g">${r.map((w,k)=>`<span class="sy${w==='x'?' x':''}"><b>${mark(w==='x'?'':w)}</b><span>${k+1}</span></span>`).join('')}</span></div></div>`).join('')}
  else if(d.pads){scheme=d.pads.map(([p,g],i)=>{let h='';for(let k=0;k<p.length;k+=3){const seg=p.slice(k,k+3);
      const cells=[...seg].map((w,j)=>{const n=k+j+1;return `<span class="sy"><b>${mark(w)}</b><span>${n}</span></span>`+(d.yati.includes(n)&&n<p.length?'<span class="y" title="यतिः"></span>':'')});
      if(seg.length===3)h+=`<span class="g" data-g="${GN[seg]}">${cells.join('')}</span>`;else [...seg].forEach((w,j)=>h+=`<span class="g" data-g="${w==='G'?'ग':'ल'}">${cells[j]}</span>`)}
      const lab=d.padlab?d.padlab[i]:d.pads.length===4?`पादः ${i+1}`:d.pads.length===2?(i?'समपादौ (2, 4)':'विषमपादौ (1, 3)'):'प्रतिपादम् · every pāda';
      return `<div class="scanrow"><div class="pl">${esc(lab)} · ${g.join(' ')}</div><div class="scan">${h}</div></div>`}).join('')}
  if(d.mat)scheme+=`<div class="mat">${d.mat.map((n,i)=>`<div>पादः ${i+1}<b>${n}</b>मात्राः</div>`).join('')}</div>`;
  return `<div class="card"><div class="hd"><span>छन्दः · metre</span><span>${d.n} verses in this index</span></div>
   <h2 class="nm">${esc(show(d.dev))}</h2><div class="note">${esc(d.iast)}</div>
   <div class="tags">${tags.map(x=>`<span class="tag">${esc(show(x))}</span>`).join('')}${d.yati&&d.yati.length?`<span class="tag">यतिः ${d.yati.join(', ')}</span>`:''}</div>
   ${d.lak?`<h3>लक्षणम्</h3><blockquote class="v" style="font-size:1.1rem">${esc(show(d.lak))}</blockquote>`:''}
   ${scheme?`<h3>गणव्यवस्था · scheme</h3>${scheme}`:''}
   ${d.note?`<p class="note">${esc(d.note)}</p>`:''}
   ${full?`<h3>ग्रन्थेषु · in the texts</h3><div class="chips" id="mtx"><button class="on" data-t="">सर्वे ${d.n}</button>${d.texts.map(([id,n])=>`<button data-t="${id}">${esc(show(T(id).title))} ${n}</button>`).join('')}</div>
   <details style="margin-top:10px"><summary class="note" style="cursor:pointer">गणाः · key to the gaṇas (यमाताराजभानसलगम्)</summary><div class="key" style="margin-top:8px">${Object.entries(GN).map(([p,g])=>`<div>${g} <b>${[...p].map(mark).join('')}</b></div>`).join('')}<div>ग <b>–</b> guru</div><div>ल <b>⏑</b> laghu</div></div></details>`:`<div class="nav"><button class="ml" data-mm="${d.slug}">छन्दःपरिचयः · about this metre ›</button></div>`}</div>`}
async function openMetre(slug,push=true){
  const d=MS(slug);if(!d)return;
  Object.assign(SEL,{metre:slug});if(TAB!=='metres')setTab('metres',false);
  const rows=await get('sl/m/'+slug+'.json');
  $('#info').textContent='';
  $('#out').innerHTML=metreCard(d)+`<div id="mlist"></div>`;
  const draw=t=>{const r=t?rows.filter(x=>x[1]===t):rows;
    listInto($('#mlist'),r.map(x=>[x[0],x[1],x[2],x[3],0]))};
  draw('');$$('#mtx button').forEach(b=>b.onclick=()=>{$$('#mtx button').forEach(x=>x.classList.toggle('on',x===b));draw(b.dataset.t)});
  if(push)history.replaceState(null,'','#m/'+slug);syncNav();window.scrollTo({top:0});
}
async function pratika(id,s){
  const t=await text(id), meta=T(id), vs=t.v.filter(x=>x[0]===s);
  $('#info').textContent=`प्रतीकसूची · ${show(meta.title)}${multi(meta)?' · '+show(unitN(meta,s)):''}`;

function listInto(el,rows){
  let n=LIMIT;const draw=()=>{
    el.innerHTML='<ul class="res">'+rows.slice(0,n).map((r,i)=>`<li data-i="${i}"><span class="pd">${esc(show(r[0]))}</span><span class="rf">${esc(ref(r[1],r[2],r[3]))}${r[4]?' · '+'abcdef'[r[4]]:''}</span></li>`).join('')+'</ul>'+(rows.length>n?`<button class="more">+ ${rows.length-n}</button>`:'');
    el.querySelectorAll('.res li').forEach(li=>li.onclick=()=>{const r=rows[+li.dataset.i];openVerse(r[1],r[2],r[3])});
    const mb=el.querySelector('.more');if(mb)mb.onclick=()=>{n+=LIMIT;draw()}};draw()}
function list(rows,top=''){ $('#out').innerHTML=top+'<div id="lst"></div>';
  $$('#out [data-mm]').forEach(b=>b.onclick=()=>openMetre(b.dataset.mm));listInto($('#lst'),rows)}
async function byLetter(fn,lab){
  $$('.alpha button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===fn));
  let rows=await get('sl/a/'+fn+'.json'); const ft=$('#ft').value, fm=$('#fm').value, md=MS(fm);
  if(ft)rows=rows.filter(r=>r[1]===ft);
  if(md){const ok=new Set();for(const id of new Set(rows.map(r=>r[1]))){(await text(id)).v.forEach(x=>{if(x[3]===md.dev)ok.add(id+'|'+x[0]+'|'+x[1])})}rows=rows.filter(r=>ok.has(r[1]+'|'+r[2]+'|'+r[3]))}
  $('#info').textContent=`${lab} · ${rows.length} pādas`;list(rows,md?metreCard(md,false):'');
  history.replaceState(null,'','#'+fn);
}
async function search(){
  const raw=$('#q').value.trim(); if(!raw){$('#out').innerHTML='';$('#info').textContent=intro();return}
  const m=raw.match(/^(.+?)\s*(\d+)(?:[.:,\s]+(\d+))?$/)||raw.replace(/[०-९]/g,d=>'०१२३४५६७८९'.indexOf(d)).match(/^(.+?)\s*(\d+)(?:[.:,\s]+(\d+))?$/);
  if(m){const k=loose(m[1]);const t=CAT.texts.find(t=>k.length>=3&&(t.aliases.some(a=>a.startsWith(k)||k.startsWith(a.slice(0,4)))));
    if(t){if(multi(t)){if(m[3])return openVerse(t.id,+m[2],+m[3]);return openSarga(t.id,+m[2])}return openVerse(t.id,t.sargas[0][0],+m[2])}}
  const q=loose(raw); if(q.length<2)return;
  const ft=$('#ft').value, md=MS($('#fm').value), ids=CAT.texts.map(t=>t.id).filter(id=>!ft||id===ft);
  const starts=[],inside=[];
  for(const id of ids){const k=await keys(id),t=await text(id);
    k.forEach((pk,vi)=>{const vv=t.v[vi];if(md&&vv[3]!==md.dev)return;
      pk.forEach((key,pi)=>{if(key.startsWith(q))starts.push([vv[2][pi],id,vv[0],vv[1],pi]);else if(key.includes(q))inside.push([vv[2][pi],id,vv[0],vv[1],pi])})})}
  $('#info').textContent=`${starts.length+inside.length} pādas · “${raw}”`;list(starts.concat(inside),md?metreCard(md,false):'');
}
const intro=()=>`${CAT.total.toLocaleString('en-IN')} verses · ${CAT.texts.length} texts · ${CAT.poets.length} poets · ${CAT.metres.length} metres — choose a letter, a text, a poet or a metre, or search`;

function panelTo(box,el){const b=box.getBoundingClientRect(),r=el.getBoundingClientRect(),top=Math.max(b.top,0),bot=Math.min(b.bottom,innerHeight);if(r.top<top||r.bottom>bot)box.scrollTop+=r.top-top-Math.max(40,(bot-top)/3)}
function grouped(items,nameOf,render){let last='',h='';for(const it of items){const L=initialOf(nameOf(it));if(L!==last){h+=`<div class="ldiv">${esc(show(L))}</div>`;last=L}h+=render(it)}return h}
function sargaChips(t,cls=''){return multi(t)?`<div class="chips"><span class="lab">${esc(show(t.unit+'ाः'))} · chapters</span>${t.sargas.map(([s,n])=>`<button class="${cls}${SEL.id===t.id&&SEL.s===s?' on':''}" data-t="${t.id}" data-s="${s}" title="${n} verses">${chipN(s)}</button>`).join('')}</div>`:''}

      inner+='</div>'}

async function route(){const h=decodeURIComponent(location.hash.slice(1));if(!h){$('#info').textContent=intro();return}
