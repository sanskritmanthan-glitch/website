ः भस्म च — एते एव शास्त्रं साक्षात् उपमारूपेण च वदन्ति।"}, {"id": "p-AfAjEgAAQBAJ", "title": "రససిద్ధి", "sub": "ఇరవై నాలుగు సంస్కారాలు, ఒకే రసం — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "full": "రససిద్ధి: ఇరవై నాలుగు సంస్కారాలు, ఒకే రసం — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "en": "Rasa Siddhi", "lang": "te", "shelf": "shk", "cover": "p-AfAjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=AfAjEgAAQBAJ", "blurbAny": "రసో వై సః — ఆయన రసమే అని తైత్తిరీయోపనిషత్తు చెప్పింది. రసశాస్త్రం అదే రసాన్ని పాదరసంగా చూసింది: చంచలమైన దాన్ని బంధించి, పద్దెనిమిది సంస్కారాలతో సిద్ధం చేసి, లోహాన్ని స్వర్ణంగా, దేహాన్ని అమృతదేహంగా మార్చే విద్య. ఈ కావ్యం ఇరవై నాలుగు చోట్ల ఆగి చూస్తుంది — రసం, పారదం, శివబీజం, స్వేదనం, మర్దనం, మూర్ఛనం, జారణం, రంజనం, వేధ, దేహవాదం, సిద్ధి — ఏ ప్రక్రియనూ చెప్పకుండా, అవి మనసులో చేసే పనిని. ఇది శాస్త్రానికి అనువాదం కాదు, సంక్షేపం కాదు, కథ కాదు; ప్రక్రియల విధానమూ కాదు. పేర్లున్న మనుషులు లేరు; కుప్పె, కొలిమి, నీరు, మంచు, లోహపు మెరుపు, బూడిద — ఇవే శాస్త్రాన్ని ప్రత్యక్షంగా, ఉపమానాలుగా చెబుతాయి."}, {"id": "p-Oe8jEgAAQBAJ", "title": "ज्योतिर्नेत्रम्", "sub": "चतुर्विंशतिः तारकाः, एकं नभः — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "full": "ज्योतिर्नेत्रम्: चतुर्विंशतिः तारकाः, एकं नभः — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "en": "JyortirNetraM", "lang": "sa", "shelf": "shk", "cover": "p-Oe8jEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=Oe8jEgAAQBAJ", "blurbAny": "ज्योतिषं वेदस्य चक्षुः — आकाशं कालं च पश्यन्ती विद्या (वेदाङ्गज्योतिषम्)। इदं काव्यं चतुर्विंशतौ स्थानेषु स्थित्वा पश्यति — कालः तिथिः वारः नक्षत्रं राशिः ग्रहाः अयनं ग्रहणं भूभ्रमणं युगानि लग्नं दशा मुहूर्तः कर्म च — ज्योतिषामपि तज्ज्योतिः इति यावत्। इदं शास्त्रस्य अनुवादः न, सङ्क्षेपः न, कथा न। नामयुक्ताः जनाः न सन्ति; तारा छाया घटिका नदी चक्रं दीपः च — एते एव शास्त्रं साक्षात् उपमारूपेण च वदन्ति। कालगणना खगोलविज्ञानं च काव्येन गृहीतम्; भविष्यफलानि न। कालः अस्मासु कथं चलति, वयं काले कथं तिष्ठामः इति दर्शनम् एव काव्यम्। प्रतिपङ्क्तिः द्वयोः अर्धयोः, मध्ये यत्या; युग्मरूपेण अन्त्यानुप्रासः। आन्ध्रमूलस्य अयं संस्कृतानुवादः; आन्ध्रमूलं पृथक् प्रकाशितम्; ग्रन्थान्ते ज्यौतिषकोशः।"}, {"id": "p--O4jEgAAQBAJ", "title": "జ్యోతిర్నేత్రం", "sub": "ఇరవై నాలుగు చుక్కలు, ఒకే ఆకాశం — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "full": "జ్యోతిర్నేత్రం: ఇరవై నాలుగు చుక్కలు, ఒకే ఆకాశం — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "en": "Jyotir Netram", "lang": "te", "shelf": "shk", "cover": "p--O4jEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=-O4jEgAAQBAJ", "blurbAny": "జ్యోతిషం వేదానికి కన్ను — ఆకాశాన్ని, కాలాన్ని చూసే శాస్త్రం (వేదాంగ జ్యోతిషం). ఈ కావ్యం ఇరవై నాలుగు చోట్ల ఆగి చూస్తుంది — కాలం, తిథి, వారం, నక్షత్రం, రాశి, గ్రహాలు, అయనం, గ్రహణం, భూభ్రమణం, యుగాలు, లగ్నం, దశ, ముహూర్తం, కర్మ — జ్యోతిషామపి తజ్జ్యోతిః వరకు. ఇది శాస్త్రానికి అనువాదం కాదు, సంక్షేపం కాదు, కథ కాదు. పేర్లున్న మనుషులు లేరు; చుక్క, నీడ, గడియ, నది, చక్రం, దీపం — ఇవే శాస్త్రాన్ని ప్రత్యక్షంగా, ఉపమానాలుగా చెబుతాయి. కాలగణన, ఖగోళ విజ్ఞానమే కావ్యం తీసుకున్నది; భవిష్యత్తు చెప్పే ఫలితాలు కావు. కాలం మనలో ఎలా నడుస్తుందో, మనం కాలంలో ఎలా నిలుస్తామో చూడడమే కావ్యం. ప్రతి పంక్తి రెండు అర్ధాలుగా, మధ్య యతితో; జంటగా అంత్యప్రాస. సంస్కృత భావానువాదం జ్యోతిర్నేత్రమ్ పేరుతో విడిగా; గ్రంథాంతంలో జ్యౌతిషకోశం."}, {"id": "p-NPQjEgAAQBAJ", "title": "वास्तुपुरुषः", "sub": "द्वाविंशतिः दृश्यानि, एकं गृहम् — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "full": "वास्तुपुरुषः: द्वाविंशतिः दृश्यानि, एकं गृहम् — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "en": "Vaastu PurushaH", "lang": "sa", "shelf": "shk", "cover": "p-NPQjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=NPQjEgAAQBAJ", "blurbAny": "वास्तु नाम वसनार्हं स्थानम्। मयमतं मानसारः समराङ्गणसूत्रधारश्च वास्तु भूमिः हर्म्यं यानं शयनम् इति चतुर्धा अवदन्। इदं काव्यं द्वाविंशतौ स्थानेषु स्थित्वा पश्यति — भूपरीक्षा दिशः मण्डलं ब्रह्मस्थानं द्वारं स्तम्भः ग्रामः देवालयः गृहप्रवेशश्च — गृहं देहः देहः गृहम् इति। इदं शास्त्रस्य अनुवादः न, सङ्क्षेपः न, कथा न। नामयुक्ताः जनाः न सन्ति; भूमिः जलं छाया दीपः अङ्गणं तोरणं च — एते एव शास्त्रं साक्षात् उपमारूपेण च वदन्ति। अद्यतनान् काचकोष्ठान्, पतत्रपरिहारान्, भयवर्धकान् नियमान् च काव्यं लघुना व्यङ्ग्येन शास्त्रस्य पार्श्वे स्थापयित्वा पश्यति। प्रतिपङ्क्तिः द्वयोः अर्धयोः, मध्ये यत्या; युग्मरूपेण अन्त्यानुप्रासः।"}, {"id": "p-cvMjEgAAQBAJ", "title": "వాస్తుపురుషం", "sub": "ఇరవై రెండు దృశ్యాలు, ఒకే గృహం — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "full": "వాస్తుపురుషం: ఇరవై రెండు దృశ్యాలు, ఒకే గృహం — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "en": "Vaastu Purusham", "lang": "te", "shelf": "shk", "cover": "p-cvMjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=cvMjEgAAQBAJ", "blurbAny": "వాస్తు అంటే వసించడానికి తగిన స్థలం. మయమతం, మానసారం, సమరాంగణసూత్రధారం వాస్తువును భూమి, హర్మ్యం, యానం, శయనం అనే నాలుగు రూపాలుగా చెప్పాయి. ఈ కావ్యం ఇరవై రెండు చోట్ల ఆగి చూస్తుంది — నేల పరీక్ష, దిక్కులు, మండలం, బ్రహ్మస్థానం, ద్వారం, స్తంభం, గ్రామం, దేవాలయం, గృహప్రవేశం — ఇల్లు దేహమని, దేహం ఇల్లని. ఇది శాస్త్రానికి అనువాదం కాదు, సంక్షేపం కాదు, కథ కాదు. పేర్లున్న మనుషులు లేరు; నేల, నీరు, నీడ, దీపం, ముంగిలి, తోరణం — ఇవే శాస్త్రాన్ని ప్రత్యక్షంగా, ఉపమానాలుగా చెబుతాయి. నేటి గాజు గూళ్ళను, రేకుల పరిహారాలను, భయం పెంచే నియమాలను కావ్యం చిన్న వ్యంగ్యంతో శాస్త్రం పక్కన నిలబెట్టి చూస్తుంది. ప్రతి పంక్తి రెండు అర్ధాలుగా, మధ్య యతితో; జంటగా అంత్యప్రాస."}, {"id": "p-vvIjEgAAQBAJ", "title": "यन्त्रारूढम्", "sub": "द्वाविंशतिः दृश्यानि, एकं चक्रम् — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "full": "यन्त्रारूढम्: द्वाविंशतिः दृश्यानि, एकं चक्रम् — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "en": "Yantraroodham", "lang": "sa", "shelf": "shk", "cover": "p-vvIjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=vvIjEgAAQBAJ", "blurbAny": "यन्त्रं नाम नियन्त्रकम्। भोजस्य समराङ्गणसूत्रधारः यन्त्रविधानम् अवर्णयत्; भास्कराचार्यस्य सिद्धान्तशिरोमणिः यन्त्राध्याये गोलघटीचक्रयन्त्राणि अवदत्; गीता मनुष्यं यन्त्रारूढम् इति आह। इदं काव्यं द्वाविंशतौ स्थानेषु स्थित्वा पश्यति — तुला चक्रम् अरघट्टः जलघटी तन्त्रम् रथः काष्ठपक्षी श्रीयन्त्रम् अद्यतनी कृत्रिमा मेधा च — कः चालयति इति प्रश्नं यावत्। इदं शास्त्रस्य अनुवादः न, सङ्क्षेपः न, कथा न। नामयुक्ताः जनाः न सन्ति; सूत्रं चक्रं कर्णधारः जलकुम्भः कीलकः दीपः च — एते एव शास्त्रं साक्षात् उपमारूपेण च वदन्ति। यन्त्रम् अनुकुर्वन्तं मनुष्यं मनुष्यम् अनुकुर्वत् यन्त्रं च काव्यं लघुना व्यङ्ग्येन शास्त्रस्य पार्श्वे स्थापयित्वा पश्यति।"}, {"id": "p-a_IjEgAAQBAJ", "title": "యంత్రారూఢం", "sub": "ఇరవై రెండు దృశ్యాలు, ఒకే చక్రం — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "full": "యంత్రారూఢం: ఇరవై రెండు దృశ్యాలు, ఒకే చక్రం — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "en": "Yantraarudham", "lang": "te", "shelf": "shk", "cover": "p-a_IjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=a_IjEgAAQBAJ", "blurbAny": "యంత్రం అంటే నియంత్రించేది. భోజుని సమరాంగణసూత్రధారం యంత్రవిధానాన్ని వివరించింది; భాస్కరాచార్యుని సిద్ధాంతశిరోమణి యంత్రాధ్యాయం గోళ, ఘటి, చక్ర యంత్రాలను చెప్పింది; గీత మనిషిని యంత్రారూఢుడని పిలిచింది. ఈ కావ్యం ఇరవై రెండు చోట్ల ఆగి చూస్తుంది — తుల, చక్రం, ఆరఘట్టం, జలఘటి, మగ్గం, రథం, కాష్ఠపక్షి, శ్రీయంత్రం, నేటి కృత్రిమ మేధ — ఎవరు నడుపుతున్నారన్న ప్రశ్న వరకు. ఇది శాస్త్రానికి అనువాదం కాదు, సంక్షేపం కాదు, కథ కాదు. పేర్లున్న మనుషులు లేరు; త్రాడు, చక్రం, చుక్కాని, నీటి కుండ, కీలు, దీపం — ఇవే శాస్త్రాన్ని ప్రత్యక్షంగా, ఉపమానాలుగా చెబుతాయి. యంత్రాన్ని అనుకరించే మనిషిని, మనిషిని అనుకరించే యంత్రాన్ని కావ్యం చిన్న వ్యంగ్యంతో శాస్త్రం పక్కన నిలబెట్టి చూస్తుంది."}, {"id": "p-28IjEgAAQBAJ", "title": "जीवनाष्टाध्यायी", "sub": "चतुःषष्टिः जीवनकलाः", "full": "जीवनाष्टाध्यायी: चतुःषष्टिः जीवनकलाः", "en": "Jeevanaastaadhyaayi", "lang": "sa", "shelf": "vyak", "cover": "p-28IjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=28IjEgAAQBAJ", "blurbAny": "अष्टाध्यायी अष्टौ अध्यायाः, चत्वारि सहस्राणि सूत्राणि — भाषायै। इदं पुस्तकम् अष्टौ अध्यायाः, चतुःषष्टिः सूत्राणि — जीवनाय। चतुःषष्टिः — चतुःषष्टिकलाः। जीवनं कला चेत् तस्य चतुःषष्टिः कलाः स्युः; ताः पाणिनिसूत्रेषु एव लब्धाः। सूत्रं किमपि नवं न लिखितम् — प्रत्येकम् अष्टाध्याय्याः एव, संख्यया सह। प्रतिसूत्रं काशिकारूपम् — सूत्रम्, वृत्तिः, उदाहरणम्, प्रत्युदाहरणम् — एकेन भेदेन: वृत्तिः जीवनवृत्तिः, उदाहरणम् एकः नरः, प्रत्युदाहरणं यत्र सा कला न प्रवर्तते। इत्, लोपः, आदेशः, आन्तरतम्यम्, एकसंज्ञा, विप्रतिषेधः, अधिकारः — पाणिनेः उपकरणानि एव जीवनकलाः। प्रतिजीवनवृत्तौ प्रतिपङ्क्तिः तत्सूत्रस्थेन एकेन पदेन एव समाप्यते।"}, {"id": "p-18EjEgAAQBAJ", "title": "జీవనాష్టాధ్యాయి", "sub": "అరవైనాలుగు జీవనకళలు (పాణిని సూత్రాలపై ఒక జీవనవృత్తి)", "full": "జీవనాష్టాధ్యాయి: అరవైనాలుగు జీవనకళలు (పాణిని సూత్రాలపై ఒక జీవనవృత్తి)", "en": "Jeevanaashtaadhyayi", "lang": "te", "shelf": "vyak", "cover": "p-18EjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=18EjEgAAQBAJ", "blurbAny": "అష్టాధ్యాయి ఎనిమిది అధ్యాయాలు, నాలుగు వేల సూత్రాలు — భాషకు. ఈ పుస్తకం ఎనిమిది అధ్యాయాలు, అరవైనాలుగు సూత్రాలు — బతుకుకు. అరవైనాలుగు — చతుష్షష్టి కళలు. జీవితం ఒక కళ అయితే దానికి అరవైనాలుగు కళలు ఉండాలి; ఆ అరవైనాలుగూ పాణిని సూత్రాల్లోనే దొరికాయి. సూత్రం ఏదీ కొత్తగా రాయలేదు — ప్రతిదీ అష్టాధ్యాయిలోనిదే, సంఖ్యతో సహా. ప్రతి సూత్రానికి కాశికా రూపం — సూత్రం, వృత్తి, ఉదాహరణం, ప్రత్యుదాహరణం — ఒక్క తేడాతో: వృత్తి జీవనవృత్తి, ఉదాహరణం ఒక మనిషి, ప్రత్యుదాహరణం ఆ కళ వర్తించని చోటు. ఇత్తు, లోపం, ఆదేశం, ఆంతరతమ్యం, ఏకసంజ్ఞ, విప్రతిషేధం, అధికారం — పాణిని పరికరాలే జీవనకళలు. ప్రతి జీవనవృత్తిలో ప్రతి పంక్తి ఆ సూత్రంలోని ఒక పదంతోనే ముగుస్తుంది."}, {"id": "p-vMgjEgAAQBAJ", "title": "सन्धिः", "sub": "पञ्चदश सन्धयः, द्वौ स्वरौ — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "full": "सन्धिः: पञ्चदश सन्धयः, द्वौ स्वरौ — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "en": "Samdhih", "lang": "sa", "shelf": "vyak", "cover": "p-vMgjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=vMgjEgAAQBAJ", "blurbAny": "\"परः सन्निकर्षः संहिता\" — अत्यन्तं सामीप्यम् एव संहिता। द्वे अक्षरे समीपे एकं परिवर्तते, द्वे वा, एकं लुप्यते वा, तृतीयं जायते वा। विद्या, आलयः — विद्यालयः: एकः आ गतः। देव, इन्द्रः — देवेन्द्रः: अः गतः, इः गतः, ए जातः। अस्मिन् काव्ये अक्षराणि मनुष्याः। पञ्चदश सर्गाः पञ्चदश सन्धयः; प्रतिसर्गं द्वौ — पूर्वपदम्, उत्तरपदम् — सीमायां मिलतः: विवाहः, प्रवासः, मैत्री, संस्था, ग्रामः। प्रथमम् एकः वदति, ततः अन्यः; अन्ते संहिता — कः गतः, किं जातम्। एकजातीययोः एकस्य लोपः, स्वरत्यागेन आधारत्वम्, चिह्नावशेषः, जातिपरिवर्तनम्, विलयः, सीमायां मृदूभावः, कठिनपार्श्वे काठिन्यम्, एकस्य श्वासस्य सीत्कारत्वं गीतत्वम् अग्नित्वम्।"}, {"id": "p-oMgjEgAAQBAJ", "title": "సంధి", "sub": "పదిహేను సంధులు, రెండు స్వరాలు — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "full": "సంధి: పదిహేను సంధులు, రెండు స్వరాలు — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "en": "Sandhi", "lang": "te", "shelf": "vyak", "cover": "p-oMgjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=oMgjEgAAQBAJ", "blurbAny": "\"పరః సన్నికర్షః సంహితా\" — అత్యంత సామీప్యమే సంహిత. రెండు అక్షరాలు దగ్గరగా వస్తే ఒకటి మారుతుంది, లేదా రెండూ, లేదా ఒకటి పోతుంది, లేదా మూడోది పుడుతుంది. విద్యా, ఆలయం — విద్యాలయం: ఒక ఆ పోయింది. దేవ, ఇంద్రుడు — దేవేంద్రుడు: అ పోయింది, ఇ పోయింది, ఏ పుట్టింది. ఈ కావ్యంలో అక్షరాలు మనుషులు. పదిహేను సర్గలు పదిహేను సంధులు; ప్రతి సర్గలో ఇద్దరు — పూర్వపదం, ఉత్తరపదం — ఒక హద్దు దగ్గర కలుస్తారు: పెళ్లి, వలస, స్నేహం, సంస్థ, ఊరు. ముందు ఒకరు మాట్లాడతారు, తరువాత ఇంకొకరు; చివరకు సంహిత — ఎవరు పోయారు, ఏమి పుట్టింది. ఒకే రకం ఇద్దరిలో ఒకరు పోవడం, స్వరం వదిలి ఊతం కావడం, గుర్తుగా మిగలడం, జాతి మారడం, కరగడం, హద్దు దగ్గర మెత్తబడటం, కఠినుడి పక్కన కఠినం అవడం, ఒకే ఊపిరి బుసగా, పాటగా, అగ్నిగా మారడం."}, {"id": "p-XMgjEgAAQBAJ", "title": "समासः", "sub": "द्वादश समासाः, द्वादश गृहाणि — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "full": "समासः: द्वादश समासाः, द्वादश गृहाणि — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "en": "SaMaasah", "lang": "sa", "shelf": "vyak", "cover": "p-XMgjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=XMgjEgAAQBAJ", "blurbAny": "\"सुपो धातुप्रातिपदिकयोः\" — समासे पूर्वपदं विभक्तिं नाशयति। राज्ञः पुरुषः — राजपुरुषः: राज्ञः इति गतम्। लुक् — अदर्शनम्। द्वे पदे एकं पदं भवितुम् एकस्य विभक्तिः गन्तव्या; गता कस्य इति समासः न वदति — विग्रहवाक्यं वदति। अस्मिन् काव्ये समासः गृहम्। द्वादश सर्गाः द्वादश समासाः — आश्रितः, दत्तः, कस्मैचित् वर्धितः शिशुः, भयं परितः निर्मितं गृहम्, कस्यचित् सेवकः, कूपमण्डूकः, वर्णः जाता समाना, संख्या जाताः चत्वारः, अन्यचिह्नत्वेन जीवितं युग्मम्, द्वौ स्थितौ भागिनौ, एकीभूतौ दम्पती, अपरिवर्तनीयः आचारः। प्रतिसर्गान्ते विग्रहफलकम् — तत् गृहं पुनः विभक्तं वाक्यम्। प्रतिसर्गं प्रतिपङ्क्तिः तत्सर्गस्य समासेन निर्मितेन पदेन एव समाप्यते।"}, {"id": "p-HsgjEgAAQBAJ", "title": "సమాసం", "sub": "పన్నెండు సమాసాలు, పన్నెండు ఇళ్లు — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "full": "సమాసం: పన్నెండు సమాసాలు, పన్నెండు ఇళ్లు — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "en": "Samaasam", "lang": "te", "shelf": "vyak", "cover": "p-HsgjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=HsgjEgAAQBAJ", "blurbAny": "\"సుపో ధాతుప్రాతిపదికయోః\" — సమాసంలో మొదటి పదం విభక్తిని కోల్పోతుంది. రాజ్ఞః పురుషః — రాజపురుషుడు: రాజు యొక్క పోయింది. లుక్ — కనిపించకుండా పోవడం. రెండు పదాలు ఒక పదం అవ్వాలంటే ఒకదాని విభక్తి పోవాలి; పోయినది ఎవరిదో సమాసం చెప్పదు — విగ్రహవాక్యం చెబుతుంది. ఈ కావ్యంలో సమాసం గేహం. పన్నెండు సర్గలు పన్నెండు సమాసాలు — ఆశ్రితుడు, దత్తుడు, దేనికోసమో పెరిగిన బిడ్డ, భయం చుట్టూ కట్టిన గేహం, ఎవరిదో అయిన సేవకుడు, బావిలో కప్ప, రంగు అయిన సమానురాలు, సంఖ్య అయిన నలుగురు, ఇంకొకరి గుర్తుగా బతికిన జంట, ఇద్దరూ నిలిచిన భాగస్వాములు, ఒకటైన దంపతి, మారని ఆచారం. ప్రతి సర్గ చివర ఒక విగ్రహఫలకం — ఆ గేహాన్ని తిరిగి విడదీసిన వాక్యం. ప్రతి సర్గలో ప్రతి పంక్తి ఆ సర్గపు సమాసంతో ఏర్పడిన పదంతోనే ముగుస్తుంది."}, {"id": "p-EskjEgAAQBAJ", "title": "विभक्तिः", "sub": "सप्त विभक्तयः, त्रीणि वचनानि — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "full": "विभक्तिः: सप्त विभक्तयः, त्रीणि वचनानि — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "en": "ViBhaktiH", "lang": "sa", "shelf": "vyak", "cover": "p-EskjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=EskjEgAAQBAJ", "blurbAny": "\"न केवला प्रकृतिः प्रयोक्तव्या\" — प्रातिपदिकं केवलं वाक्यं न प्रविशति; तस्मै विभक्तिः योज्या। अर्थवत्, अधातुः, अप्रत्ययः — प्रातिपदिकम्। अर्थः अस्ति, वाक्ये स्थानं नास्ति। स्थानार्थं पात्रम् — कर्ता, कर्म, करणम्, सम्प्रदानम्, अपादानम्, सम्बन्धः, अधिकरणम् — सप्त विभक्तयः। अस्मिन् काव्ये प्रातिपदिकं मनुष्यः। सप्त खण्डाः सप्त विभक्तयः; प्रतिखण्डम् एकः, द्वौ, सर्वे — त्रीणि वचनानि — एकविंशतिः सर्गाः।"}, {"id": "p-DMkjEgAAQBAJ", "title": "విభక్తి", "sub": "ఏడు విభక్తులు, మూడు వచనాలు — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "full": "విభక్తి: ఏడు విభక్తులు, మూడు వచనాలు — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "en": "ViBhakti", "lang": "te", "shelf": "vyak", "cover": "p-DMkjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=DMkjEgAAQBAJ", "blurbAny": "\"న కేవలా ప్రకృతిః ప్రయోక్తవ్యా\" — ప్రాతిపదికం ఒంటరిగా వాక్యంలోకి రాదు; దానికి ఒక విభక్తి తగలాలి. పాణిని చెప్పాడు — అర్థం ఉన్నది, ధాతువు కానిది, ప్రత్యయం కానిది — అదే ప్రాతిపదికం. అర్థం ఉంది, వాక్యంలో చోటు లేదు. చోటు కావాలంటే ఒక పాత్ర — కర్త, కర్మ, కరణం, సంప్రదానం, అపాదానం, సంబంధం, అధికరణం — ఏడు విభక్తులు. ఈ కావ్యంలో ప్రాతిపదికం మనిషి. ఏడు ఖండాలు ఏడు విభక్తులు; ప్రతి ఖండంలో ఒక్కడు, ఇద్దరు, అందరు — మూడు వచనాలు — ఇరవై ఒక్క సర్గలు."}, {"id": "p-osYjEgAAQBAJ", "title": "कारकम्", "sub": "षट् कारकाणि, त्रयः प्रयोगाः", "full": "कारकम्: षट् कारकाणि, त्रयः प्रयोगाः", "en": "Kaarakam", "lang": "sa", "shelf": "vyak", "cover": "p-osYjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=osYjEgAAQBAJ", "blurbAny": "\"स्वतन्त्रः कर्ता\" — क्रियायाः षट् सम्बन्धाः — कारकाणि; क्रियावचनस्य त्रयः मार्गाः — प्रयोगाः। कर्तरि कर्ता अग्रे — \"चालकः बालकम् अताडयत्\"। कर्मणि कर्ता तृतीयायां स्खलति, स्खलितः त्यक्तुं शक्यः — \"बालकः अताड्यत\"। भावे न कोऽपि — \"जातम्\"। एका घटना, त्रीणि वाक्यानि; उत्तरदायी एकस्मिन् अस्ति, एकस्मिन् कोष्ठके, एकस्मिन् नास्ति। अस्मिन् काव्ये षट् खण्डाः षट् कारकाणि; प्रतिखण्डम् एका घटना द्विः — सकृत् कर्तरि, सकृत् कर्मणि — दुर्घटना, अपसारणम्, निर्णयः, दानम्, रिक्तता, कक्षः। त्रयोदशः सर्गः भावे — षट् घटनाः एकस्मिन् पदे। प्रतिसर्गं प्रयोगफलकम् — सा घटना द्वयोः प्रयोगयोः, सरले गद्ये। कर्तरिसर्गेषु प्रतिपङ्क्तिः कर्तृकृतया क्रियया, कर्मणिसर्गेषु कर्मणिक्रियया, भावसर्गे अकर्तृकया क्रियया समाप्यते।"}, {"id": "p-6sUjEgAAQBAJ", "title": "కారకం", "sub": "ఆరు కారకాలు, మూడు ప్రయోగాలు (దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం)", "full": "కారకం: ఆరు కారకాలు, మూడు ప్రయోగాలు (దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం)", "en": "Kaarakam", "lang": "te", "shelf": "vyak", "cover": "p-6sUjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=6sUjEgAAQBAJ", "blurbAny": "\"స్వతన్త్రః కర్తా\" — స్వతంత్రుడు కర్త. క్రియకు ఆరు సంబంధాలు — కారకాలు; క్రియ చెప్పడానికి మూడు దారులు — ప్రయోగాలు. కర్తరిలో చేసినవాడు ముందు — \"డ్రైవరు పిల్లవాణ్ణి కొట్టాడు\". కర్మణిలో కర్త తృతీయకు జారుతాడు, జారినవాణ్ణి వదిలేయవచ్చు — \"పిల్లవాడు కొట్టబడ్డాడు\". భావేలో ఎవరూ లేరు — \"జరిగింది\". ఒకే సంఘటన, మూడు వాక్యాలు; బాధ్యుడు ఒకదానిలో ఉన్నాడు, ఒకదానిలో బ్రాకెట్లో, ఒకదానిలో లేడు. ఈ కావ్యంలో ఆరు ఖండాలు ఆరు కారకాలు; ప్రతి ఖండంలో ఒకే సంఘటన రెండుసార్లు — ఒకసారి కర్తరిలో, ఒకసారి కర్మణిలో — ఒక ప్రమాదం, ఒక తొలగింపు, ఒక తీర్పు, ఒక దానం, ఒక ఖాళీ, ఒక గది. పదమూడో సర్గ భావే — ఆరు సంఘటనలూ ఒకే పదంలో. ప్రతి సర్గకు ఒక ప్రయోగఫలకం — ఆ సంఘటన రెండు ప్రయోగాల్లో, సాదా వచనంలో."}, {"id": "p-bscjEgAAQBAJ", "title": "लकारः", "sub": "दश लकाराः, एकः दिवसः — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "full": "लकारः: दश लकाराः, एकः दिवसः — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "en": "LAkaarah", "lang": "sa", "shelf": "vyak", "cover": "p-bscjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=bscjEgAAQBAJ", "blurbAny": "\"लः कर्मणि च भावे चाकर्मकेभ्यः\" — क्रियायै कालं ददाति लकारः। पाणिनिः दश उक्तवान् — लट् लिट् लुट् लृट् लेट् लोट् लङ् लिङ् लुङ् लृङ्। एकः धातुः गम् — गच्छति, जगाम, गन्ता, गमिष्यति, गच्छाति, गच्छतु, अगच्छत्, गच्छेत्, अगमत्, अगमिष्यत्। एकं गमनम्; दश कालाः, दश मनांसि। अस्मिन् काव्ये एकः दिवसः — एका कन्या दूरनगरं वृत्त्यर्थं गच्छति यः प्रातःकालः। माता, पिता, पितामही, अनुजः, ग्रामः। तम् एकं दिवसं दशसु सर्गेषु दशवारम् — प्रतिसर्गम् एकैकस्मिन् लकारे; प्रतिसर्गं नव कण्ठाः — त्रयः पुरुषाः, त्रीणि वचनानि। श्रुतम्, श्वः, कदाचित्, पुराणभाषा, आज्ञा, अभ्यासः, नियमः, समाप्तम्, अजातम् — नवभ्यः कालेभ्यः एकः प्रातःकालः। प्रतिसर्गं प्रतिपङ्क्तिः तत्सर्गस्य लकाररूपेण एव समाप्यते।"}, {"id": "p-RMcjEgAAQBAJ", "title": "లకారం", "sub": "పది లకారాలు, ఒకే రోజు — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "full": "లకారం: పది లకారాలు, ఒకే రోజు — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "en": "LAkaaram", "lang": "te", "shelf": "vyak", "cover": "p-RMcjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=RMcjEgAAQBAJ", "blurbAny": "\"లః కర్మణి చ భావే చాకర్మకేభ్యః\" — క్రియకు కాలం ఇచ్చేది లకారం. పాణిని పది చెప్పాడు — లట్, లిట్, లుట్, లృట్, లేట్, లోట్, లఙ్, లిఙ్, లుఙ్, లృఙ్. ఒకే ధాతువు గమ్ — వెళ్తోంది, వెళ్ళిందట, వెళ్ళనుంది, వెళ్తుంది, వెళ్ళెదవు, వెళ్ళు, వెళ్ళేది, వెళ్ళాలి, వెళ్ళింది, వెళ్ళి ఉండేది. ఒకే వెళ్ళడం; పది కాలాలు, పది మనసులు. ఈ కావ్యంలో ఒకే రోజు — ఒక అమ్మాయి దూరపు పట్నానికి ఉద్యోగానికి వెళ్ళే ఉదయం. అమ్మ, నాన్న, నానమ్మ, తమ్ముడు, ఊరు. ఆ ఒక్క రోజును పది సర్గల్లో పదిసార్లు — ఒక్కో సర్గ ఒక్కో లకారంలో; ప్రతి సర్గలో తొమ్మిది గొంతులు — ముగ్గురు పురుషులు, మూడు వచనాలు. విన్నది, రేపు, ఎప్పుడో, పాత భాష, ఆజ్ఞ, అలవాటు, కట్టుబాటు, ముగిసింది, జరగనిది — తొమ్మిది కాలాల నుంచి ఒకే ఉదయం."}, {"id": "p-A8EjEgAAQBAJ", "title": "धातुपाठः", "sub": "अष्टादशधातूनां दार्शनिकं गद्यकाव्यम्", "full": "धातुपाठः: अष्टादशधातूनां दार्शनिकं गद्यकाव्यम्", "en": "Dhaatupaatah", "lang": "sa", "shelf": "vyak", "cover": "p-A8EjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=A8EjEgAAQBAJ", "blurbAny": "पाणिनीये धातुपाठे प्रत्येकस्य धातोः एकः अर्थः, एकः गणः, एकं पदं च। परस्मैपदे क्रियाफलं परान् गच्छति; आत्मनेपदे कर्तारम् एव; उभयपदे उभयतः। \"स्वरितञितः कर्त्रभिप्राये क्रियाफले\" इति एकस्मिन् सूत्रे पाणिनिना यत् उक्तं तत् न केवलं व्याकरणम्, जीवनधर्मः अपि — कर्मणः फलं यं प्राप्नोति तदेव पदं निश्चिनोति। अस्मिन् काव्ये धातुः मनुष्यः। अष्टादश धातवः — भू, मूल, धा, शास्, अन, रक्ष, यम, क्री, द्युत, भुज, लुभ, दृश्, वद, धृ, श्रु, स्मृ, सृ, कृ — अष्टादश सर्गाः; प्रतिसर्गं धातुपाठस्य शीर्षकमेव शीर्षकम्। तं धातुं पूर्वे कस्मिन् पदे अनयन्, इदं युगं कस्मिन् पदे नयति, तस्मिन् परिवर्तने किम् अक्षरं च्युतम् — मूलात् मूल्यम्, धर्मात् धरः, लोहात् लोभः, दर्शनात् प्रदर्शनम्, शास्त्रात् शस्त्रम्।"}, {"id": "p-TsAjEgAAQBAJ", "title": "ధాతుపాఠం", "sub": "అష్టాదశధాతువుల దార్శనిక వచన కావ్యం", "full": "ధాతుపాఠం: అష్టాదశధాతువుల దార్శనిక వచన కావ్యం", "en": "Dhatupaatham", "lang": "te", "shelf": "vyak", "cover": "p-TsAjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=TsAjEgAAQBAJ", "blurbAny": "పాణిని ధాతుపాఠంలో ప్రతి ధాతువుకూ ఒక అర్థం, ఒక గణం, ఒక పదం ఉంటాయి. పరస్మైపదం అయితే క్రియాఫలం పరులకు చేరుతుంది; ఆత్మనేపదం అయితే చేసినవాడికే; ఉభయపదం అయితే రెండు వైపులా. \"స్వరితఞితః కర్త్రభిప్రాయే క్రియాఫలే\" అనే ఒక్క సూత్రంలో పాణిని చెప్పినది వ్యాకరణమే కాదు, జీవనధర్మం కూడా: పని ఫలం ఎవరికి చేరుతుందో అదే పదాన్ని నిర్ణయిస్తుంది. ఈ కావ్యంలో ధాతువు మనిషి. పద్ధెనిమిది ధాతువులు — భూ, మూల, ధా, శాస్, అన, రక్ష, యమ, క్రీ, ద్యుత, భుజ, లుభ, దృశ్, వద, ధృ, శ్రు, స్మృ, సృ, కృ — పద్ధెనిమిది సర్గలు. ప్రతి సర్గకూ ధాతుపాఠంలోని శీర్షికే శీర్షిక."}, {"id": "p-EsgjEgAAQBAJ", "title": "प्रत्ययः", "sub": "अष्टादश प्रत्ययाः, एकं गृहम् — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "full": "प्रत्ययः: अष्टादश प्रत्ययाः, एकं गृहम् — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "en": "Pratyayah", "lang": "sa", "shelf": "vyak", "cover": "p-EsgjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=EsgjEgAAQBAJ", "blurbAny": "\"प्रत्ययः\" — पाणिनेः तृतीयाध्यायस्य प्रथमं सूत्रम्; ततः पञ्च अध्यायाः प्रत्ययविषये एव। धातोः पश्चात् प्रत्ययः — कृ + तृच् = कर्ता, कृ + क्त = कृतम्; प्रातिपदिकस्य तद्धितः — दशरथ + इञ् = दाशरथिः, धन + मतुप् = धनवान्; धातोः अन्तः सन्, यङ्, णिच्। एकः धातुः; प्रत्यये परिवृत्ते नरः परिवर्तते। अस्मिन् काव्ये एकं ग्रामगृहम्, तिस्रः पीढ्यः — गृहे न कस्यापि नाम, प्रत्ययाः एव नामानि। एकं पाषाणं क्षिप्त्वा आजीवनं कर्ता; एकस्यां स्पर्धायां पतित्वा आजीवनं जितः; पचन्ती पाचिका; पितृनाम्ना दाशरथिः; अन्यग्रामस्य परकीया; सता धनवान्; असारा इति उक्ता माता; परस्परापेक्षया द्वौ; वादनामानौ मित्रे; इच्छा, व्यसनम्, नियन्त्रणम्; कृत्वा कृत्वा किमपि वाक्यम् असमापयन्; भवन्ती सा; अर्धाय एव चिह्नितः प्रत्ययः।"}, {"id": "p--scjEgAAQBAJ", "title": "ప్రత్యయం", "sub": "పద్దెనిమిది ప్రత్యయాలు, ఒక గేహం — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "full": "ప్రత్యయం: పద్దెనిమిది ప్రత్యయాలు, ఒక గేహం — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "en": "Pratyayam", "lang": "te", "shelf": "vyak", "cover": "p--scjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=-scjEgAAQBAJ", "blurbAny": "\"ప్రత్యయః\" — పాణిని మూడో అధ్యాయం మొదటి సూత్రం; ఆ తరువాత ఐదు అధ్యాయాలు ప్రత్యయాల గురించే. ధాతువుకు వెనుక చేరేది ప్రత్యయం — కృ + తృచ్ = కర్త, కృ + క్త = కృతం; ప్రాతిపదికానికి చేరేది తద్ధితం — దశరథ + ఇ = దాశరథి, ధన + మతుప్ = ధనవంతుడు; ధాతువు లోపలే సన్, యఙ్, ణిచ్ — చేయాలని, మళ్ళీ మళ్ళీ, చేయించడం. ఒకే ధాతువు; ప్రత్యయం మారితే మనిషి మారతాడు. ఈ కావ్యంలో ఒక ఊరి గేహం, మూడు తరాలు — గేహంలో ఎవరికీ నామం లేదు, ప్రత్యయాలే నామాలు."}, {"id": "p-6MgjEgAAQBAJ", "title": "उपसर्गः", "sub": "एकः धातुः, विंशतिः उपसर्गाः — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "full": "उपसर्गः: एकः धातुः, विंशतिः उपसर्गाः — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "en": "UpaSargah", "lang": "sa", "shelf": "vyak", "cover": "p-6MgjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=6MgjEgAAQBAJ", "blurbAny": "\"उपसर्गेण धात्वर्थो बलादन्यत्र नीयते\" — उपसर्गः धातुं न परिवर्तयति; धात्वर्थं बलात् अन्यत्र नयति। हृ इति एकः धातुः — प्र-युक्तः प्रहारः, आ-युक्तः आहारः, सम्-युक्तः संहारः, वि-युक्तः विहारः, परि-युक्तः परिहारः। धातुः न चलितः; चलितं तत्पूर्वस्थितम् एकम् अक्षरम्। अस्मिन् काव्ये धातुः मनुष्यः — नामहीनः एकः नरः, हृ। पाणिन्युक्ताः उपसर्गाः विंशतिः सर्गाः, दश युग्मानि: सु–दुस्, प्र–परा, सम्–वि, अनु–प्रति, अधि–अप, उत्–अव, नि–निस्, अभि–अपि, अति–आ, परि–उप।"}, {"id": "p-1MgjEgAAQBAJ", "title": "ఉపసర్గం", "sub": "ఒకే ధాతువు, ఇరవై ఉపసర్గలు — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "full": "ఉపసర్గం: ఒకే ధాతువు, ఇరవై ఉపసర్గలు — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "en": "UpaSargam", "lang": "te", "shelf": "vyak", "cover": "p-1MgjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=1MgjEgAAQBAJ", "blurbAny": "\"ఉపసర్గేణ ధాత్వర్థో బలాదన్యత్ర నీయతే\" — ఉపసర్గ ధాతువును మార్చదు; ధాతువు అర్థాన్ని బలవంతంగా మరోచోటికి లాగుతుంది. హృ అనే ఒకే ధాతువు — మోయడం, తీసుకోవడం — ప్ర చేరితే ప్రహారం, ఆ చేరితే ఆహారం, సమ్ చేరితే సంహారం, వి చేరితే విహారం, పరి చేరితే పరిహారం. ధాతువు కదలలేదు; కదిలింది దానికి ముందు నిలిచిన ఒక్క అక్షరం. ఈ కావ్యంలో ధాతువు మనిషి — నామం లేని ఒక మనిషి, హృ. పాణిని చెప్పిన ఉపసర్గలు ఇరవై సర్గలు, పది జంటలుగా: సు–దుస్, ప్ర–పరా, సమ్–వి, అను–ప్రతి, అధి–అప, ఉత్–అవ, ని–నిస్, అభి–అపి, అతి–ఆ, పరి–ఉప."}, {"id": "p-5rMjEgAAQBAJ", "title": "करणम्", "sub": "अष्टोत्तरशतं चलनानि · एकः ग्रामः · कर्मणि देहाः (भरतनाट्यशास्त्रचतुर्थाध्याये एका जीवनवृत्तिः · आन्ध्रमूलस्य संस्कृतानुवादः_", "full": "करणम्: अष्टोत्तरशतं चलनानि · एकः ग्रामः · कर्मणि देहाः (भरतनाट्यशास्त्रचतुर्थाध्याये एका जीवनवृत्तिः · आन्ध्रमूलस्य संस्कृतानुवादः_", "en": "Karanam", "lang": "sa", "shelf": "natya", "cover": "p-5rMjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=5rMjEgAAQBAJ", "blurbAny": "भरतः नाट्यशास्त्रस्य चतुर्थे अध्याये अष्टोत्तरशतं करणानि अवदत् — हस्तः, पादः, देहः एकस्मिन् चलने मिलिताः चेत् करणम्; तलपुष्पपुटात् गङ्गावतरणं यावत्। नर्तकाय अवदत्। इदं पुस्तकं वदति — तानि अष्टोत्तरशतम् अपि रङ्गेण ऋणग्रहणात् पूर्वम् एव कर्मकारी देहः अकरोत्। एकः ग्रामः, एकं दिनम्, प्रत्यूषात् प्रत्यूषं यावत्। नव कर्मस्थानानि — कूपः, क्षेत्रम्, खलम्, तन्तुवायः, कुलालः, चुल्ली, लोहकारः, रजकतीर्थम्, श्मशानम् — प्रतिस्थानं द्वादश करणानि, भरतक्रमेण एव। प्रतिकरणं त्रयः भागाः: लक्षणम् (भरतमितौ इव हस्तः, पादः, देहः), कर्म (तत् चलनं कस्मिन् कर्मणि जातम्), फलम् (तत् चलनं किम् अकरोत् — जलम्, धान्यम्, वस्त्रम्, घटः, रोटिका, लोहम्, शुद्धिः, भस्म)।"}, {"id": "p-t7MjEgAAQBAJ", "title": "కరణం", "sub": "నూట ఎనిమిది కదలికలు · ఒక ఊరు · పనిలో దేహాలు (భరతుని నాట్యశాస్త్రం నాలుగో అధ్యాయంపై ఒక జీవనవృత్తి)", "full": "కరణం: నూట ఎనిమిది కదలికలు · ఒక ఊరు · పనిలో దేహాలు (భరతుని నాట్యశాస్త్రం నాలుగో అధ్యాయంపై ఒక జీవనవృత్తి)", "en": "Karanam", "lang": "te", "shelf": "natya", "cover": "p-t7MjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=t7MjEgAAQBAJ", "blurbAny": "భరతుడు నాట్యశాస్త్రం నాలుగో అధ్యాయంలో నూట ఎనిమిది కరణాలు చెప్పాడు — హస్తం, పాదం, దేహం ఒక్క చలనంలో కలిస్తే కరణం; తలపుష్పపుటం నుంచి గంగావతరణం వరకు. నర్తకుడికి చెప్పాడు. ఈ పుస్తకం అంటుంది — ఆ నూట ఎనిమిదీ రంగస్థలం అరువు తీసుకోకముందే పనిచేసే దేహం చేసేసింది. ఒక ఊరు, ఒక రోజు, తెల్లవారుజాము నుంచి తెల్లవారుజాము వరకు. తొమ్మిది పనిచోట్లు — బావి, పొలం, కల్లం, మగ్గం, కుమ్మరి, పొయ్యి, కొలిమి, రేవు, శ్మశానం — ఒక్కో చోట పన్నెండు కరణాలు, భరతుని వరుసలోనే. ప్రతి కరణానికి మూడు భాగాలు: లక్షణం (భరతుడు కొలిచినట్టే హస్తం, పాదం, దేహం), పని (ఆ కదలిక ఏ పనిలో జరిగిందో), ఫలం (ఆ కదలిక ఏం చేసిందో — నీళ్ళు, ధాన్యం, గుడ్డ, కుండ, రొట్టె, ఇనుము, శుభ్రత, బూడిద)."}, {"id": "p-ILcjEgAAQBAJ", "title": "సాత్త్విక", "sub": "ఎనిమిది దేహాలు · ఒక గది · ఒక ఉత్తరం (భరతుని నాట్యశాస్త్రం ఏడో అధ్యాయంపై ఒక జీవనవృత్తి)", "full": "సాత్త్విక: ఎనిమిది దేహాలు · ఒక గది · ఒక ఉత్తరం (భరతుని నాట్యశాస్త్రం ఏడో అధ్యాయంపై ఒక జీవనవృత్తి)", "en": "Saatvika", "lang": "te", "shelf": "natya", "cover": "p-ILcjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=ILcjEgAAQBAJ", "blurbAny": "భరతుడు నాట్యశాస్త్రం ఏడో అధ్యాయంలో ఎనిమిది సాత్త్వికభావాలు చెప్పాడు — స్తంభం, స్వేదం, రోమాంచం, స్వరభేదం, వేపథు, వైవర్ణ్యం, అశ్రు, ప్రలయం. శాస్త్రం మొత్తంలో దేహం అడగకుండా చేసేవి ఇవే — సత్త్వం నుంచి పుట్టి, మనసు లేకుండా రావు, మనసు ఆపినా ఆగవు. ఈ పుస్తకం అంటుంది — దేహం అబద్ధం చెప్పని ఒకే సాక్షి; కాని ఆ సాక్షి వివరించదు. ఒక ఇల్లు, ఒక గంట, ఒక ఉత్తరం. సాయంత్రం నాలుగు గంటలకు తపాలావాడు ఒక ఉత్తరం తెచ్చాడు. ఉత్తరంలో ఏముందో ఈ పుస్తకంలో ఎక్కడా లేదు. గదిలో ఎనిమిది దేహాలు — నాయనమ్మ, నాన్న, చెల్లి, అమ్మ, అన్న, తపాలావాడు, పక్కింటామె, పేరు ఉన్న ఆమె — ఒక్కో దేహానికి ఒక్కో సాత్త్వికం, భరతుని వరుసలోనే. అదే ఆరు క్షణాలు — తలుపు చప్పుడు, కవరు, పేరు, చింపడం, చదవడం, మడత — ఎనిమిదిసార్లు, ఎనిమిది దేహాల ద్వారా."}, {"id": "p-9rcjEgAAQBAJ", "title": "सात्त्विकम्", "sub": "अष्टौ देहाः · एकं गृहम् · एकं पत्रम्", "full": "सात्त्विकम्: अष्टौ देहाः · एकं गृहम् · एकं पत्रम्", "en": "SAtvikam", "lang": "sa", "shelf": "natya", "cover": "p-9rcjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=9rcjEgAAQBAJ", "blurbAny": "भरतः नाट्यशास्त्रस्य सप्तमे अध्याये अष्टौ सात्त्विकभावान् अवदत् — स्तम्भः, स्वेदः, रोमाञ्चः, स्वरभेदः, वेपथुः, वैवर्ण्यम्, अश्रु, प्रलयः। सम्पूर्णे शास्त्रे देहः अपृष्टः यत् करोति तत् एतत् — सत्त्वात् जाताः, मनसा विना न आगच्छन्ति, मनसा निरुद्धाः अपि न तिष्ठन्ति। इदं पुस्तकं वदति — देहः अनृतम् अवदन् एकः साक्षी; किन्तु सः साक्षी न व्याचष्टे। एकं गृहम्, एकः होरः, एकं पत्रम्। सायं चतुर्वादने पत्रवाहकः एकं पत्रम् आनयत्। पत्रे किम् अस्ति इति अस्मिन् पुस्तके कुत्रापि नास्ति। गृहे अष्टौ देहाः — पितामही, पिता, अनुजा, माता, भ्राता, पत्रवाहकः, प्रतिवेशिनी, नामयुक्ता सा — एकैकस्मै देहाय एकैकं सात्त्विकम्, भरतक्रमेण एव।"}, {"id": "p-MbMjEgAAQBAJ", "title": "दृष्टिः", "sub": "षट्त्रिंशत् दृष्टयः · एकः यात्रोत्सवः · एकम् अपि वचनं विना", "full": "दृष्टिः: षट्त्रिंशत् दृष्टयः · एकः यात्रोत्सवः · एकम् अपि वचनं विना", "en": "Drishtih", "lang": "sa", "shelf": "natya", "cover": "p-MbMjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=MbMjEgAAQBAJ", "blurbAny": "भरतः अष्टमे अध्याये षट्त्रिंशत् दृष्टीः अवदत् — अष्टभ्यः रसेभ्यः, अष्टभ्यः स्थायिभावेभ्यः, विंशतिभ्यः सञ्चारिभावेभ्यः; प्रतिदृष्टि पक्ष्म, तारा, भ्रूः किं कुर्यात् इति अलिखत्। इदं पुस्तकम् एकः यात्रोत्सवः, एकं दिनम् — मध्ये एकं नाट्यम्, परितः जनाः, परितः आपणाः। प्रथमाः अष्टौ दृष्टयः रङ्गे, पराः अष्टौ प्रेक्षकेषु, शेषाः विंशतिः उत्सवे सर्वत्र — रात्रिं यावत्। अस्मिन् पुस्तके एकम् अपि वचनं नास्ति। न कोऽपि किमपि वदति; सर्वे पश्यन्ति। प्रतिदृष्टि भरतस्य रूपम् — नेत्रम् (नेत्रं किम् अकरोत्), दृश्यम् (किं दृष्टम्), दर्शनम् (सा दृष्टिः कमपि मिलिता न वा)। दृष्टिनाम काव्ये कुत्रापि नास्ति; भरतः एव नाम ददाति। उत्सवे समाप्ते षट्त्रिंशत् नेत्राणि निमीलन्ति।"}, {"id": "p-A7MjEgAAQBAJ", "title": "దృష్టి", "sub": "ముప్పైఆరు దృష్టులు · ఒక జాతర · ఒక్క మాట లేకుండా — భరతుని నాట్యశాస్త్రం ఎనిమిదో అధ్యాయంపై ఒక జీవనవృత్తి", "full": "దృష్టి: ముప్పైఆరు దృష్టులు · ఒక జాతర · ఒక్క మాట లేకుండా — భరతుని నాట్యశాస్త్రం ఎనిమిదో అధ్యాయంపై ఒక జీవనవృత్తి", "en": "Dristhi", "lang": "te", "shelf": "natya", "cover": "p-A7MjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=A7MjEgAAQBAJ", "blurbAny": "భరతుడు ఎనిమిదో అధ్యాయంలో ముప్పైఆరు దృష్టులు చెప్పాడు — ఎనిమిది రసాలకు, ఎనిమిది స్థాయిభావాలకు, ఇరవై సంచారిభావాలకు; ప్రతి దృష్టికి రెప్ప, పాప, కనుబొమ ఏం చేయాలో రాశాడు. ఈ పుస్తకం ఒక జాతర, ఒక రోజు — మధ్యలో ఒక నాటకం, చుట్టూ జనం, చుట్టూ అంగళ్ళు. మొదటి ఎనిమిది దృష్టులు రంగస్థలం మీద, తరువాతి ఎనిమిది చూసేవాళ్ళలో, మిగిలిన ఇరవై జాతర నిండా — రాత్రి దాకా. ఈ పుస్తకంలో ఒక్క మాట లేదు. ఎవరూ ఏమీ అనరు; అందరూ చూస్తారు. ప్రతి దృష్టికి భరతుని రూపం — నేత్రం (నేత్రం ఏం చేసిందో), దృశ్యం (ఏది చూసిందో), దర్శనం (ఆ దృష్టి ఎవరినైనా కలిసిందో లేదో). దృష్టి నామం కవితలో ఎక్కడా లేదు; భరతుడు మాత్రమే నామం పెడతాడు. జాతర ముగిసినప్పుడు ముప్పైఆరు నేత్రాలు మూసుకుంటాయి. ఒక్కటి మూసుకోదు — ముప్పైఏడో దృష్టి, నామం లేనిది, ఉపసంహారంలో."}, {"id": "p-A7YjEgAAQBAJ", "title": "सञ्चारी", "sub": "त्रयस्त्रिंशत् भावाः · एकं गृहम् · एकं दिनम्", "full": "सञ्चारी: त्रयस्त्रिंशत् भावाः · एकं गृहम् · एकं दिनम्", "en": "SanchAri", "lang": "sa", "shelf": "natya", "cover": "p-A7YjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=A7YjEgAAQBAJ", "blurbAny": "भरतः अष्टौ स्थायिभावान् अवदत् — स्थायिनः। त्रयस्त्रिंशद् व्यभिचारिभावान् अवदत् — आगत्य गामिनः; सञ्चारिणः। इदं पुस्तकम् एकं गृहम्, एकं दिनम् — प्रत्यूषात् अर्धरात्रं यावत् अष्टौ यामाः; प्रतियामम् अधः एकः स्थायी, उपरि चत्वारः सञ्चारिणः। त्रयस्त्रिंशत् भरतक्रमेण एव — निर्वेदात् वितर्कं यावत्। प्रतिभावं भरतस्य स्वरूपम् — विभावः (केन उत्पन्नः), अनुभावः (शरीरं किम् अदर्शयत्), सञ्चारः (कथं गतः)। भावनाम काव्ये कुत्रापि नास्ति — भरतः एव नाम ददाति; गृहे न कोऽपि स्वस्य किं जातम् इति वदति। प्रतिभावस्य अन्त्यं पदं तस्य गमनम् — सञ्चारी इति गामी। गृहे न कस्यापि नाम — पितामही, पिता, माता, पुत्रः, पुत्री। श्वः पुत्रः नगरं गमिष्यति। तस्मिन् एकस्मिन् दिने त्रयस्त्रिंशत् भावाः अस्य गृहस्य मध्येन अचलन्।"}, {"id": "p-xbQjEgAAQBAJ", "title": "సంచారి", "sub": "ముప్పైమూడు భావాలు · ఒక గేహం · ఒక రోజు (భరతుని నాట్యశాస్త్రంపై ఒక జీవనవృత్తి)", "full": "సంచారి: ముప్పైమూడు భావాలు · ఒక గేహం · ఒక రోజు (భరతుని నాట్యశాస్త్రంపై ఒక జీవనవృత్తి)", "en": "Sanchaari", "lang": "te", "shelf": "natya", "cover": "p-xbQjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=xbQjEgAAQBAJ", "blurbAny": "భరతుడు ఎనిమిది స్థాయిభావాలు చెప్పాడు — నిలిచేవి. ముప్పైమూడు వ్యభిచారిభావాలు చెప్పాడు — వచ్చి పోయేవి; సంచారులు. ఈ పుస్తకం ఒక గేహం, ఒక రోజు — తెల్లవారుజాము నుంచి అర్ధరాత్రి వరకు ఎనిమిది యామాలు; ప్రతి యామానికి కింద ఒక స్థాయి, పైన నాలుగు సంచారులు. ముప్పైమూడూ భరతుని వరుసలోనే — నిర్వేదం నుంచి వితర్కం వరకు. ప్రతి భావానికి భరతుని సొంత రూపం — విభావం (ఏది పుట్టించిందో), అనుభావం (దేహం ఏం చూపించిందో), సంచారం (అది ఎలా వెళ్ళిపోయిందో). భావం నామం కవితలో ఎక్కడా ఉండదు — భరతుడు మాత్రమే నామం పెడతాడు; గేహంలో ఎవరూ తమకు ఏమైందో చెప్పరు. ప్రతి భావం చివరి మాట దాని వెళ్ళిపోవడం — సంచారి అంటే వెళ్ళేది. గేహంలో ఎవరికీ నామం లేదు — అమ్మమ్మ, నాన్న, అమ్మ, కొడుకు, కూతురు. రేపు కొడుకు పట్నం వెళ్తాడు."}, {"id": "p-mbIjEgAAQBAJ", "title": "अष्टनायिका", "sub": "एका सा · एकं गेहम् · अष्टौ रात्रयः — भरतस्य अष्टनायिकासु एका जीवनवृत्तिः", "full": "अष्टनायिका: एका सा · एकं गेहम् · अष्टौ रात्रयः — भरतस्य अष्टनायिकासु एका जीवनवृत्तिः", "en": "AshtaNayika", "lang": "sa", "shelf": "natya", "cover": "p-mbIjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=mbIjEgAAQBAJ", "blurbAny": "भरतः नाट्यशास्त्रस्य चतुर्विंशे अध्याये नायिकाम् अष्टसु अवस्थासु अपश्यत् — वासकसज्जा, विरहोत्कण्ठिता, स्वाधीनभर्तृका, कलहान्तरिता, खण्डिता, विप्रलब्धा, प्रोषितभर्तृका, अभिसारिका। अष्टौ स्त्रियः न, एकस्याः स्त्रियाः अष्टौ रात्रयः। इदं पुस्तकं तासाम् अष्टानां रात्रीणां पुस्तकम् — एका सा, एकं गेहम्, एकः मासः; प्रतिरात्रं चत्वारः यामाः, सन्ध्यायाः प्रत्यूषं यावत्। अस्मिन् पुस्तके सः एकवारम् अपि न दृश्यते। पदशब्दः, द्वारम्, निर्वाणः दीपः, एकं पत्रम्, स्कन्धे एकः गन्धः — एते एव सः। प्रतियामं त्रयः भागाः — द्वारम् (द्वारं किम् अकरोत्), चेष्टा (भरतोक्तम् इव तस्याः देहः किम् अकरोत्), यामः (सः यामः कथं समाप्तः)। प्रतियामम् अन्त्यं वचनं द्वारस्थितिः — पिहितम्, उद्घाटितम्। अष्टम्यां रात्रौ सा प्रस्थिता।"}, {"id": "p-LLIjEgAAQBAJ", "title": "అష్టనాయిక", "sub": "ఒక్క ఆమె · ఒక్క గేహం · ఎనిమిది రాత్రులు — భరతుని అష్టనాయికలపై ఒక జీవనవృత్తి", "full": "అష్టనాయిక: ఒక్క ఆమె · ఒక్క గేహం · ఎనిమిది రాత్రులు — భరతుని అష్టనాయికలపై ఒక జీవనవృత్తి", "en": "AshtaNayika", "lang": "te", "shelf": "natya", "cover": "p-LLIjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=LLIjEgAAQBAJ", "blurbAny": "భరతుడు నాట్యశాస్త్రం ఇరవై నాలుగో అధ్యాయంలో నాయికను ఎనిమిది అవస్థల్లో చూశాడు — వాసకసజ్జా, విరహోత్కంఠితా, స్వాధీనభర్తృకా, కలహాంతరితా, ఖండితా, విప్రలబ్ధా, ప్రోషితభర్తృకా, అభిసారికా. ఎనిమిది స్త్రీలు కాదు, ఒక్క స్త్రీకి ఎనిమిది రాత్రులు. ఈ పుస్తకం ఆ ఎనిమిది రాత్రుల పుస్తకం — ఒక్క ఆమె, ఒక్క గేహం, ఒక నెల; ప్రతి రాత్రికి నాలుగు యామాలు, సంధ్య నుంచి తెల్లవారుజాము వరకు. ఈ పుస్తకంలో అతను ఒక్కసారీ కనిపించడు. అడుగు చప్పుడు, తలుపు శబ్దం, ఆరిన దీపం, తలుపు కింద ఒక కాగితం, భుజం మీద ఒక వాసన, ఒక ఊపిరి — ఇవే అతను. ప్రతి పంక్తి రెండు అర్ధాలు, మధ్య ఒక విరామం; పంక్తుల చివర జంటగా అంత్యప్రాస."}, {"id": "rudrantaram-sanskrit", "title": "रुद्रान्तरम्", "sub": "एकादशदीपानामन्तर्यात्रा · द्विभागं वचनकाव्यम्", "full": "रुद्रान्तरम्: एकादशदीपानामन्तर्यात्रा", "en": "Rudrantaram (Sanskrit): an inner journey of the eleven lamps, a two-part vacana-kavya", "lang": "sa", "shelf": "rudra", "cover": "rudrantaram-sa", "play": "https://play.google.com/store/books/details?id=gwAiEgAAQBAJ", "blurbAny": "एका रात्रिः — दिवसे पतितमेकं परुषं वचो निद्रां हरति। दृढीकृता मुष्टिः, ईर्ष्यापूर्णं नयनम्, तूष्णीं दहन्ती वाक्, सन्ततेः कृते कम्पमानं भयम् — एकादशेन्द्रियाणामेकादश दीपानेकैकशः पश्यन्ती निशीथादुषसं यावल्लययात्रा, उषसो निशीथं यावत्पूर्णयात्रा। प्रतिदृश्यं कश्चित्प्राचीन ऋषिस्वरः — प्रत्यश्रु शिवोऽहम्।"}, {"id": "rudrantaram-telugu", "title": "రుద్రాంతరం", "sub": "ఏకాదశదీపాల అంతర్యాత్ర · ద్విభాగ వచనకావ్యం", "full": "రుద్రాంతరం: ఏకాదశదీపాల అంతర్యాత్ర", "en": "Rudrantaram (Telugu): an inner journey of the eleven lamps, a two-part vacana-kavya", "lang": "te", "shelf": "rudra", "cover": "rudrantaram-te", "play": "https://play.google.com/store/books/details?id=bwAiEgAAQBAJ", "blurbAny": "ఒక రాత్రి — దివసంలో పడిన ఒక పరుషవాక్యం నిద్రను హరిస్తుంది. బిగుసుకున్న పిడికిలి, ఈర్ష్యతో నిండిన నయనం, మౌనంగా రగిలే వాక్కు, సంతానం కోసం కంపించే భయం — ఏకాదశేంద్రియాల ఏకాదశదీపాలను ఒక్కొక్కటిగా దర్శిస్తూ నిశీథం నుంచి ఉషస్సు వరకు లయయాత్ర, ఉషస్సు నుంచి నిశీథం వరకు పూర్ణయాత్ర. ప్రతి దృశ్యంలోకీ ఒక ప్రాచీన ఋషిస్వరం — ప్రతి అశ్రువులో శివోఽహం."}, {"id": "p-GbAjEgAAQBAJ", "title": "गगनकुसुमानि", "sub": "असम्भवकाव्यमालिका", "full": "गगनकुसुमानि: असम्भवकाव्यमालिका", "en": "GaganaKusumani", "lang": "sa", "shelf": "misc", "cover": "p-GbAjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=GbAjEgAAQBAJ", "blurbAny": "किं गगने पुष्पं विकसति? किं शशस्य शृङ्गं प्ररोहति? किं मृगतृष्णायां जलं लभ्यते? भारतीयशास्त्रैः ‘असम्भवम्’ इति मुद्राङ्कितानि गगनकुसुम-शशशृङ्ग-वन्ध्यासुत-मृ गतृष्णाजलादीनि अलीकानि कविः अद्यतनजीवनस्य दर्पणे दर्शयति। यथासमयम् आरब्धा सभा, संक्षिप्तं भाषणम्, उत्कोचरहितं कार्यालयम्, दूरवाणीं विना एको दिवसः, असूयारहितो बन्धुः, एतान्यपि अस्माकं युगस्य गगनकुसुमानि। पञ्चाशत् मुक्तकविताः पञ्चसु खण्डेषु: अलीकवनम्, विपर्ययवीथी, न्यायनिकुञ्जः, लोकलीला, युगदर्पणम्। प्रत्येकस्याः कवितायाः शिरसि भर्तृहरि-कालिदास-गीता-उपनिषदा दिभ्यः काचित् सूक्तिः लौकिकन्यायो वा दीप इव द्योतते। उपमासौन्दर्यं पदलालित्यम् अर्थगौरवं चैतासां कवितानां प्राणाः। साक्षान्निन्दा नास्ति; चित्रमेव हासयति, हास एव विचारयति।"}, {"id": "p-RbAjEgAAQBAJ", "title": "గగనకుసుమాలు", "sub": "అసంభవ కావ్యమాలిక", "full": "గగనకుసుమాలు: అసంభవ కావ్యమాలిక", "en": "GaganaKusumalu", "lang": "te", "shelf": "misc", "cover": "p-RbAjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=RbAjEgAAQBAJ", "blurbAny": "ఆకాశానికి పువ్వు పూస్తుందా? కుందేటికి కొమ్ము మొలుస్తుందా? ఎండమావిలో నీరు దొరుకుతుందా? భారతీయ శాస్త్రాలు ‘అసంభవం’ అని ముద్ర వేసిన గగనకుసుమం, శశశృంగం, వంధ్యాసుతుడు, మృగతృష్ణాజలం వంటి అలీకాలను కవి నేటి జీవితపు అద్దంలో చూపిస్తారు. సమయానికి మొదలయ్యే సభ, రెండు నిమిషాల్లో ముగిసే ప్రసంగం, లంచం లేని కార్యాలయం, దూరవాణి లేని ఒక్క దినం, అసూయ లేని బంధువు: ఇవీ మన కాలపు గగనకుసుమాలే. యాభై వచనకవితలు, ఐదు ఖండాలు: అలీకవనం, విపర్యయవీథి, న్యాయనికుంజం, లోకలీల, యుగదర్పణం. ప్రతి కవిత శిరస్సున భర్తృహరి, కాళిదాసు, భగవద్గీత, ఉపనిషత్తుల నుండి ఒక సంస్కృత సూక్తి గానీ లౌకికన్యాయం గానీ దీపంలా నిలుస్తుంది. ఉపమల సొగసు, పదలాలిత్యం, అర్థగౌరవం ఈ కవితల ప్రాణం."}, {"id": "skt-lalita", "title": "चित्कला", "sub": "चैतन्योदयकाव्यम् · अष्टोत्तरशतसोपानानि", "full": "चित्कला", "lang": "sa", "shelf": "new-sa", "cover": "skt-pr-lalita", "play": "https://play.google.com/store/books/details?id=0uEhEgAAQBAJ", "blurbAny": "त्वया जप्यमानेषु नामसु तव जीवनस्य मानचित्रं निगूढं चेत्? चैतन्याग्निकुण्डात् समुद्भूता शक्ती रागं पाशत्वेन, क्रोधमङ्कुशत्वेन, मन इक्षुचापत्वेन करे धृत्वा स्थिता। अहङ्कारासुरस्य दाहको यः समरस्तया कृतः, स त्वय्येव प्रवर्तते। मूलाच्छिरःपर्यन्तं तयारूढानि सोपानानि तव मनसारोढव्यानि। उदयः, सङ्घर्षः, आरोहणम्, विस्तारः, ऐक्यम् — अष्टोत्तरशतसोपानेषु यत्र भावो रसत्वेन कामश्च सौन्दर्यत्वेन शुध्यति, तदिदं चैतन्योदयकाव्यम्।"}, {"id": "skt-vishnu", "title": "नरायणम्", "sub": "नरस्यायनम् · अष्टोत्तरशतसोपानानि", "full": "नरायणम्", "lang": "sa", "shelf": "new-sa", "cover": "skt-pr-vishnu", "play": "https://play.google.com/store/books/details?id=_eEhEgAAQBAJ", "blurbAny": "जिह्वायां नाम नृत्यति चेज्जपः; गमने नाम चलति चेज्जीवनम्। पुरुषपरम्परयास्माकं गृहेषु प्रतिध्वनन्ति यानि नामानि, तानि दूरस्थाय दैवताय प्रेष्यमाणाः स्तुतीर्न, अपि तु मानवमनसारोढव्यानि सोपानानि मत्वा पठति काव्यमिदम्। समग्रता, विस्तारः, त्यागः, कालजयः, सर्जनम्, धारणम् — प्रत्येकं नामैको जीवनपाठः। धर्मार्थकाममोक्षपादैश्चतुर्भिः प्रवहन्त्यष्टोत्तरशतसोपानानि — इदं नरस्यायनम्, एकस्य दीर्घस्यान्तरं पद्भ्यामतिक्रामन्ती यात्रा।"}, {"id": "skt-lakshmi", "title": "क्षीरमथनम्", "sub": "जीवनमथनकाव्यम् · अष्टोत्तरशतसोपानानि", "full": "क्षीरमथनम्", "lang": "sa", "shelf": "new-sa", "cover": "skt-pr-lakshmi", "play": "https://play.google.com/store/books/details?id=kOIhEgAAQBAJ", "blurbAny": "प्रथमं विषम्, ततोऽमृतम्, ततः परं श्रीः। सम्पद्विषये वक्तुं वयं सङ्कुचामः; किन्त्वस्माकं पूर्वजास्तां देवतारूपेणाराध्य तस्यै सहस्रं नामानि ग्रथितवन्तः। तेषु नामसु धनमस्ति, विद्यास्ति, कीर्तिरस्ति, धैर्यमस्ति, अन्ते मुक्तिरप्यस्ति। मथनम्, उद्भवः, वरणम्, पालनम्, श्रीवत्सः — श्रमादन्तःसम्पत्पर्यन्तमष्टोत्त रशतसोपानं जीवनमथनकाव्यम्; सम्पदं स्वयं चालयितुं शिक्षयन्ती यात्रा।"}, {"id": "skt-shiva", "title": "स्पन्दनम्", "sub": "निश्चलत्वस्य नादकाव्यम् · अष्टोत्तरशतसोपानानि", "full": "स्पन्दनम्", "lang": "sa", "shelf": "new-sa", "cover": "skt-pr-shiva", "play": "https://play.google.com/store/books/details?id=3eIhEgAAQBAJ", "blurbAny": "निश्चलत्वं यदा स्पन्दते तदा सृष्टिः; स्पन्दनं यदा निश्चलीभवति तदा मुक्तिः। हिमशिखरे किञ्चिन्मौनं वर्तते, सकलं सङ्गीतं यत्र विश्राम्यति। स्थैर्यं भीषणत्वं च, श्मशानं शृङ्गारश्च, भिक्षुर्विश्वेश्वरश्च यस्मिन्नेकस्मिन्नेव स्वरूपे समाविशन्ति, तन्मौनं वर्णयन्ति सहस्रं नामानि; तानि मानवस्यान्तर्मोक्षमार्गस्य सोपानरूपेण पठति काव्यमिदम्। न, म, शि, वा, य — पञ्चाक्षर्याः पञ्चाक्षराण्यनुसरदष्टोत्तरशतसो पानं निश्चलत्वस्य नादकाव्यम्।"}, {"id": "skt-mrigadarpanam", "title": "मृगदर्पणम्", "sub": "हास्यदर्पणे अद्यतनः समाजः", "full": "मृगदर्पणम्", "lang": "sa", "shelf": "vk-sa", "cover": "skt-Mrigadarpanam", "play": "https://play.google.com/store/books/details?id=f-MhEgAAQBAJ", "blurbAny": "नगरात् केनचिद् वात्याचक्रेण उत्क्षिप्तः कश्चन भग्नो दर्पणोऽटव्यां पतति। तस्मिन् प्रत्येकं मृगः स्वमुखं न पश्यति, अपि तु कस्यचिन्मनुष्यस्य मुखम्। स दर्पणो दश वनानि क्रमेणाटति — मनः, दाम्पत्यम्, कुटुम्बम्, यौवनम्, विद्या, वैद्यम्, कार्यालयः, राज्यम्, रक्षा न्यायश्च, विपणिश्चेति; अन्ते च आश्रमवने हंसकूर्मसिंहानां सन्निधौ विरमति। नेदं कथानकम्; पञ्चतन्त्रस्य मृगानेव दर्पणीकृत्य विरचितोऽयं मुक्तच्छन्दसां कवितानां सङ्ग्रहः। प्रत्येका कविता आयुर्वेदस्य क्रमेण प्रवर्तते — दृश्यम्, व्यङ्ग्यम्, वेदना च, इति रोगनिदानम्; ततः \"हे मनः, मा हस\" इत्यन्तर्मुखं परावर्तनम्, आचरणीयः प्रतीकारश्च, इति चिकित्सा।"}, {"id": "skt-phalashrutih", "title": "फलश्रुतिः", "sub": "एको मातामहः · एको दौहित्रः · फलपाठाः", "full": "फलश्रुतिः", "lang": "sa", "shelf": "vk-sa", "cover": "skt-Phalashrutih", "play": "https://play.google.com/store/books/details?id=oeMhEgAAQBAJ", "blurbAny": "नगरे विघटमानात् कस्माच्चित् कुटुम्बात्, चलभाष एव शरणं गृहीतवान् दशवर्षीयः कश्चन बालो ग्रीष्मावकाशे ग्रामस्थं मातामहस्योद्यानमायाति। मातामहस्तस्य करतले शुष्कमेकमाम्रास्थि निदधाति। युगादेरारभ्य पुनर्युगादिपर्यन्तम् — एकं वर्षम्, परिवर्तमानेष्वृतुषु — उद्यानस्यैकैकं फलमेकैको जीवनपाठो भवति। आम्रं धैर्यं शिक्षयति, कदली मातरम्, नारिकेलं पितरम्, पनसं कण्टकानां पृष्ठे निगूढं मधु, जम्बूर्वर्णमतीत्य पश्यन्तीं दृष्टिम्, बदरं जातिमतीतां भक्तिम्, द्राक्षा च मदमतीतं माधुर्यम्।"}, {"id": "skt-varnatitam", "title": "वर्णातीतम्", "sub": "वर्णानदृष्टवत्योर्दृशोः प्रकाशः", "full": "वर्णातीतम्", "lang": "sa", "shelf": "vk-sa", "cover": "skt-Varnatitam", "play": "https://play.google.com/store/books/details?id=u-MhEgAAQBAJ", "blurbAny": "दीपावलीरात्रौ — यदा सर्वो ग्रामः प्रकाशोत्सवे निमग्न आसीत् — कस्मिंश्चिद् गृहे जन्मनैव दृष्टिहीना काचिद् बालिका जाता। \"इतः परं त्वमेवास्या नेत्रे\" इति वदन्ती माता षड्वर्षीयस्याग्रजस्य करे तस्याः करं न्यधात्। यावज्जीवं स भ्राता स्वभगिन्यै वर्णान् वर्णयितुं प्रयतते — न चक्षुषा, अपि तु स्पर्शेन, गन्धेन, रसेन, ऊष्मणा च। रक्तः, काषायः, पीतः, हरितः, नीलः, नीली, नीललोहितश्च — प्रत्येको वर्णो जीवनस्य कश्चन परिवर्तः, किञ्चन मनोवैज्ञानिकं सत्यम्, काचन सामाजिकी पृच्छा। ग्रन्थे — • दार्शनिकं मुक्तच्छन्दःकाव्यम् · नव वर्णाः • प्रवेशिका · श्वेतः · रक्तः · काषायः · पीतः · हरितः · नीलः · नीली · नीललोहितः · कृष्णः — श्वेतः"}, {"id": "skt-pranadhara", "title": "प्राणधारा", "sub": "जीवनचक्रदार्शनिकं काव्यम्", "full": "प्राणधारा", "lang": "sa", "shelf": "vk-sa", "cover": "skt-Pranadhara", "play": "https://play.google.com/store/books/details?id=7-MhEgAAQBAJ", "blurbAny": "मातुः स्तन्यस्य प्रथमो बिन्दुः — सैव प्राणधारा। तस्मिन्नेकस्मिन्नेव बिन्दौ समग्रं जीवनं निहितम्; क्षेत्राणां विषं नगरस्य धूमश्च तत्रैव वर्तेते। पावित्र्यं प्रदूषणं चैकेनैव श्वासेन शिशुं प्रविशतः। इदं काव्यं तस्माद् बिन्दोः प्रभवति, एकं समग्रं जीवनं प्रवहति, पुनश्च तस्मिन्नेव बिन्दौ विरमति। इयं कस्यचित् सामान्यजनस्य कथा। नाम नास्ति; केवलम् 'अहम्'। गर्भः, बाल्यम्, पाठशाला, परीक्षाग्निः, उद्योगद्वारम्, प्रणयः, गृहस्थजीवनस्यार्थसागरः, मानसिकं पतनम्, पुनरुत्थानम्, सन्तानम्, वानप्रस्थम्, अन्ते च मरणं पुनर्जन्म चैकस्यामेव रात्रौ — इति द्वादश सर्गाः, द्वादश मासा इव एकं पूर्णं चक्रम्। नैताः पृथक्पृथक् कविताः; येन बिम्बेनैकः सर्गः समाप्यते, तेनैव बिम्बेन परः सर्ग आरभते।"}, {"id": "skt-pranayamithunam", "title": "प्रणयमिथुनम्", "sub": "जननाज्ज्योतिर्लयपर्यन्तम्", "full": "प्रणयमिथुनम्", "lang": "sa", "shelf": "vk-sa", "cover": "skt-Pranayamithunam", "play": "https://play.google.com/store/books/details?id=A-QhEgAAQBAJ", "blurbAny": "दोलायाश्चितापर्यन्तम् — जननम्, बाल्यम्, विद्या, कौमारम्, विरहः, मिलनम्, गार्हस्थ्यम्, सन्तानम्, मध्यवयः, वार्धक्यम्, वियोगः, परमार्थश्चेति द्वादशसु घट्टेषु प्रवहदिदं काव्यं प्रणयस्य प्रत्येकं रूपं दर्शयति — मातापित्रोः स्नेहम्, बाल्यसख्यम्, प्रथमप्रणयम्, दाम्पत्यप्रेम, सन्तानवात्सल्यम्, वार्धक्यस्य प्रेम च। ग्रन्थे — • दार्शनिकं मुक्तच्छन्दःकाव्यम् · द्वादश घट्टाः • प्रवेशिका · जननम् · बाल्यम् · विद्या · कौमारम् · विरहः · मिलनम् · गार्हस्थ्यम् · सन्तानम् · मध्यवयः · वार्धक्यम् · वियोगः · परमार्थः"}, {"id": "skt-pratipachakram", "title": "प्रतीपचक्रम्", "sub": "द्वादशराशिषु विलोमगामि मानसम्", "full": "प्रतीपचक्रम्", "lang": "sa", "shelf": "vk-sa", "cover": "skt-Pratipachakram", "play": "https://play.google.com/store/books/details?id=b-QhEgAAQBAJ", "blurbAny": "कस्यचिद् वृद्धस्य संस्कृताध्यापकस्य मनः शनैः शनैः विस्मृतिगर्ते स्खलति। स विस्मृतितरङ्गः ह्यस्तनीः स्मृतीः प्रथमं ग्रसते, बाल्यस्मृतीस्तु अन्तपर्यन्तं रक्षति। अतस्तस्य जीवितं पुत्र्याः नयनयोः पुरतः विलोमक्रमेण पुनरभिनीयते — वार्धक्यम्, मध्यवयः, दाम्पत्यम्, यौवनम्, कौमारम्, बाल्यम्, शैशवम्, जननं च। ग्रहाः कदाचिद् वक्रगत्या पश्चाद् गच्छन्त इव दृश्यन्ते। अस्मिन् काव्ये राशिचक्रमपि विलोमं परिभ्रमति — मीनादारभ्य मेषपर्यन्तम्। प्रत्येकं राशिः एकस्याः जीवनदशायाः प्रतीकम्; प्रतिदशं मनः कथं वर्धते, कथं क्षतं भवति, कथं पुनः स्वस्थं भवतीति सत्यानि — सिद्धान्तानां नामानि विना, केवलं दृश्यरूपेण — सजीवानि भवन्ति।"}, {"id": "skt-antarmanthanam", "title": "अन्तर्मन्थनम्", "sub": "दार्शनिकः कवितासङ्ग्रहः", "full": "अन्तर्मन्थनम्", "lang": "sa", "shelf": "vk-sa", "cover": "skt-Antarmanthanam", "play": "https://play.google.com/store/books/details?id=s-QhEgAAQBAJ", "blurbAny": "मन एव बन्धस्य मोक्षस्य च कारणमिति प्राचीनं दर्शनं वदति। अन्तर्मन्थनं नाम तस्मिन्नेव मनसि क्रियमाणा काचिदन्तर्यात्रा — षट्त्रिंशद् दीर्घकविताः, षड् भागाः, षट् सोपानानि। यथा मथिते समुद्रे तथा मथिते मनसि प्रथमं विषमुदेति, पश्चादमृतम्। प्रथमो भागोऽन्तःकरणम् — मनो बुद्धिश्चित्तमहङ्कारः सङ्कल्पः स्मृतिश्चेत्यान्तराणां करणानां परिचयः। द्वितीयो भागोऽरिषड्वर्गः — तदेव करणं कलुषयन्तः कामक्रोधादयः षट् शत्रवः। तृतीयो भागः षट्सम्पत्तिः — शमदमादयः षडान्तर्यः सम्पदः, तेषां शत्रूणामौषधानि। चतुर्थो भागो मानवीयमूल्यानि — सत्यम्, अहिंसा, क्षमा, दया, कृतज्ञता, विनयश्च। पञ्चमो भागोऽनुभूतयः — भयम्, आशा, विषादः, एकान्तः, मौनम्, सन्तोषश्च। षष्ठो भागः परमार्थः — कर्म, कालः, मृत्युः, वैराग्यम्, साक्षी, आनन्दश्च।"}, {"id": "skt-drkpatham", "title": "दृक्पथम्", "sub": "दृष्टेः पदचारः", "full": "दृक्पथम्", "lang": "sa", "shelf": "vk-sa", "cover": "skt-Drkpatham", "play": "https://play.google.com/store/books/details?id=zeQhEgAAQBAJ", "blurbAny": "एकस्यां रात्रौ दावानलस्य मध्ये द्वौ सङ्गच्छेते — दृष्टिहीना, किन्तु श्रमं न जानाना बलवती सा; पादहीनः, किन्तु दूराण्यपि द्रष्टुं क्षमः सः। यत् पश्यति तन्न चलति; यच्चलति तन्न पश्यति। सा तं स्वस्कन्धयोरारोपयति — स तस्यै मार्गं निर्दिशति। ज्वालाः परिहरद्भ्यां पर्वतशिखरं प्रति प्रवृत्ते तस्मिन् प्रयाणे तौ किञ्चिदुद्यानम्, काञ्चिद् यज्ञवाटिकाम्, काञ्चित् तर्कशालाम्, कञ्चित् कुम्भकारवाटम्, किञ्चिन्नदीतीरम्, किञ्चित् तन्तुवायगृहम्, किञ्चित् सरोवरम्, दीपत्रयमण्डपं चातिक्रामतः — प्रतिस्थानम् एको गुरुः, एका दृष्टिः, एकं सत्यम्, एका च सीमा।"}, {"id": "skt-svaraikyam", "title": "स्वरैक्यम्", "sub": "सप्तद्वीपा वसुन्धरा · सप्तस्वरयुता जीवनधारा", "full": "स्वरैक्यम्", "lang": "sa", "shelf": "vk-sa", "cover": "skt-Svaraikyam", "play": "https://play.google.com/store/books/details?id=5eQhEgAAQBAJ", "blurbAny": "पुराणानीमां भूमिं \"सप्तद्वीपा वसुन्धरा\" इति वदन्ति — जम्बूः, प्लक्षः, शाल्मलिः, कुशः, क्रौञ्चः, शाकः, पुष्करश्चेति सप्त द्वीपाः; तान् परितो लवणम्, इक्षुरसः, सुरा, सर्पिः, दधि, क्षीरम्, शुद्धोदकं चेति सप्त समुद्राः। अस्मिन् काव्ये ते सप्त द्वीपा एकस्य मनुष्यस्यान्तर्भूगोलः — जन्म, बाल्यम्, यौवनम्, गार्हस्थ्यम्, मध्यवयः, वार्धक्यम्, विमुक्तिश्च; सप्त समुद्रास्तासां दशानां सप्त रसाः; सङ्गीतस्य सप्त स्वराः — स रि ग म प ध नि — तया जीवनधारया गीताः सप्त रागाः। ग्रन्थे — • दार्शनिकं मुक्तच्छन्दःकाव्यम् · सप्त स्वराः • प्रवेशिका · षड्जः · ऋषभः · गान्धारः · मध्यमः · पञ्चमः · धैवतः · निषादः"}, {"id": "DasdEgAAQBAJ", "full": "Svadutam: स्वदूतम् (दार्शनिकं सन्देशमहाकाव्यम्)", "play": "https://play.google.com/store/books/details?id=DasdEgAAQBAJ", "cover": "DasdEgAAQBAJ", "en": "Svadutam: स्वदूतम् (दार्शनिकं सन्देशमहाकाव्यम्)", "title": "स्वदूतम्", "sub": "Svadutam", "lang": "sa", "shelf": "vk-sa", "blurbAny": "स्वदूतम् इति दशसर्गात्मकं षट्शतश्लोकसम्मितं नूतनं संस्कृतमहाकाव्यम्। कालिदासस्य मेघदूतात् प्रभृति प्रवृत्तायां सन्देशकाव्यपरम्परायाम् इदम् अभिनवं दार्शनिकं पदं निदधाति। पूर्वेषु सन्देशकाव्येषु प्रेषकः, दूतः, प्राप्ता च भिन्नाः भवन्ति; मेघो हंसः कोकिलो वा प्रियजनयोर्मध्ये वचनं वहति। अस्मिन् काव्ये तु प्रेषकः, दूतः, प्राप्ता, सन्देशश्चेति चत्वारोऽप्येक एव अहम्। नायकः सुमेधाः नदीतटे पितुश्चितां दृष्ट्वा अनिद्रां रात्रिं यापयति। प्रभाते सुषुप्तेः प्रत्यागतं स्वात्मानमेव उपनिषदुक्तं हंसं सम्बोध्य चतुरः प्रश्नान् सन्दिशति। कोऽहम्? जन्मनः पूर्वं किमासम्? मृत्योः परं क्व गम्यते? तयोर्मध्ये किं सत्यम्?"}, {"id": "skt-lokadarpanam", "title": "लोकदर्पणम्", "sub": "प्रथमः खण्डः · मृगदर्पणम् · फलश्रुतिः · वर्णातीतम्", "full": "लोकदर्पणम्", "lang": "sa", "shelf": "vk-sa", "cover": "skt-Lokadarpanam", "play": "https://play.google.com/store/books/details?id=ZeMhEgAAQBAJ", "blurbAny": "मृगदर्पणम् — हास्यदर्पणे अद्यतनः समाजः। नगरात् केनचिद् वात्याचक्रेण उत्क्षिप्तः कश्चन भग्नो दर्पणोऽटव्यां पतति। तस्मिन् प्रत्येकं मृगः स्वमुखं न पश्यति, अपि तु कस्यचिन्मनुष्यस्य मुखम्। स दर्पणो दश वनानि क्रमेणाटति — मनः, दाम्पत्यम्, कुटुम्बम्, यौवनम्, विद्या, वैद्यम्, कार्यालयः, राज्यम्, रक्षा न्यायश्च, विपणिश्चेति; अन्ते च आश्रमवने हंसकूर्मसिंहानां सन्निधौ विरमति। फलश्रुतिः — एकमुद्यानम् · एको मातामहः · एको दौहित्रः · षोडशफलानां पाठाः। नगरे विघटमानात् कस्माच्चित् कुटुम्बात्, चलभाष एव शरणं गृहीतवान् दशवर्षीयः कश्चन बालो ग्रीष्मावकाशे ग्रामस्थं मातामहस्योद्यानमायाति। मातामहस्तस्य करतले शुष्कमेकमाम्रास्थि निदधाति। वर्णातीतम् — वर्णानदृष्टवत्योर्दृशोः प्रकाशः।"}, {"id": "skt-pranavartanam", "title": "प्राणावर्तनम्", "sub": "द्वितीयः खण्डः · प्राणधारा · प्रणयमिथुनम् · प्रतीपचक्रम्", "full": "प्राणावर्तनम्", "lang": "sa", "shelf": "vk-sa", "cover": "skt-Pranavartanam", "play": "https://play.google.com/store/books/details?id=1eMhEgAAQBAJ", "blurbAny": "प्राणधारा — जीवनचक्रदार्शनिकं काव्यम्। मातुः स्तन्यस्य प्रथमो बिन्दुः — सैव प्राणधारा। तस्मिन्नेकस्मिन्नेव बिन्दौ समग्रं जीवनं निहितम्; क्षेत्राणां विषं नगरस्य धूमश्च तत्रैव वर्तेते। पावित्र्यं प्रदूषणं चैकेनैव श्वासेन शिशुं प्रविशतः। इदं काव्यं तस्माद् बिन्दोः प्रभवति, एकं समग्रं जीवनं प्रवहति, पुनश्च तस्मिन्नेव बिन्दौ विरमति। प्रणयमिथुनम् — जननाज्ज्योतिर्लयपर्यन्तम्। दोलायाश्चितापर्यन्तम् — जननम्, बाल्यम्, विद्या, कौमारम्, विरहः, मिलनम्, गार्हस्थ्यम्, सन्तानम्, मध्यवयः, वार्धक्यम्, वियोगः, परमार्थश्चेति द्वादशसु घट्टेषु प्रवहदिदं काव्यं प्रणयस्य प्रत्येकं रूपं दर्शयति — मातापित्रोः स्नेहम्, बाल्यसख्यम्, प्रथमप्रणयम्, दाम्पत्यप्रेम, सन्तानवात्सल्यम्, वार्धक्यस्य प्रेम च।"}, {"id": "skt-antardarshanam", "title": "अन्तर्दर्शनम्", "sub": "तृतीयः खण्डः · अन्तर्मन्थनम् · दृक्पथम् · स्वरैक्यम्", "full": "अन्तर्दर्शनम्", "lang": "sa", "shelf": "vk-sa", "cover": "skt-Antardarshanam", "play": "https://play.google.com/store/books/details?id=h-QhEgAAQBAJ", "blurbAny": "अन्तर्मन्थनम् — दार्शनिकः कवितासङ्ग्रहः। मन एव बन्धस्य मोक्षस्य च कारणमिति प्राचीनं दर्शनं वदति। अन्तर्मन्थनं नाम तस्मिन्नेव मनसि क्रियमाणा काचिदन्तर्यात्रा — षट्त्रिंशद् दीर्घकविताः, षड् भागाः, षट् सोपानानि। यथा मथिते समुद्रे तथा मथिते मनसि प्रथमं विषमुदेति, पश्चादमृतम्। दृक्पथम् — दृष्टेः पदचारः। एकस्यां रात्रौ दावानलस्य मध्ये द्वौ सङ्गच्छेते — दृष्टिहीना, किन्तु श्रमं न जानाना बलवती सा; पादहीनः, किन्तु दूराण्यपि द्रष्टुं क्षमः सः। यत् पश्यति तन्न चलति; यच्चलति तन्न पश्यति। सा तं स्वस्कन्धयोरारोपयति — स तस्यै मार्गं निर्दिशति। स्वरैक्यम् — सप्तद्वीपा वसुन्धरा · सप्तस्वरयुता जीवनधारा।"}, {"id": "skt-dashadipika", "title": "दशदीपिका", "sub": "दश दीपाः · दश मार्गाः · एकं ज्योतिः", "full": "दशदीपिका", "lang": "sa", "shelf": "vk-sa", "cover": "skt-Dashadipika", "play": "https://play.google.com/store/books/details?id=C-MhEgAAQBAJ", "blurbAny": "समाजं दृष्ट्वा हसितेषु क्षणेषु, एकस्य जीवनस्य मध्येन प्रवहन्तीष्वश्रुधारासु, मनसो गभीरेऽवतीर्णे निःशब्दे च — सर्वत्रैक एव प्रश्नो मामभ्यगात् — मनुष्यो नाम कः? इमानि दश काव्यानि तस्यैकस्य प्रश्नस्य दशभिर्द्वारैरन्विष्टान्युत्तरा णि। अत एवैतानि मयैकस्यां यात्रायां निवेशितानि — लोकादात्मपर्यन्तम्। प्रथमः खण्डः «लोकदर्पणम्» समाजस्य पुरतो दर्पणं धारयति; द्वितीयः खण्डः «प्राणावर्तनम्» एकमेव जीवनं गर्भाच्चितापर्यन्तं पुनर्जन्मपर्यन्तं च परिवर्त्य दर्शयति; तृतीयः खण्डः «अन्तर्दर्शनम्» अन्तर्मुखं परावर्तते; परिसमाप्तौ च «स्वदूतम्» — अन्वेष्टा, दूतः, प्रश्नः, उत्तरं च यत्र स्वयमेव, तद् दशसर्गात्मकं सन्देशमहाकाव्यम्।"}, {"id": "ucwdEgAAQBAJ", "full": "Geya Brahma Purāṇam - Sanskrit (गेयब्रह्मपुराणम्): श्रीब्रह्ममहापुराणम् - गेयरूपम् (The Complete Brahma Mahāpurāṇa as a Singable Poem)", "play": "https://play.google.com/store/books/details?id=ucwdEgAAQBAJ", "cover": "ucwdEgAAQBAJ", "en": "Geya Brahma Purāṇam - Sanskrit (गेयब्रह्मपुराणम्): श्रीब्रह्ममहापुराणम् - गेयरूपम् (The Complete Brahma Mahāpurāṇa as a Singable Poem)", "title": "गेयब्रह्मपुराणम्", "sub": "श्रीब्रह्ममहापुराणम्", "lang": "sa", "shelf": "geya-sa", "blurbAny": "अष्टादशपुराणेषु अन्यतमं ब्रह्मपुराणम् सरलगेयरूपेण — सृष्टिः, सूर्यचन्द्रवंशाः, भुवनकोशः, कोणार्कसूर्यमाहात्म्यम्, उमाशिवौ, एकाम्रपुरुषोत्तमक्षेत्रमाहात्म्य म्, सम्पूर्णं गौतमीमाहात्म्यं गोदावरीतीर्थैः सह, श्रीकृष्णचरितं, यमलोकः, धर्मः, साङ्ख्ययोगौ च — षोडशमात्रात्मके पादाकुलकच्छन्दसि ।"}, {"id": "qjoeEgAAQBAJ", "full": "Geya Padma Purāṇam — Sanskrit (गेयपद्मपुराणम्): श्रीपद्ममहापुराणम् — गेयरूपम् (The Complete Padma Mahāpurāṇa as a Singable Poem)", "play": "https://play. अष्टादशपुराणेषु अन्यतमं मत्स्यपुराणम् सरलगेयरूपेण — मत्स्यावतारः प्रलयनौका च, सृष्टिः, पितृवंशः श्राद्धं च, चन्द्रवंशे ययातिदेवयानीशर्मिष्ठाः, व्रतदानानि, प्रयागमाहात्म्यं, त्रिपुरदाहः, पार्वत्याः स्कन्दस्य च चरितं, नृसिंहः, तारकामयं युद्धं, वाराणसीनर्मदामाहात्म्ये, सावित्र्युपाख्यानं, राजधर्मः, वास्तुप्रतिमालक्षणं च — षोडशमात्रात्मके पादाकुलकच्छन्दसि ।"}, {"id": "YdAdEgAAQBAJ", "full": "Geya Garuḍa Purāṇam — Sanskrit (गेयगरुडपुराणम्): श्रीगरुडमहापुराणम् — गेयरूपम् (The Complete Garuḍa Mahāpurāṇa as a Singable Poem)", "play": "https://play.google.com/store/books/details?id=YdAdEgAAQBAJ", "cover": "YdAdEgAAQBAJ", "en": "Geya Garuḍa Purāṇam — Sanskrit (गेयगरुडपुराणम्): श्रीगरुडमहापुराणम् — गेयरूपम् (The Complete Garuḍa Mahāpurāṇa as a Singable Poem)", "title": "गेयगरुडपुराणम्", "sub": "श्रीगरुडमहापुराणम्", "lang": "sa", "shelf": "geya-sa", "blurbAny": "अष्टादशपुराणेषु अन्यतमं गरुडपुराणम् सरलगेयरूपेण — आचारकाण्डे — सृष्टिः, विष्णुपञ्जरं, विष्णुसहस्रनाम, पूजाविधिः, रत्नपरीक्षा, तीर्थानि, धर्मशास्त्रम्, आयुर्वेदः, नीतिसारः; प्रेतकल्पे — मरणोत्तरगतिः, यममार्गः, और्ध्वदेहिकं, दानं च; ब्रह्मकाण्डे — अवताराः वेङ्कटाचलमाहात्म्यं मोक्षश्च — षोडशमात्रात्मके पादाकुलकच्छन्दसि ।"}, {"id": "K80dEgAAQBAJ", "full": "Geya Brahmāṇḍa Purāṇam — Sanskrit (गेयब्रह्माण्डपुराणम्): श्रीब्रह्माण्डमहापुराणम् — गेयरूपम् (The Complete Brahmāṇḍa Mahāpurāṇa as a Singable Poem)", "play": "https://play.google.com/store/books/details?id=K80dEgAAQBAJ", "cover": "K80dEgAAQBAJ", "en": "Geya Brahmāṇḍa Purāṇam — Sanskrit (गेयब्रह्माण्डपुराणम्): श्रीब्रह्माण्डमहापुराणम् — गेयरूपम् (The Complete Brahmāṇḍa Mahāpurāṇa as a Singable Poem)", "title": "गेयब्रह्माण्डपुराणम्", "sub": "श्रीब्रह्माण्डमहापुराणम्", "lang": "sa", "shelf": "geya-sa", "blurbAny": "अष्टादशपुराणेषु अन्यतमं ब्रह्माण्डपुराणम् सरलगेयरूपेण — प्रक्रिया अनुषङ्गश्च — सृष्टिः, भुवनकोशः, युगधर्माः; उपोद्घातः — ऋषिवंशाः, श्राद्धकल्पः, भार्गवचरितं परशुरामकथा, सगरः, भगीरथः, वैवस्वतवंशः; उपसंहारः; ललितोपाख्यानं च — हयग्रीवागस्त्यसंवादे भण्डासुरवधः श्रीपुरवर्णनं च — षोडशमात्रात्मके पादाकुलकच्छन्दसि ।"}, {"id": "ZJsdEgAAQBAJ", "full": "Adhyayana and Adhigama (अध्ययनम् – अधिगमः): Theories of Learning in Indian Knowledge Systems compared with Western Educational Psychology", "play": "https://play.google.com/store/books/details?id=ZJsdEgAAQBAJ", "cover": "ZJsdEgAAQBAJ", "en": "Adhyayana and Adhigama (अध्ययनम् – अधिगमः): Theories of Learning in Indian Knowledge Systems compared with Western Educational Psychology", "title": "अध्ययनम् – अधिगमः", "sub": "Adhyayana and Adhigama", "lang": "sa", "shelf": "edu-sa", "vol": 1, "blurbAny": "How does a learner actually come to know? This first volume of the Indian Knowledge Tradition – Educational Psychology Series reconstructs the theories of learning embedded in India's intellectual traditions and sets them in a rigorous, criterion-based comparison with Western educational psychology. The book moves from the Vedic–Upaniṣadic model of śravaṇa, manana and nididhyāsana to pramāṇa-śāstra as a theory of how knowledge is generated, and to the doctrine of saṃskāra and vāsanā as an Indian account of retention and transfer."}, {"id": "GakdEgAAQBAJ", "full": "Puruṣārtha and Prayatna: पुरुषार्थः – प्रयत्नः", "play": "https://play.google.com/store/books/details?id=GakdEgAAQBAJ", "cover": "GakdEgAAQBAJ", "en": "Puruṣārtha and Prayatna: पुरुषार्थः – प्रयत्नः", "title": "पुरुषार्थः – प्रयत्नः", "sub": "Puruṣārtha and Prayatna", "lang": "sa", "shelf": "edu-sa", "vol": 2, "blurbAny": "Why does a student act at all — and why does one persevere where another gives up? The second volume of the series answers the question of motivation from within the Indian traditions, and then tests those answers against modern Western theory. Beginning from the four puruṣārthas as the ends that give desire its direction, the book examines the Nyāya–Vaiśeṣika mechanics of icchā, dveṣa and prayatna; the Mīmāṃsā theory of vidhi, niyoga and bhāvanā as a theory of what moves an agent; the roots of action in kleśa, karmāśaya and vāsanā in Yoga and Sāṅkhya; the Buddhist analysis of tṛṣṇā, chanda and cetanā; the Gītā's transformation of motivation through niṣkāma-karma; the Āyurvedic three …"}, {"id": "kqkdEgAAQBAJ", "full": "Triguṇa and Antaḥkaraṇa: त्रिगुणाः च अन्तःकरणम्", "play": "https://play.google.com/store/books/details?id=kqkdEgAAQBAJ", "cover": "kqkdEgAAQBAJ", "en": "Triguṇa and Antaḥkaraṇa: त्रिगुणाः च अन्तःकरणम्", "title": "त्रिगुणाः च अन्तःकरणम्", "sub": "Triguṇa and Antaḥkaraṇa", "lang": "sa", "shelf": "edu-sa", "vol": 3, "blurbAny": "Who is a person, what kind of person are they, and how did they become so? The third volume presents the Indian traditions' remarkably varied theories of personality and compares them carefully with Western personality psychology. The book explains the nature and function of sattva, rajas and tamas; the fourfold inner instrument of manas, buddhi, ahaṅkāra and citta; and Yoga's theory of citta-bhūmis and vṛttis as a science of personality. It asks how personality is bound by saṃskāra and character (śīla), and how far it can be changed."}, {"id": "uqkdEgAAQBAJ", "full": "Smṛti, Saṃskāra and Dhāraṇā: स्मृतिः – संस्कारः – धारणा", "play": "https://play.google.com/store/books/details?id=uqkdEgAAQBAJ", "cover": "uqkdEgAAQBAJ", "en": "Smṛti, Saṃskāra and Dhāraṇā: स्मृतिः – संस्कारः – धारणा", "title": "स्मृतिः – संस्कारः – धारणा", "sub": "Smṛti, Saṃskāra and Dhāraṇā", "lang": "sa", "shelf": "edu-sa", "vol": 4, "blurbAny": "For more than three thousand years India preserved vast bodies of text with near-perfect fidelity through memory alone. The fourth volume of the series asks how this was done, what theory of memory lay behind it, and what modern cognitive psychology can learn from it. Opening with the apparent paradox of verbatim mechanical repetition, the book analyses the structure of the Vedic oral tradition and explains the pāṭha methods of recitation in the language of cognitive science. It then examines smṛti within Indian pramāṇa-śāstra, dhāraṇā and the training of attention, the avadhāna tradition as a public demonstration of divided attention, and the Buddhist analysis of cognition."}, {"id": "5KkdEgAAQBAJ", "full": "Medhā, Prajñā and Adhikāribheda: मेधा – प्रज्ञा – अधिकारिभेदः", "play": "https://play.google.com/store/books/details?id=5KkdEgAAQBAJ", "cover": "5KkdEgAAQBAJ", "en": "Medhā, Prajñā and Adhikāribheda: मेधा – प्रज्ञा – अधिकारिभेदः", "title": "मेधा – प्रज्ञा – अधिकारिभेदः", "sub": "Medhā, Prajñā and Adhikāribheda", "lang": "sa", "shelf": "edu-sa", "vol": 5, "blurbAny": "Why do students differ in ability, and what should education do about it? The fifth volume explores the Indian traditions' theories of intelligence, insight and fitness for study, and weighs them against Western theories of intelligence and aptitude. The book sets out the eight qualities of intellect (dhī-guṇas) as a componential model of ability; Sāṅkhya's analysis of the dispositions of buddhi and its incapacities; the Jaina theory of ability as the removal and suppression of knowledge-obscuring karma; Āyurveda's medhā-rasāyana and the care of mental capacity; the triad of pratibhā, vyutpatti and abhyāsa — innate talent, learning and practice; the emergence of prajñā and the …"}, {"id": "_KkdEgAAQBAJ", "full": "Rasa, Bhāva and Kleśa: रसः – भावः – क्लेशः", "play": "https://play.google.com/store/books/details?id=_KkdEgAAQBAJ", "cover": "_KkdEgAAQBAJ", "en": "Rasa, Bhāva and Kleśa: रसः – भावः – क्लेशः", "title": "रसः – भावः – क्लेशः", "sub": "Rasa, Bhāva and Kleśa", "lang": "sa", "shelf": "edu-sa", "vol": 6, "blurbAny": "Emotion shapes how every student learns, yet educational psychology has seldom drawn on India's rich theories of feeling. The sixth volume brings rasa, bhāva and kleśa into the classroom. The book first explains why educational psychology needs a theory of emotion. It then sets out the structure of aesthetic emotion in rasa theory and re-reads rasa in the light of modern emotion science; analyses Yoga's classification of emotional disturbance as kleśa; and presents traditional methods of emotional regulation — the brahmavihāras, vairāgya and the discipline of the mind."}, {"id": "EKodEgAAQBAJ", "full": "Saṃskārā and Āśramā: संस्काराः – आश्रमाः", "play": "https://play.google.com/store/books/details?id=EKodEgAAQBAJ", "cover": "EKodEgAAQBAJ", "en": "Saṃskārā and Āśramā: संस्काराः – आश्रमाः", "title": "संस्काराः – आश्रमाः", "sub": "Saṃskārā and Āśramā", "lang": "sa", "shelf": "edu-sa", "vol": 7, "blurbAny": "From before birth to the final stage of life, Indian tradition mapped human development through the saṃskāras and the four āśramas. The seventh volume reads this map as a developmental psychology and compares it with Western lifespan theories. The book traces development in the Indian texts from pregnancy and birth, through infancy and childhood and their domestic (gṛhya) saṃskāras, to upanayana as the threshold of formal study and brahmacarya as a structured discipleship for adolescence. It continues through gṛhastha, vānaprastha and saṃnyāsa — adulthood and old age."}, {"id": "SKodEgAAQBAJ", "full": "Dhāraṇā, Dhyāna and Ekāgratā: धारणा – ध्यानम् – एकाग्रता", "play": "https://play.google.com/store/books/details?id=SKodEgAAQBAJ", "cover": "SKodEgAAQBAJ", "en": "Dhāraṇā, Dhyāna and Ekāgratā: धारणा – ध्यानम् – एकाग्रता", "title": "धारणा – ध्यानम् – एकाग्रता", "sub": "Dhāraṇā, Dhyāna and Ekāgratā", "lang": "sa", "shelf": "edu-sa", "vol": 8, "blurbAny": "In an age of distraction, the ancient Indian sciences of attention speak directly to the modern classroom. The eighth volume presents dhāraṇā, dhyāna and ekāgratā as a curriculum of attention and compares them with contemporary cognitive science. Starting from today's crisis of attention, the book reads Patañjali's aṣṭāṅga-yoga as an attention curriculum, examines the antarāyas (obstacles) and their diagnosis, and describes ekāgratā and the states of mind in Yoga. It then studies theories of consciousness in Indian philosophy and Buddhist attention training, before reviewing Western attention research and contemplative neuroscience — weighing both its evidence and its exaggerations."}, {"id": "UqodEgAAQBAJ", "full": "Sattvāvajaya and Kleśanivṛtti: सत्त्वावजयः – क्लेशनिवृत्तिः", "play": "https://play.google.com/store/books/details?id=UqodEgAAQBAJ", "cover": "UqodEgAAQBAJ", "en": "Sattvāvajaya and Kleśanivṛtti: सत्त्वावजयः – क्लेशनिवृत्तिः", "title": "सत्त्वावजयः – क्लेशनिवृत्तिः", "sub": "Sattvāvajaya and Kleśanivṛtti", "lang": "sa", "shelf": "edu-sa", "vol": 9, "blurbAny": "Student mental health has become one of the most urgent concerns in education. The ninth volume asks what India's traditions of diagnosis, guidance and healing of the mind can contribute, and sets them beside modern counselling and psychotherapy. The book presents sattvāvajaya, Āyurveda's psychotherapy; the Āyurvedic theory of diagnosis through prajñāparādha, doṣa and the causes of disorder; Yoga's programme for the removal of kleśas; the Bhagavad Gītā read as a counselling dialogue; Buddhist therapeutics; and guidance in traditional education."}, {"id": "bqodEgAAQBAJ", "full": "Parīkṣā and Pramāṇa: परीक्षा – प्रमाणानि", "play": "https://play.google.com/store/books/details?id=bqodEgAAQBAJ", "cover": "bqodEgAAQBAJ", "en": "Parīkṣā and Pramāṇa: परीक्षा – प्रमाणानि", "title": "परीक्षा – प्रमाणानि", "sub": "Parīkṣā and Pramāṇa", "lang": "sa", "shelf": "edu-sa", "vol": 10, "blurbAny": "Our examination culture runs without a theory of evaluation. The tenth and concluding volume of the Sanskrit series recovers India's own traditions of assessment, debate and certification, and sets them against Western educational measurement. The book treats parīkṣā as an epistemological category; śāstrārtha and vāda as performance-based assessment; the Vimāna-sthāna of the Caraka-saṃhitā as a classical assessment rubric; the certification of competence (adhikāra) and the conferring of honours; and the assessment of skill in recitation and reading. A structured review of Western educational measurement and of taxonomies of learning outcomes follows."}, {"id": "RfUZEgAAQBAJ", "full": "Śrī Navadurgā Laharī Mālā: श्रीनवदुर्गालहरीमाला", "play": "https://play.google.com/store/books/details?id=RfUZEgAAQBAJ", "cover": "RfUZEgAAQBAJ", "en": "Śrī Navadurgā Laharī Mālā: श्रीनवदुर्गालहरीमाला", "title": "श्रीनवदुर्गालहरीमाला", "sub": "Śrī Navadurgā Laharī Mālā", "lang": "sa", "shelf": "stotra", "blurbAny": "Śrī Navadurgā Laharī Mālā is a garland of nine new Sanskrit hymns (laharīs) composed for Śāradīya Navarātri, when the Divine Mother is worshipped each day in a different form. Each laharī is dedicated to one of the nine Durgās — Śailaputrī, Brahmacāriṇī, Candraghaṇṭā, Kūṣmāṇḍā, Skandamātā, Kātyāyanī, Kālarātri, Mahāgaurī and Siddhidātrī — and is meant to be recited on her day. Every laharī has twenty-one verses and a phalaśruti."}, {"id": "KfAZEgAAQBAJ", "full": "Aśvadhāṭī Nakṣatramālā: अश्वधाटीनक्षत्रमाला", "play": "https://play.google.com/store/books/details?id=KfAZEgAAQBAJ", "cover": "KfAZEgAAQBAJ", "en": "Aśvadhāṭī Nakṣatramālā: अश्वधाटीनक्षत्रमाला", "title": "अश्वधाटीनक्षत्रमाला", "sub": "Aśvadhāṭī Nakṣatramālā", "lang": "sa", "shelf": "stotra", "blurbAny": "The Aśvadhāṭī Stotra attributed to Kālidāsa has enchanted listeners for centuries with its galloping, horse-paced rhythm and the chiming repetition of the second syllable in every segment of the verse. Aśvadhāṭī Nakṣatramālā carries that rare and demanding form forward with twenty-seven new hymns by Yantrakavi Śrīnivāsa (Dr. Mantha Srinivasu)."}, {"id": "chitkala", "title": "చిత్కళ", "sub": "చైతన్యోదయ కావ్యం · 108 సోపానాలు", "full": "చిత్కళ", "lang": "te", "shelf": "new-te", "cover": "pr-lalita", "play": "https://play.google.com/store/books/details?id=EtkhEgAAQBAJ", "blurbAny": "నువ్వు జపించే నామాల్లో నీ జీవితపు పటం దాగి ఉంటే? చైతన్యపు అగ్నిగుండంలో పుట్టిన శక్తి, రాగాన్ని పాశంగా, క్రోధాన్ని అంకుశంగా, మనస్సును చెరకువిల్లుగా చేతబట్టి నిలిచింది. ఆమె అహంకారపు అసురుని దహించిన యుద్ధం నీలోనే జరుగుతోంది. మూలం నుండి శిరస్సు వరకు ఆమె ఎక్కిన మెట్లు నీ మనస్సు ఎక్కవలసిన మెట్లు. ఉదయం, సంఘర్షణ, ఆరోహణం, విస్తారం, ఐక్యం: నూట ఎనిమిది సోపానాల్లో భావం రసంగా, కామం సౌందర్యంగా శుద్ధమయ్యే చైతన్యోదయ కావ్యం."}, {"id": "narayanam", "title": "నరాయణం", "sub": "నరుని అయనం · 108 సోపానాలు", "full": "నరాయణం", "lang": "te", "shelf": "new-te", "cover": "pr-vishnu", "play": "https://play.google.com/store/books/details?id=WNkhEgAAQBAJ", "blurbAny": "నాలుక మీద నామం నర్తిస్తే జపం. నడకలో నామం నడిస్తే జీవితం. తరతరాలుగా మన ఇళ్ళలో ప్రతిధ్వనిస్తున్న నామాలను దూరపు దైవానికి పంపే స్తుతులుగా కాక, మనిషి మనస్సు ఎక్కవలసిన మెట్లుగా చదివే కావ్యమిది. సమగ్రత, విస్తారం, త్యాగం, కాలజయం, సృజనం, ధారణం: ప్రతి నామమూ ఒక జీవనపాఠం. ధర్మ, అర్థ, కామ, మోక్ష పాదాలుగా సాగే నూట ఎనిమిది సోపానాల నరుని అయనం. ఒక్క దీర్ఘం దూరాన్ని నడకతో దాటే ప్రయాణం."}, {"id": "kshiramathanam", "title": "క్షీరమథనం", "sub": "జీవనమథన కావ్యం · 108 సోపానాలు", "full": "క్షీరమథనం", "lang": "te", "shelf": "new-te", "cover": "pr-lakshmi", "play": "https://play.google.com/store/books/details?id=OtkhEgAAQBAJ", "blurbAny": "మొదట విషం, తర్వాత అమృతం, ఆ తర్వాతే శ్రీ. సంపద గురించి మాట్లాడటానికి సంకోచిస్తాం, కానీ మన పూర్వులు దాన్ని దేవతగా ఆరాధించి వేయి నామాలు అల్లారు. ఆ నామాలలో ధనమూ ఉంది, విద్యా ఉంది, కీర్తీ ఉంది, ధైర్యమూ ఉంది, చివరకు ముక్తీ ఉంది. మథనం, ఉద్భవం, వరణం, పాలనం, శ్రీవత్సం: శ్రమ నుండి అంతస్సంపద వరకు నూట ఎనిమిది సోపానాల జీవనమథన కావ్యం. సంపదను నడిపించడం నేర్పే నడక."}, {"id": "spandanam", "title": "స్పందనం", "sub": "నిశ్చలత్వపు నాదకావ్యం · 108 సోపానాలు", "full": "స్పందనం", "lang": "te", "shelf": "new-te", "cover": "pr-shiva", "play": "https://play.google.com/store/books/details?id=ANkhEgAAQBAJ", "blurbAny": "నిశ్చలత్వం స్పందించినప్పుడు సృష్టి, స్పందనం నిశ్చలమైనప్పుడు ముక్తి. హిమశిఖరంపై ఒక మౌనం ఉంది, సంగీతమంతా విశ్రమించే మౌనం. స్థిరత్వమూ భయంకరత్వమూ, శ్మశానమూ శృంగారమూ, భిక్షువూ విశ్వేశ్వరుడూ ఒకే స్వరూపంలో ఇమిడిన ఆ మౌనాన్ని వర్ణించే వేయి నామాలను మనిషి లోపలి మోక్షమార్గపు మెట్లుగా చదివే కావ్యమిది. న, మ, శి, , "sub": "శ్రీ గరుడ మహాపురాణము", "lang": "te", "shelf": "geya-te", "blurbAny": "అష్టాదశ పురాణములలో ఒకటైన గరుడ పురాణము సులభమైన గేయరూపమున — ఆచార కాండమున — సృష్టి, విష్ణు పంజరము, విష్ణు సహస్రనామము, పూజా విధి, రత్న పరీక్ష, తీర్థములు, ధర్మశాస్త్రము, ఆయుర్వేదము, నీతిసారము; ప్రేతకల్పమున — మరణానంతర గతి, యమమార్గము, ఔర్ధ్వదైహికము, దానము; బ్రహ్మ కాండమున — అవతారములు, వేంకటాచల మాహాత్మ్యము, మోక్షము."}, {"id": "P80dEgAAQBAJ", "full": "Geya Brahmāṇḍa Purāṇam — Telugu (గేయ బ్రహ్మాండ పురాణము): శ్రీ బ్రహ్మాండ మహాపురాణము — గేయరూపము (The Complete Brahmāṇḍa Mahāpurāṇa as a Singable Poem)", "play": "https://play.google.com/store/books/details?id=P80dEgAAQBAJ", "cover": "P80dEgAAQBAJ", "en": "Geya Brahmāṇḍa Purāṇam — Telugu (గేయ బ్రహ్మాండ పురాణము): శ్రీ బ్రహ్మాండ మహాపురాణము — గేయరూపము (The Complete Brahmāṇḍa Mahāpurāṇa as a Singable Poem)", "title": "గేయ బ్రహ్మాండ పురాణము", "sub": "శ్రీ బ్రహ్మాండ మహాపురాణము", "lang": "te", "shelf": "geya-te", "blurbAny": "అష్టాదశ పురాణములలో ఒకటైన బ్రహ్మాండ పురాణము సులభమైన గేయరూపమున — ప్రక్రియ, అనుషంగ పాదములు — సృష్టి, భువనకోశము, యుగధర్మములు; ఉపోద్ఘాతము — ఋషి వంశములు, శ్రాద్ధకల్పము, భార్గవ చరితము పరశురామ కథ, సగరుడు, భగీరథుడు, వైవస్వత వంశము; ఉపసంహారము; లలితోపాఖ్యానము — హయగ్రీవ అగస్త్య సంవాదమున భండాసుర వధ, శ్రీపుర వర్ణనము."}, {"id": "hqodEgAAQBAJ", "full": "Darśana: दर्शनम्", "play": "https://play.google.com/store/books/details?id=hqodEgAAQBAJ", "cover": "hqodEgAAQBAJ", "en": "Darśana: दर्शनम्", "title": "Darśana", "sub": "दर्शनम्", "lang": "en", "shelf": "edu-en", "blurbAny": "What is knowledge, that a school should transmit it? What is a person, that a person can be formed? What is education finally for? Darśana — \"seeing\", a way of viewing reality — asks the philosophical questions of education and answers them from the Indian traditions, in careful comparison with Western philosophies of education."}, {"id": "nKodEgAAQBAJ", "full": "Sādhana: साधनम्", "play": "https://play.google.com/store/books/details?id=nKodEgAAQBAJ", "cover": "nKodEgAAQBAJ", "en": "Sādhana: साधनम्", "title": "Sādhana", "sub": "साधनम्", "lang": "en", "shelf": "edu-en", "blurbAny": "Every prescription about teaching contains a psychological claim; the only question is whether it is stated or smuggled. Sādhana — \"the means\" — sets out the psychology embedded in the Indian traditions and holds it to a demanding standard: does it specify something a teacher could do and a researcher could check? In twenty-six chapters, written in English, this volume brings together the whole field of educational psychology."}, {"id": "sqodEgAAQBAJ", "full": "Nīti: नीतिः", "play": "https://play.google.com/store/books/details?id=sqodEgAAQBAJ", "cover": "sqodEgAAQBAJ", "en": "Nīti: नीतिः", "title": "Nīti", "sub": "नीतिः", "lang": "en", "shelf": "edu-en", "blurbAny": "Educational administration in India is practised every day, yet it is taught without a theory of its own. Nīti builds one from the Indian traditions of daṇḍanīti, the science of governance, and places it in disciplined comparison with modern administration and organisation theory. Drawing on the Arthaśāstra, Dharmaśāstra, Buddhist monastic law, inscriptions and the records of the great monastic universities, the book's twenty-six chapters examine the seven constituents of a polity (saptāṅga) as a model of an institution; capability and accomplishment (śakti and siddhi); site, buildings and space; endowment and finance (kośa); the law of self-governing bodies (śreṇī-dharma); deliberation, …"}, {"id": "FskdEgAAQBAJ", "full": "Geya Rāmāyaṇa (गेयरामायणम्): श्रीमद्वाल्मीकिरामायणम् — गेयरूपम् (The Complete Vālmīki Rāmāyaṇa as a Singable Poem)", "play": "https://play.google.com/store/books/details?id=FskdEgAAQBAJ", "cover": "FskdEgAAQBAJ", "en": "Geya Rāmāyaṇa (गेयरामायणम्): श्रीमद्वाल्मीकिरामायणम् — गेयरूपम् (The Complete Vālmīki Rāmāyaṇa as a Singable Poem)", "title": "गेयरामायणम्", "sub": "श्रीमद्वाल्मीकिरामायणम्", "lang": "sa", "shelf": "itihasa", "blurbAny": "Geya Rāmāyaṇam retells the entire Rāmāyaṇa of /* ॐ chant: 15 s, synthesised (a-u-m), plays once per visit on the first tap/click/key, and again whenever ॐ is pressed */
(function(){
  const cp=document.querySelector('.compass'),om=document.querySelector('.compass .om');if(!cp||!om)return;
  let AC=null,busy=false,tm;
  function glow(){cp.classList.remove('chant');void cp.offsetWidth;cp.classList.add('chant');clearTimeout(tm);tm=setTimeout(()=>cp.classList.remove('chant'),15200)}
  function chant(){
    try{
      AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
      if(busy)return;busy=true;setTimeout(()=>busy=false,15000);
      const c=AC,t0=c.currentTime+.05,f=136.1,out=c.createGain();out.gain.value=.22;
      const dl=c.createDelay(),fb=c.createGain(),dlf=c.createBiquadFilter();dl.delayTime.value=.23;fb.gain.value=.32;dlf.type='lowpass';dlf.frequency.value=900;
      out.connect(c.destination);out.connect(dl);dl.connect(dlf);dlf.connect(fb);fb.connect(dl);dlf.connect(c.destination);
      for(let k=0;k<3;k++){
        const s=t0+k*5,e=s+5.2,vg=c.createGain(),lp=c.createBiquadFilter(),fm=c.createBiquadFilter();
        lp.type='lowpass';lp.Q.value=4;fm.type='peaking';fm.Q.value=3;fm.gain.value=9;
        lp.frequency.setValueAtTime(1300,s);lp.frequency.linearRampToValueAtTime(1100,s+1.2);lp.frequency.linearRampToValueAtTime(560,s+2.1);lp.frequency.linearRampToValueAtTime(260,s+3.0);
        fm.frequency.setValueAtTime(760,s);fm.frequency.linearRampToValueAtTime(720,s+1.2);fm.frequency.linearRampToValueAtTime(330,s+2.1);fm.frequency.linearRampToValueAtTime(240,s+3.0);
        vg.gain.setValueAtTime(0,s);vg.gain.linearRampToValueAtTime(.9,s+.45);vg.gain.setValueAtTime(.9,s+2.4);vg.gain.linearRampToValueAtTime(.7,s+3.2);vg.gain.linearRampToValueAtTime(0,e);
        lp.connect(fm);fm.connect(vg);vg.connect(out);
        [[f,'sawtooth',.5],[f*1.003,'sawtooth',.35],[f/2,'sine',.6],[f*2,'triangle',.15]].forEach(([fr,ty,g])=>{
          const o=c.createOscillator(),og=c.createGain();o.type=ty;o.frequency.value=fr;og.gain.value=g;o.connect(og);og.connect(lp);o.start(s);o.stop(e+.1)});
      }
    }catch(e){}
    glow();
  }
  glow();
  let played=false;try{played=sessionStorage.getItem('sm-om')==='1'}catch(e){}
  const first=()=>{['pointerdown','keydown','touchstart'].forEach(ev=>removeEventListener(ev,first,true));if(played)return;played=true;try{sessionStorage.setItem('sm-om','1')}catch(e){}chant()};
  if(!played)['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,first,true));
  om.addEventListener('click',e=>{e.stopPropagation();played=true;try{sessionStorage.setItem('sm-om','1')}catch(_){}chant()});
  om.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();chant()}});
})();
