<title>Sanskrit Manthan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Telugu&family=Noto+Serif+Telugu:wght@400;600&family=Tiro+Devanagari+Sanskrit&family=Noto+Serif+Devanagari:wght@400;600&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: a reading hall — the four-direction compass around ॐ opens the page; below, the library as wooden shelves, one shelf per series, each a row of real covers. */
:root{
  --paper:#f6f1e7; --ink:#2b2118; --muted:#6f6152; --line:#ddd2bf; --card:#fffaf1;
  --saffron:#b4531f; --gold:#a07a2c; --wood:#c9b28a; --wood2:#a88a5c;
  --te-d:"Tiro Telugu","Noto Serif Telugu",serif; --te-b:"Noto Serif Telugu",serif;
  --dv-d:"Tiro Devanagari Sanskrit","Noto Serif Devanagari",serif; --dv-b:"Noto Serif Devanagari",serif;
  --la-d:"Spectral",Georgia,serif; --la-b:"Spectral",Georgia,serif;
  --display:var(--te-d); --body:var(--te-b);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#17130f;--ink:#efe5d4;--muted:#b3a591;--line:#3a3128;--card:#211b15;--saffron:#e08a55;--gold:#d2ad62;--wood:#5a4630;--wood2:#7a5f3c;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#17130f;--ink:#efe5d4;--muted:#b3a591;--line:#3a3128;--card:#211b15;--saffron:#e08a55;--gold:#d2ad62;--wood:#5a4630;--wood2:#7a5f3c;color-scheme:dark}
html[lang="sa"],html[lang="hi"]{--display:var(--dv-d);--body:var(--dv-b)}
html[lang="en"]{--display:var(--la-d);--body:var(--la-b)}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.75 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--saffron)}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.te{font-family:var(--te-d)}.dv{font-family:var(--dv-d)}.la{font-family:var(--la-d)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px 18px;padding-block:10px;flex-wrap:wrap}
.brand{text-decoration:none;font-family:var(--display);font-size:clamp(1.6rem,3.2vw,2.05rem);font-weight:700;line-height:1.25;letter-spacing:.01em;
  background:linear-gradient(100deg,#8a3a12 0%,#b4531f 22%,#d9962e 38%,#fff1c4 48%,#e0a43a 56%,#b4531f 74%,#8a3a12 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.35)) drop-shadow(0 0 6px rgba(224,150,60,.35));animation:brandshine 6s ease-in-out infinite}
@keyframes brandshine{0%{background-position:100% 0}55%,100%{background-position:0 0}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand{background-image:linear-gradient(100deg,#c8692f 0%,#e08a55 22%,#f0c36a 38%,#fff6da 48%,#f0c36a 56%,#e08a55 74%,#c8692f 100%)}}
:root[data-theme="dark"] .brand{background-image:linear-gradient(100deg,#c8692f 0%,#e08a55 22%,#f0c36a 38%,#fff6da 48%,#f0c36a 56%,#e08a55 74%,#c8692f 100%)}
@media (prefers-reduced-motion:reduce){.brand{animation:none;background-position:30% 0}}
nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
nav a{text-decoration:none;color:var(--ink);padding:4px 10px;border-radius:999px;font-size:.95rem}
nav a:hover{background:var(--card);color:var(--saffron)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;color:var(--ink);padding:4px 10px;font-size:.88rem;cursor:pointer;line-height:1.5}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lang .dv{font-family:var(--dv-b)}.lang .te{font-family:var(--te-b)}.lang .la{font-family:var(--la-b)}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding-block:44px 34px}
.hero h1{font-size:clamp(2rem,4.4vw,3.3rem);line-height:1.3}
.hero h1 em{font-style:normal;color:var(--saffron)}
.hero p{color:var(--muted);max-width:38em;margin:14px 0 0}
.lead{font-family:var(--dv-d);color:var(--gold);font-size:1.1rem;margin-bottom:8px}
.compass{position:relative;aspect-ratio:1;max-width:440px;width:100%;margin-inline:auto}
.compass .om{position:absolute;inset:36% 36%;display:grid;place-items:center;font-family:var(--dv-d);font-size:clamp(2.6rem,7vw,4.2rem);color:var(--saffron);border-radius:50%;background:var(--card);border:1px solid var(--line)}
.compass svg{position:absolute;inset:0;width:100%;height:100%}
.compass .d{position:absolute;width:27%;text-align:center;text-decoration:none;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;font:inherit}
.compass .d img{width:100%;border-radius:3px;box-shadow:0 6px 18px rgba(0,0,0,.22);transition:transform .25s;display:block}
.compass .d:hover img{transform:translateY(-4px)}
.compass .d small{position:absolute;font-size:.74rem;color:var(--muted);line-height:1.2;white-space:nowrap;letter-spacing:.02em}
.d.s small{top:100%;left:0;right:0;margin-top:5px}
.d.n small{bottom:100%;left:0;right:0;margin-bottom:5px}
.d.e small{left:100%;top:0;bottom:0;margin-left:6px;writing-mode:vertical-rl;text-align:center}
.d.w small{right:100%;top:0;bottom:0;margin-right:6px;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center}
.compass{margin-block:28px}
.d.e{right:5%;top:30%}.d.s{left:36.5%;bottom:-6%}.d.w{left:5%;top:30%}.d.n{left:36.5%;top:-6%}
section{padding-block:30px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;margin-bottom:10px}
.sec-head h2{font-size:2rem}
.sec-head p{margin:0;color:var(--muted);font-size:.95rem}

.compass .rays{position:absolute;inset:6%;border-radius:50%;pointer-events:none;z-index:0;opacity:.28;
  background:repeating-conic-gradient(from 0deg,rgba(255,196,110,0) 0deg 7deg,rgba(255,196,110,.55) 7deg 9deg,rgba(255,196,110,0) 9deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 14%,rgba(0,0,0,.55) 34%,transparent 66%);mask:radial-gradient(circle,#000 14%,rgba(0,0,0,.55) 34%,transparent 66%);
  animation:omspin 60s linear infinite}
.compass .halo{position:absolute;inset:28%;border-radius:50%;pointer-events:none;z-index:0;opacity:.35;
  background:radial-gradient(circle,rgba(255,206,120,.75) 0%,rgba(255,170,80,.28) 40%,transparent 70%)}
.compass .om{z-index:1;cursor:pointer;transition:box-shadow .6s}

.compass.chant .halo{animation:haloup 15s ease-in-out forwards}

@keyframes omspin{to{transform:rotate(360deg)}}
@keyframes raysup{0%{opacity:.1;transform:scale(.7)}12%{opacity:.85}30%{opacity:.6}45%{opacity:.9}62%{opacity:.6}78%{opacity:.85}100%{opacity:.28;transform:scale(1)}}

@keyframes omglow{0%,100%{text-shadow:0 0 6px rgba(255,190,90,.35);box-shadow:0 0 0 rgba(255,180,80,0)}
  15%,48%,82%{text-shadow:0 0 14px rgba(255,214,140,1),0 0 34px rgba(255,170,70,.85),0 0 60px rgba(255,150,60,.55);box-shadow:0 0 38px rgba(255,180,80,.55)}

.compass .om{text-shadow:0 0 6px rgba(255,190,90,.35)}

  }
  const TG=[["new",["rudra"]],["sa",["new-sa","vk-sa","geya-sa","edu-sa","stotra"]],["te",["new-te","vk-te","geya-te"]],["en",["edu-en"]],["bi",["itihasa","kosha"]]];
  const TL={new:{te:"కొత్తవి",sa:"नूतनम्",hi:"नया",en:"New"},sa:{te:"సంస్కృతం",sa:"संस्कृतम्",hi:"संस्कृत",en:"Sanskrit"},te:{te:"తెలుగు",sa:"तेलुगु",hi:"तेलुगु",en:"Telugu"},en:{te:"ఆంగ్లం",sa:"आङ्ग्लम्",hi:"अंग्रेज़ी",en:"English"},bi:{te:"సంస్కృతం · తెలుగు",sa:"संस्कृतम् · तेलुगु",hi:"संस्कृत · तेलुगु",en:"Sanskrit · Telugu"}};
  const tocById=Object.fromEntries(toc.map(a=>[a.match(/#sh-([\w-]+)/)[1],a]));
  $("#toc").innerHTML=TG.map(([g,ids])=>{const as=ids.filter(i=>tocById[i]).map(i=>tocById[i]);return as.length?`<div class="tr"><span class="tl">${esc(TL[g][L])}</span><span class="ta">${as.join("")}</span></div>`:""}).join("");$("#shelves").innerHTML=html.join("")||`<p class="count">${esc(u.none)}</p>`;
  $("#count").textContent=`${seen.size} ${u.books}`;
  $("#alb").textContent=u.aboutlbl;$("#aname").textContent=u.name;$("#role").textContent=u.role;
  $("#bio").innerHTML=u.bio.map(p=>`<p>${esc(p)}</p>`).join("");$("#cp").textContent=u.copy;
  $("#foot").textContent=u.foot;$("#fsh").textContent=u.sharesite;$("#fshr").innerHTML=shareLinks(location.origin+location.pathname,u.brand+" · "+u.name);$("#dclose").textContent=u.close;
}

/* ॐ chant: 15 s, synthesised (a-u-m), plays once per visit on the first tap/click/key, and again whenever ॐ is pressed */
(function(){
  const cp=document.querySelector('.compass'),om=document.querySelector('.compass .om');if(!cp||!om)return;
  let AC=null,busy=false,tm;
  function glow(){cp.classList.remove('chant');void cp.offsetWidth;cp.classList.add('chant');clearTimeout(tm);tm=setTimeout(()=>cp.classList.remove('chant'),15200)}
  function chant(){
    try{
      AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
      if(busy)return;busy=true;setTimeout(()=>busy=false,15000);
      const c=AC,t0=c.currentTime+.05,f=136.1,out=c.createGain();out.gain.value=.22;
      const dl=c.createDelay(),fb=c.createGain(),dlf=c.createBiquadFilter();dl.delayTime.value=.23;fb.gain.value=.32;dlf.type='lowpass';dlf.frequency.value=900;
      out.connect(c.destination);out.connect(dl);dl.connect(dlf);dlf.connect(fb);fb.connect(dl);dlf.connect(c.destination);
      for(let k=0;k<3;k++){
        const s=t0+k*5,e=s+5.2,vg=c.createGain(),lp=c.createBiquadFilter(),fm=c.createBiquadFilter();
        lp.type='lowpass';lp.Q.value=4;fm.type='peaking';fm.Q.value=3;fm.gain.value=9;
        lp.frequency.setValueAtTime(1300,s);lp.frequency.linearRampToValueAtTime(1100,s+1.2);lp.frequency.linearRampToValueAtTime(560,s+2.1);lp.frequency.linearRampToValueAtTime(260,s+3.0);
        fm.frequency.setValueAtTime(760,s);fm.frequency.linearRampToValueAtTime(720,s+1.2);fm.frequency.linearRampToValueAtTime(330,s+2.1);fm.frequency.linearRampToValueAtTime(240,s+3.0);
        vg.gain.setValueAtTime(0,s);vg.gain.linearRampToValueAtTime(.9,s+.45);vg.gain.setValueAtTime(.9,s+2.4);vg.gain.linearRampToValueAtTime(.7,s+3.2);vg.gain.linearRampToValueAtTime(0,e);
        lp.connect(fm);fm.connect(vg);vg.connect(out);
        [[f,'sawtooth',.5],[f*1.003,'sawtooth',.35],[f/2,'sine',.6],[f*2,'triangle',.15]].forEach(([fr,ty,g])=>{
          const o=c.createOscillator(),og=c.createGain();o.type=ty;o.frequency.value=fr;og.gain.value=g;o.connect(og);og.connect(lp);o.start(s);o.stop(e+.1)});
      }
    }catch(e){}
    glow();
  }
  glow();
  let played=false;try{played=sessionStorage.getItem('sm-om')==='1'}catch(e){}
  const first=()=>{['pointerdown','keydown','touchstart'].forEach(ev=>removeEventListener(ev,first,true));if(played)return;played=true;try{sessionStorage.setItem('sm-om','1')}catch(e){}chant()};
  if(!played)['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,first,true));
  om.addEventListener('click',e=>{e.stopPropagation();played=true;try{sessionStorage.setItem('sm-om','1')}catch(_){}chant()});
  om.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();chant()}});
})();

/* alternate the four compass covers: Telugu 15 s, Sanskrit 15 s */
(function(){
  const cp=document.querySelector('.compass');if(!cp)return;
  const set=sk=>{cp.classList.toggle('skt',sk);cp.querySelectorAll('.d').forEach(b=>{b.dataset.id=sk?b.dataset.sa:b.dataset.te;const im=b.querySelector(sk?'img.sa':'img.te');b.setAttribute('aria-label',im.alt)})};
  let sk=false;set(sk);setInterval(()=>{sk=!sk;set(sk)},15000);
  cp.querySelector('.cl .lte').addEventListener('click',()=>{sk=false;set(sk)});cp.querySelector('.cl .lsa').addEventListener('click',()=>{sk=true;set(sk)});
})();
