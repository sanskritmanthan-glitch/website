  --paper:#f6f1e7; --ink:#2b2118; --muted:#6f6152; --line:#ddd2bf; --card:#fffaf1;
  --saffron:#b4531f; --gold:#a07a2c; --wood:#c9b28a; --wood2:#a88a5c;
  --te-d:"Tiro Telugu","Noto Serif Telugu",serif; --te-b:"Noto Serif Telugu",serif;
  --dv-d:"Tiro Devanagari Sanskrit","Noto Serif Devanagari",serif; --dv-b:"Noto Serif Devanagari",serif;
  --la-d:"Spectral",Georgia,serif; --la-b:"Spectral",Georgia,serif;
  --display:var(--te-d); --body:var(--te-b);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#17130f;--ink:#efe5d4;--muted:#b3a591;--line:#3a3128;--card:#211b15;--saffron:#e08a55;--gold:#d2ad62;--wood:#5a4630;--wood2:#7a5f3c;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#17130f;--ink:#efe5d4;--muted:#b3a591;--line:#3a3128;--card:#211b15;--saffron:#e08a55;--gold:#d2ad62;--wood:#5a4630;--wood2:#7a5f3c;color-scheme:dark}
html[lang="sa"],html[lang="hi"]{--display:var(--dv-d);--body:var(--dv-b)}
html[lang="en"]{--display:var(--la-d);--body:var(--la-b)}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.75 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--saffron)}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.te{font-family:var(--te-d)}.dv{font-family:var(--dv-d)}.la{font-family:var(--la-d)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px 18px;padding-block:10px;flex-wrap:wrap}
.bwrap{display:flex;flex-direction:column;align-items:center;gap:0;text-align:center}.tagl{font-family:var(--dv);font-size:clamp(.98rem,1.5vw,1.12rem);color:var(--gold);letter-spacing:.03em;margin-top:0;font-weight:600}.tagl.te{font-family:var(--te)}.tagl.la{font-family:var(--la);font-style:italic}
.brand{text-decoration:none;font-family:var(--display);font-size:clamp(1.6rem,3.2vw,2.05rem);font-weight:700;line-height:1.25;letter-spacing:.01em;
  background:linear-gradient(100deg,#8a3a12 0%,#b4531f 22%,#d9962e 38%,#fff1c4 48%,#e0a43a 56%,#b4531f 74%,#8a3a12 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.35)) drop-shadow(0 0 6px rgba(224,150,60,.35));animation:brandshine 6s ease-in-out infinite}
@keyframes brandshine{0%{background-position:100% 0}55%,100%{background-position:0 0}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand{background-image:linear-gradient(100deg,#c8692f 0%,#e08a55 22%,#f0c36a 38%,#fff6da 48%,#f0c36a 56%,#e08a55 74%,#c8692f 100%)}}
:root[data-theme="dark"] .brand{background-image:linear-gradient(100deg,#c8692f 0%,#e08a55 22%,#f0c36a 38%,#fff6da 48%,#f0c36a 56%,#e08a55 74%,#c8692f 100%)}
@media (prefers-reduced-motion:reduce){.brand{animation:none;background-position:30% 0}}
nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
nav a{text-decoration:none;color:var(--ink);padding:4px 10px;border-radius:999px;font-size:.95rem}
nav a:hover{background:var(--card);color:var(--saffron)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;color:var(--ink);padding:4px 10px;font-size:.88rem;cursor:pointer;line-height:1.5}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lang .dv{font-family:var(--dv-b)}.lang .te{font-family:var(--te-b)}.lang .la{font-family:var(--la-b)}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding-block:44px 34px}
.hero h1{font-size:clamp(2rem,4.4vw,3.3rem);line-height:1.3}
.hero h1 em{font-style:normal;color:var(--saffron)}
.hero p{color:var(--muted);max-width:38em;margin:14px 0 0}
.lead{font-family:var(--dv-d);color:var(--gold);font-size:1.1rem;margin-bottom:8px}
.compass{position:relative;aspect-ratio:1;max-width:440px;width:100%;margin-inline:auto}
.compass .om{position:absolute;inset:36% 36%;display:grid;place-items:center;font-family:var(--dv-d);font-size:clamp(2.6rem,7vw,4.2rem);color:var(--saffron);border-radius:50%;background:var(--card);border:1px solid var(--line)}
.compass svg{position:absolute;inset:0;width:100%;height:100%}
.compass .d{position:absolute;width:27%;text-align:center;text-decoration:none;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;font:inherit}
.compass .d img{width:100%;border-radius:3px;box-shadow:0 6px 18px rgba(0,0,0,.22);transition:transform .25s;display:block}
.compass .d:hover img{transform:translateY(-4px)}
.compass .d small{position:absolute;font-size:.74rem;color:var(--muted);line-height:1.2;white-space:nowrap;letter-spacing:.02em}
.d.s small{top:100%;left:0;right:0;margin-top:5px}
.d.n small{bottom:100%;left:0;right:0;margin-bottom:5px}
.d.e small{left:100%;top:0;bottom:0;margin-left:6px;writing-mode:vertical-rl;text-align:center}
.d.w small{right:100%;top:0;bottom:0;margin-right:6px;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center}
.compass{margin-block:28px}
.d.e{right:5%;top:30%}.d.s{left:36.5%;bottom:-6%}.d.w{left:5%;top:30%}.d.n{left:36.5%;top:-6%}
section{padding-block:30px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;margin-bottom:10px}
.sec-head h2{font-size:2rem}
.sec-head p{margin:0;color:var(--muted);font-size:.95rem}
.tools{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;margin:14px 0 6px}
#q{flex:1;min-width:0;max-width:420px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:3px 12px;font:inherit;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.count{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.toc{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px;font-size:.88rem}
.toc .tr{display:grid;grid-template-columns:10em 1fr;gap:4px 10px;align-items:baseline}
.toc .ta{display:flex;gap:6px 14px;flex-wrap:wrap}
.toc .tl{font-size:.74rem;color:var(--saffron);letter-spacing:.3px;font-weight:600}
@media(max-width:600px){.toc .tr{grid-template-columns:1fr}}
.toc a{color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--line)}
.toc a:hover{color:var(--saffron)}
.shelf{padding-block:22px 6px}
.shelf-head{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:baseline;margin-bottom:12px}
.shelf-head .bar{width:4px;height:1.6rem;border-radius:2px;background:var(--sc);align-self:center}
.shelf-head h3{font-size:1.45rem;line-height:1.35}
.shelf-head .n{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.shelf-head p{grid-column:2/4;margin:0;color:var(--muted);font-size:.93rem;max-width:70ch}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(132px,150px);gap:20px;overflow-x:auto;padding:6px 2px 16px;scroll-snap-type:x proximity;
  border-bottom:10px solid var(--wood);box-shadow:0 6px 0 -2px var(--wood2);scrollbar-width:thin;margin-bottom:8px}
.prow{display:grid;grid-template-columns:1fr 1fr;gap:0 36px;padding:6px 2px 16px;border-bottom:10px solid var(--wood);box-shadow:0 6px 0 -2px var(--wood2);margin-bottom:14px}
.prow .ph{display:grid;grid-template-columns:repeat(var(--k),minmax(0,150px));gap:18px;align-content:start}
.prow .ph.te{border-left:1px dashed var(--line);padding-left:18px}
.phd{display:grid;grid-template-columns:1fr 1fr;gap:0 36px;margin:2px 0 4px;font-size:.78rem;font-weight:600;letter-spacing:.04em;color:var(--saffron);text-transform:uppercase}
.phd .te{padding-left:18px}.shelf .anc{position:relative;top:-90px;display:block}
.iks{padding-block:44px 30px}.iks h2{font-size:1.7rem;margin:0 0 6px}.iks>p{color:var(--muted);max-width:72ch;margin:0 0 18px}
.ikc{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ikc a{display:block;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--saffron);border-radius:6px;padding:14px 16px;text-decoration:none;color:var(--ink);transition:transform .2s}
.ikc a:hover{transform:translateY(-3px)}.ikc b{display:block;font-size:1.05rem;margin-bottom:6px;color:var(--saffron)}.ikc span{font-size:.9rem;color:var(--muted);line-height:1.6}
@media(max-width:900px){.ikc{grid-template-columns:1fr 1fr}}@media(max-width:560px){.ikc{grid-template-columns:1fr}.prow,.phd{gap:0 14px}.prow .ph.te{padding-left:10px}.phd .te{padding-left:10px}}
.book{display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer;scroll-snap-align:start}
.cv{aspect-ratio:148/210;width:100%;border-radius:2px 4px 4px 2px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.2),inset 4px 0 0 rgba(0,0,0,.12);transition:transform .2s;background:var(--card)}
.book:hover .cv{transform:translateY(-4px)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv{position:relative}.cv img.land{object-fit:contain;position:relative;z-index:1}
.cv.land::before{content:"";position:absolute;inset:-12px;background:var(--bgimg) center/cover;filter:blur(10px) brightness(.55)}
.gen{height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:12px 10px;color:#fff6e6;background:var(--c);background-image:linear-gradient(160deg,rgba(255,255,255,.12),rgba(0,0,0,.18))}
.gen .t{font-size:1.12rem;line-height:1.35}
.gen .s{font-size:.62rem;opacity:.85}
.gen .a{font-size:.66rem;opacity:.9}
.book .bt{font-size:.98rem;line-height:1.35}
.book .bm{font-size:.76rem;color:var(--muted);line-height:1.3}
.author{display:grid;grid-template-columns:200px 1fr;gap:32px;align-items:start}
.author img{width:100%;border-radius:4px;border:1px solid var(--line)}
.author h2{font-size:2rem}
.author .role{color:var(--saffron);margin:4px 0 12px}
.author p{max-width:62ch;margin:0 0 12px}
.label{font-family:var(--la-b);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.copy{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card)}
.copy code{font-family:var(--la-b);user-select:all}
.copy button{border:0;background:var(--ink);color:var(--paper);border-radius:6px;padding:3px 10px;font:inherit;font-size:.85rem;cursor:pointer}
.soon{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}
.soon div{border-left:2px solid var(--line);padding-left:14px}
.soon h3{font-size:1.2rem}.soon p{margin:4px 0 0;color:var(--muted);font-size:.93rem}
.tag{font-size:.78rem;color:var(--gold)}
footer{border-top:1px solid var(--line);padding-block:22px;color:var(--muted);font-size:.85rem}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);max-width:min(760px,calc(100vw - 32px));width:100%;padding:0}
dialog::backdrop{background:rgba(20,14,8,.55)}
.dlg{display:grid;grid-template-columns:210px 1fr;gap:24px;padding:24px}
.dlg h3{font-size:1.7rem;line-height:1.3}
.dsub{font-size:1.05rem;color:var(--muted);margin-top:2px}.btn.off{background:var(--line);color:var(--muted);cursor:default}
.dlg .meta{color:var(--muted);font-size:.9rem;margin:6px 0 12px}
.dlg p{margin:0 0 12px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.btn{display:inline-block;background:var(--saffron);color:#fff;text-decoration:none;border-radius:8px;padding:8px 14px;font-size:.95rem;border:0;font:inherit;cursor:pointer}
.share{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-top:16px}
.shr{display:flex;gap:8px;flex-wrap:wrap}
.shr a,.shr button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font:inherit;font-size:.85rem;color:var(--ink);background:var(--card);text-decoration:none;cursor:pointer}
.shr a:hover,.shr button:hover{border-color:var(--saffron);color:var(--saffron)}
.shr svg{width:15px;height:15px;fill:currentColor}
.fw{display:flex;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;align-items:center}.fw .share{margin-top:0}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
@media (max-width:760px){#q{flex-basis:100%;max-width:none}.d.e{right:9%}.d.w{left:9%}.compass .d small{font-size:.66rem}.hero{grid-template-columns:1fr;padding-block:24px 44px}.author,.dlg{grid-template-columns:1fr}.author img,.dlg .cv{max-width:180px}}

/* ॐ glow, rays and chant */
.compass .rays{position:absolute;inset:6%;border-radius:50%;pointer-events:none;z-index:0;opacity:.28;
  background:repeating-conic-gradient(from 0deg,rgba(255,196,110,0) 0deg 7deg,rgba(255,196,110,.55) 7deg 9deg,rgba(255,196,110,0) 9deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 14%,rgba(0,0,0,.55) 34%,transparent 66%);mask:radial-gradient(circle,#000 14%,rgba(0,0,0,.55) 34%,transparent 66%);
  animation:omspin 60s linear infinite}
.compass .halo{position:absolute;inset:28%;border-radius:50%;pointer-events:none;z-index:0;opacity:.35;
  background:radial-gradient(circle,rgba(255,206,120,.75) 0%,rgba(255,170,80,.28) 40%,transparent 70%)}
.compass .om{z-index:1;cursor:pointer;transition:box-shadow .6s}
.compass .om:focus-visible{outline:2px solid var(--saffron);outline-offset:3px}
.compass .d{z-index:2}
.compass.chant .rays{animation:omspin 60s linear infinite,raysup 15s ease-in-out forwards}
.compass.chant .halo{animation:haloup 15s ease-in-out forwards}
.compass.chant .om{animation:omglow 15s ease-in-out forwards}
@keyframes omspin{to{transform:rotate(360deg)}}
@keyframes raysup{0%{opacity:.1;transform:scale(.7)}12%{opacity:.85}30%{opacity:.6}45%{opacity:.9}62%{opacity:.6}78%{opacity:.85}100%{opacity:.28;transform:scale(1)}}
@keyframes haloup{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.15)}33%{opacity:.6;transform:scale(1)}48%{opacity:1;transform:scale(1.15)}66%{opacity:.6;transform:scale(1)}82%{opacity:1;transform:scale(1.15)}100%{opacity:.35;transform:scale(1)}}
@keyframes omglow{0%,100%{text-shadow:0 0 6px rgba(255,190,90,.35);box-shadow:0 0 0 rgba(255,180,80,0)}
  15%,48%,82%{text-shadow:0 0 14px rgba(255,214,140,1),0 0 34px rgba(255,170,70,.85),0 0 60px rgba(255,150,60,.55);box-shadow:0 0 38px rgba(255,180,80,.55)}
  33%,66%{text-shadow:0 0 8px rgba(255,200,120,.6),0 0 20px rgba(255,170,70,.4);box-shadow:0 0 18px rgba(255,180,80,.3)}}
.compass .om{text-shadow:0 0 6px rgba(255,190,90,.35)}
@media (prefers-reduced-motion:reduce){.compass .rays,.compass.chant .rays,.compass.chant .halo,.compass.chant .om{animation:none!important}}

/* compass: Telugu and Sanskrit covers alternate every 15 s */
.compass .d{isolation:isolate}
.compass .d img.sa{position:absolute;left:0;top:0;opacity:0;transition:opacity 1.4s ease}
.compass .d img.te{transition:opacity 1.4s ease}
.compass.skt .d img.sa{opacity:1}.compass.skt .d img.te{opacity:0}
.compass .d img.te,.compass .d img.sa{animation:covglow 15s ease-in-out infinite}
@keyframes covglow{0%,100%{box-shadow:0 6px 18px rgba(0,0,0,.22)}50%{box-shadow:0 6px 18px rgba(0,0,0,.22),0 0 22px rgba(240,180,90,.75)}}
.compass .cl{position:absolute;left:0;right:0;bottom:-22%;display:flex;justify-content:center;gap:10px;font-size:.8rem;z-index:3}
.compass .cl span{padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);transition:all .6s}
.compass:not(.skt) .cl .lte,.compass.skt .cl .lsa{background:var(--saffron);color:#fff;border-color:var(--saffron)}
@media (prefers-reduced-motion:reduce){.compass .d img{transition:none;animation:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.visits{display:block;font-size:.9rem;color:var(--muted);margin-top:6px}.visits b{color:var(--saffron);font-variant-numeric:tabular-nums}
</style>

nd any verse by typing in Devanagari, Telugu or Roman letters."], ["Stage 4", "Sanskrit games", "Sandhi puzzles, metre recognition and vocabulary cards."]], "foot": "© 2026 Dr. Mantha Srinivasu · All rights reserved · Books available on Google Play Books.", "dirs": {"n": "North · Mokṣa", "e": "East · Kāma", "w": "West · Artha", "s": "South · Dharma"}, "name": "Dr. Mantha Srinivasu", "iks": {"h": "The work at a glance", "p": "Every book here begins in a Sanskrit source and ends in a present-day question: how a child learns, how a teacher teaches, how a mind steadies, how a society keeps its values. The aim is to make Indian Knowledge Systems usable — cited, explained and compared — not merely admired.", "cards": [["Śāstra as sourcebook", "Bhāratīya Śikṣāśāstra-Sarvasvam (10 volumes, 584 units on education in Sanskrit sources), the ten-volume IKS & Educational Psychology series, and Darśana · Sādhana · Nīti.", "#sh-shiksha"], ["The original texts, searchable", "Pāda indexes of ślokas, sūtras and mantras, and of the dharma, artha, āyurveda, rasa, jyotiṣa and nāṭya-alaṅkāra śāstras, the Itihāsa–Purāṇas and the kośas.", "shastra.html"], ["Grammar, learned anew", "A Pāṇinian engine for verb and noun forms, sandhi and suffixes with their sūtras, a 23-lesson course, and grammar games.", "vyakarana.html"], ["Kāvya: the śāstra lived", "Prose poems that live inside the śāstras — Sāṃkhya to Vāstu, Pāṇini's grammar, Bharata's Nāṭyaśāstra — vacana-kāvyas on the Sahasranāmas and the Rudram, and the eighteen Mahāpurāṇas in singable verse.", "#sh-shk"]]}, "pairl": {"sa": "Sanskrit", "te": "Telugu"}, "tagline": "A workshop of Indian Knowledge Systems"}};

const BOOKS=[{"id": "shiksha-sa", "title": "भारतीयशिक्षाशास्त्रसर्वस्वम्", "sub": "संस्कृतवाङ्मये शिक्षाशास्त्रम् · दशखण्डात्मकः · संस्कृतमूलसंस्करणम्", "full": "भारतीयशिक्षाशास्त्रसर्वस्वम्: संस्कृतवाङ्मये शिक्षाशास्त्रम् · दशखण्डात्मकः · संस्कृतमूलसंस्करणम्", "en": "Bharatiya Shikshashastra-Sarvasvam (Sanskrit): A Compendium of Education in Sanskrit Sources", "lang": "sa", "shelf": "shiksha", "cover": "shiksha-sa", "play": "https://play.google.com/store/books/details?id=eyciEgAAQBAJ", "blurbAny": "संस्कृतवाङ्मये शिक्षाविषये यत् किमपि चिन्तितं, तत् सर्वं प्रथमवारम् एकस्मिन् ग्रन्थे अवधारणाक्रमेण संगृहीतम्। वेदाः, उपनिषदः, धर्मशास्त्राणि, आयुर्वेदः, अर्थशास्त्रम्, दर्शनानि, काव्यनाटकानि, बौद्धजैनग्रन्थाः, शिलालेखाः, देशभाषासाहित्यं च — एतेषु विकीर्णं शिक्षाचिन्तनम् अत्र दशसु खण्डेषु, 118 अध्यायेषु, 584 अंशेषु सस्रोतः विन्यस्तम्। प्रत्येकस्मिन् अंशे — मूलपाठः, सुनिश्चितः स्थाननिर्देशः, व्याख्या; प्रत्यध्यायान्ते च विमर्शबिन्दवः, आधुनिकसिद्धान्तैः (पियाजे, ब्लूम्, ड्यूई, वाइगोत्स्की, शुल्मन् इत्यादिभिः) सह तुलना, बी.एड्.–आई.टी.ई.पी.–एम्.एड्.–शिक्षाशास्त्री–शिक्षाचार्य-पाठ्यक्रमैः सह सम्बन्धः, प्रायोगिककार्यं, सन्दर्भग्रन्थाः च।"}, {"id": "shiksha-en", "title": "Bhāratīya Śikṣāśāstra-Sarvasvam", "sub": "A Compendium of Education in Sanskrit Sources · in Ten Volumes", "full": "Bhāratīya Śikṣāśāstra-Sarvasvam: A Compendium of Education in Sanskrit Sources · in Ten Volumes", "en": "Bharatiya Shikshashastra-Sarvasvam (English): A Compendium of Education in Sanskrit Sources", "lang": "en", "shelf": "shiksha", "cover": "shiksha-en", "play": "https://play.google.com/store/books/details?id=VTQiEgAAQBAJ", "blurbAny": "Indian thought on education is scattered across the Vedas and Upaniṣads, the Dharmaśāstras, Āyurveda, the Arthaśāstra, the philosophical systems, kāvya and drama, Buddhist and Jaina texts, inscriptions and the literature of India's regional languages. This compendium gathers it, concept by concept, into one reference work: ten volumes in one book, 118 chapters and 584 units. Every unit gives the original Sanskrit text (in IAST), its exact locus and a clear explanation. Every chapter ends with points for discussion, a comparison with modern theory (Piaget, Bloom, Dewey, Vygotsky, Erikson, Kohlberg, Shulman and others), links to B.Ed., ITEP, M.Ed., Śikṣāśāstrī and Śikṣācārya papers, a practicum activity, and recommended editions and translations."}, {"id": "shiksha-hi", "title": "भारतीयशिक्षाशास्त्रसर्वस्वम", "sub": "संस्कृत वाङ्मय में शिक्षाशास्त्र · दस खण्डों में · हिन्दी संस्करण", "full": "भारतीयशिक्षाशास्त्रसर्वस्वम: संस्कृत वाङ्मय में शिक्षाशास्त्र · दस खण्डों में · हिन्दी संस्करण", "en": "Bharatiya Shikshashastra-Sarvasvam (Hindi): A Compendium of Education in Sanskrit Sources", "lang": "hi", "shelf": "shiksha", "cover": "shiksha-hindi", "play": "https://play.google.com/store/books/details?id=yDQiEgAAQBAJ", "blurbAny": "भारतीय शिक्षा-चिन्तन वेद-उपनिषद्, धर्मशास्त्र, आयुर्वेद, अर्थशास्त्र, दर्शन, काव्य-नाटक, बौद्ध-जैन ग्रन्थों, शिलालेखों और देशभाषा-साहित्य में बिखरा हुआ है। यह ग्रन्थ उसे अवधारणाओं के क्रम से एक ही सन्दर्भ-ग्रन्थ में प्रस्तुत करता है — दस खण्ड, 118 अध्याय और 584 अंश। प्रत्येक अंश में मूल संस्कृत पाठ, उसका सटीक स्थान-निर्देश और स्पष्ट व्याख्या है। प्रत्येक अध्याय के अन्त में विमर्श-बिन्दु, आधुनिक सिद्धान्तों (पियाजे, ब्लूम, ड्यूई, वाइगोत्स्की, एरिक्सन, कोहलबर्ग, शुल्मन आदि) से तुलना, बी.एड., आई.टी.ई.पी., एम.एड., शिक्षाशास्त्री और शिक्षाचार्य के प्रश्नपत्रों से सम्बन्ध, प्रायोगिक कार्य और सन्दर्भ-ग्रन्थ दिए गए हैं।"}, {"id": "shiksha-te", "title": "భారతీయశిక్షాశాస్త్రసర్వస్వమ్", "sub": "సంస్కృత వాఙ్మయంలో శిక్షాశాస్త్రం · పది సంపుటాలలో · తెలుగు అనువాదం", "full": "భారతీయశిక్షాశాస్త్రసర్వస్వమ్: సంస్కృత వాఙ్మయంలో శిక్షాశాస్త్రం · పది సంపుటాలలో · తెలుగు అనువాదం", "en": "Bharatiya Shikshashastra-Sarvasvam (Telugu): A Compendium of Education in Sanskrit Sources", "lang": "te", "shelf": "shiksha", "cover": "shiksha-te", "play": "https://play.google.com/store/books/details?id=-jQiEgAAQBAJ", "blurbAny": "భారతీయ విద్యా oogle.com/store/books/details?id=UPcjEgAAQBAJ", "blurbAny": "యోగశ్చిత్తవృత్తినిరోధః; తదా ద్రష్టుః స్వరూపేऽవస్థానమ్ (యోగసూత్రం 1.2–3) — చిత్తవృత్తుల నిరోధమే యోగం; అప్పుడు చూసేవాడు తన స్వరూపంలో నిలుస్తాడు. సాంఖ్యం ప్రకృతి పురుషుల ఇరవై అయిదు తత్త్వాలను చెబుతుంది; యోగం ఆ చూసేవాని స్థితికి దారి చూపుతుంది. ఈ కావ్యం ఇరవై నాలుగు చోట్ల ఆగి చూస్తుంది — దుఃఖత్రయం, చిత్తవృత్తులు, పురుషుడు, ప్రకృతి, త్రిగుణాలు, పరిణామం, బుద్ధి, అహంకారం, క్లేశాలు, అష్టాంగం, విభూతి, వివేకఖ్యాతి — కైవల్యం వరకు. ఇది శాస్త్రానికి అనువాదం కాదు, సంక్షేపం కాదు, కథ కాదు. పేర్లున్న మనుషులు లేరు; జలం, దీపం, అద్దం, నర్తకి, గుడ్డివాడు, కుంటివాడు — ఇవే శాస్త్రాన్ని ప్రత్యక్షంగా, ఉపమానాలుగా చెబుతాయి. తత్త్వ విచారం, చిత్త విచారమే కావ్యం తీసుకున్నది; ఆసన, ప్రాణాయామాల పద్ధతులు, వైద్య వాదాలు కావు."}, {"id": "p-nO4jEgAAQBAJ", "title": "प्राणप्रणयः", "sub": "चतुर्विंशतिः श्वासाः, एकः प्रणयः — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "full": "प्राणप्रणयः: चतुर्विंशतिः श्वासाः, एकः प्रणयः — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "en": "Praana PranayaH", "lang": "sa", "shelf": "shk", "cover": "p-nO4jEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=nO4jEgAAQBAJ", "blurbAny": "आत्मनस्तु कामाय सर्वं प्रियं भवति — आत्मार्थम् एव सर्वं प्रियं भवतीति उपनिषद् अवदत्। कामसूत्रं कामं धर्मावरुद्धां कलां दर्शयति; नारदः प्रेम भक्तिरूपेण दर्शयति। इदं काव्यं चतुर्विंशतौ स्थानेषु स्थित्वा कामात् प्रेम, प्रेम्णः भक्तिं यावत् गमनं पश्यति — एकैकस्य श्वासस्य इव। इदं शास्त्रस्य अनुवादः न, सङ्क्षेपः न, कथा न, शृङ्गारवर्णनम् अपि न। नामयुक्ताः जनाः न सन्ति; चन्द्रः, कमलम्, नदी, मेघः, दीपः, लता, वेणुः — एते एव शास्त्रं साक्षात् उपमारूपेण च वदन्ति। सङ्गमः, विरहः, प्रणयकलहः, अनुनयः — मनसः अवस्थारूपेण दृश्यन्ते; अद्यतनं पटलप्रेम काव्यं लघुना व्यङ्ग्येन शास्त्रस्य पार्श्वे स्थापयित्वा पश्यति। प्रतिपङ्क्तिः द्वयोः अर्धयोः, मध्ये यत्या; युग्मरूपेण अन्त्यानुप्रासः।"}, {"id": "p-LO4jEgAAQBAJ", "title": "ప్రాణప్రణయం", "sub": "ఇరవై నాలుగు శ్వాసలు, ఒకే ప్రణయం — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "full": "ప్రాణప్రణయం: ఇరవై నాలుగు శ్వాసలు, ఒకే ప్రణయం — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "en": "Praana Pranayam", "lang": "te", "shelf": "shk", "cover": "p-LO4jEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=LO4jEgAAQBAJ", "blurbAny": "ఆత్మనస్తు కామాయ సర్వం ప్రియం భవతి — ఆత్మ కోసమే అన్నీ ప్రియమవుతాయని ఉపనిషత్తు చెప్పింది. కామసూత్రం కామాన్ని ధర్మానికి లోబడిన కళగా చూపింది; నారదుడు ప్రేమను భక్తిగా చూపాడు. ఈ కావ్యం ఇరవై నాలుగు చోట్ల ఆగి కామం నుంచి ప్రేమకు, ప్రేమ నుంచి భక్తికి సాగే ప్రయాణాన్ని చూస్తుంది — ఒక్కో శ్వాసలాగా. ఇది శాస్త్రానికి అనువాదం కాదు, సంక్షేపం కాదు, కథ కాదు; శృంగార వర్ణన కూడా కాదు. పేర్లున్న మనుషులు లేరు; చంద్రుడు, కమలం, నది, మేఘం, దీపం, తీగ, వేణువు — ఇవే శాస్త్రాన్ని ప్రత్యక్షంగా, ఉపమానాలుగా చెబుతాయి. సంగమం, విరహం, అలక, అనునయం — మనసులోని స్థితులుగా కనిపిస్తాయి; నేటి తెరల ప్రేమను కావ్యం చిన్న వ్యంగ్యంతో శాస్త్రం పక్కన నిలబెట్టి చూస్తుంది. ప్రతి పంక్తి రెండు అర్ధాలుగా, మధ్య యతితో; జంటగా అంత్యప్రాస."}, {"id": "p-uPUjEgAAQBAJ", "title": "अपूर्वम्", "sub": "चतुर्विंशतिः सूत्रदीपाः, एकं पठनम् — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "full": "अपूर्वम्: चतुर्विंशतिः सूत्रदीपाः, एकं पठनम् — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "en": "Apurvam", "lang": "sa", "shelf": "shk", "cover": "p-uPUjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=uPUjEgAAQBAJ", "blurbAny": "अथातो धर्मजिज्ञासा — अथ अतः धर्मजिज्ञासा (जैमिनिः १।१।१)। मीमांसा नाम पठनस्य अर्थनिर्णयस्य च शास्त्रम्: वाक्यं किं वदति, कथं वदति, किमर्थं वदति। इदं काव्यं चतुर्विंशतौ स्थानेषु स्थित्वा पश्यति — चोदना षट् प्रमाणानि शब्दः विधिः अर्थवादः अपूर्वं भावना तात्पर्यं लक्षणा अनुपलब्धिः अर्थापत्तिः स्वतःप्रामाण्यं टीका च — अथातो धर्मजिज्ञासा इति यावत्। इदं शास्त्रस्य अनुवादः न, सङ्क्षेपः न, कथा न। नामयुक्ताः जनाः न सन्ति; तालपत्रं दीपः ज्वाला छाया शङ्खः हस्ताक्षरं च — एते एव शास्त्रं साक्षात् उपमारूपेण च वदन्ति। व्याख्यानपद्धतिः प्रमाणसिद्धान्तश्च काव्येन गृहीतौ; प्रत्येकं सूत्रं पठनस्य एव न, पठितुः मनसः अपि। टीकासु टीकाः लिखितुम् अभ्यासं प्रति लघु व्यङ्ग्यम् अस्ति।"}, {"id": "p-gvUjEgAAQBAJ", "title": "అపూర్వం", "sub": "ఇరవై నాలుగు సూత్ర దీపాలు, ఒకే చదువు — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "full": "అపూర్వం: ఇరవై నాలుగు సూత్ర దీపాలు, ఒకే చదువు — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "en": "Apoorvam", "lang": "te", "shelf": "shk", "cover": "p-gvUjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=gvUjEgAAQBAJ", "blurbAny": "అథాతో ధర్మజిజ్ఞాసా — ఇప్పుడు, కాబట్టి, ధర్మాన్ని తెలుసుకోవాలనే కోరిక (జైమిని 1.1.1). మీమాంస అంటే చదివే, అర్థం చేసుకునే శాస్త్రం: వాక్యం ఏమి చెబుతోంది, ఎలా చెబుతోంది, ఎందుకు చెబుతోంది. ఈ కావ్యం ఇరవై నాలుగు చోట్ల ఆగి చూస్తుంది — చోదన, ఆరు ప్రమాణాలు, శబ్దం, విధి, అర్థవాదం, అపూర్వం, భావన, తాత్పర్యం, లక్షణ, అనుపలబ్ధి, అర్థాపత్తి, స్వతఃప్రామాణ్యం, టీక — అథాతో ధర్మజిజ్ఞాసా వరకు. ఇది శాస్త్రానికి అనువాదం కాదు, సంక్షేపం కాదు, కథ కాదు. పేర్లున్న మనుషులు లేరు; తాళపత్రం, దీపం, జ్వాల, నీడ, శంఖం, సంతకం — ఇవే శాస్త్రాన్ని ప్రత్యక్షంగా, ఉపమానాలుగా చెబుతాయి. వ్యాఖ్యాన పద్ధతి, ప్రమాణ సిద్ధాంతమే కావ్యం తీసుకున్నది; ప్రతి సూత్రం చదువు గురించే కాక చదివేవాని మనసు గురించి కూడా."}, {"id": "p-yu0jEgAAQBAJ", "title": "धर्मधारणम्", "sub": "चतुर्विंशतिः अराः, एकं चक्रम् — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "full": "धर्मधारणम्: चतुर्विंशतिः अराः, एकं चक्रम् — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "en": "Dharma DhaaranaM", "lang": "sa", "shelf": "shk", "cover": "p-yu0jEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=yu0jEgAAQBAJ", "blurbAny": "धारणाद् धर्ममित्याहुः — धारयति इति धर्मः। मनुस्मृतिः धर्मस्य दश लक्षणानि अवदत्: धृतिः क्षमा दमः अस्तेयं शौचम् इन्द्रियनिग्रहः धीः विद्या सत्यम् अक्रोधः। इदं काव्यं चतुर्विंशतौ स्थानेषु स्थित्वा पश्यति — धर्मः ऋतं दश लक्षणानि अहिंसा ऋणत्रयम् आश्रमः दानं राजधर्मः आपद्धर्मः न्यायः मनःसाक्षी च — धर्मो रक्षति रक्षितः इति यावत्। इदं शास्त्रस्य अनुवादः न, सङ्क्षेपः न, कथा न। नामयुक्ताः जनाः न सन्ति; चक्रं भूमिः नदी दीपः तुला कूलं मूलं च — एते एव शास्त्रं साक्षात् उपमारूपेण च वदन्ति। वर्णभेदवादान् विहाय सर्वेषां प्रयोज्यं सार्वजनीनं धर्मम्, अन्तरात्मसाक्षिकं धर्मं च काव्यं पश्यति; अक्षरम् आलम्ब्य छिद्रम् अन्वेषमाणां अद्यतनीं नीतिं लघुना व्यङ्ग्येन शास्त्रस्य पार्श्वे स्थापयित्वा पश्यति।"}, {"id": "p-LO0jEgAAQBAJ", "title": "ధర్మధారణం", "sub": "ఇరవై నాలుగు ఆకులు, ఒకే చక్రం — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "full": "ధర్మధారణం: ఇరవై నాలుగు ఆకులు, ఒకే చక్రం — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "en": "Dharma Dharanam", "lang": "te", "shelf": "shk", "cover": "p-LO0jEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=LO0jEgAAQBAJ", "blurbAny": "ధారణాద్ ధర్మమిత్యాహుః — ధరించేది ధర్మం. మనుస్మృతి ధర్మానికి పది లక్షణాలు చెప్పింది: ధృతి, క్షమ, దమం, అస్తేయం, శౌచం, ఇంద్రియనిగ్రహం, ధీ, విద్య, సత్యం, అక్రోధం. ఈ కావ్యం ఇరవై నాలుగు చోట్ల ఆగి చూస్తుంది — ధర్మం, ఋతం, పది లక్షణాలు, అహింస, ఋణత్రయం, ఆశ్రమం, దానం, రాజధర్మం, ఆపద్ధర్మం, న్యాయం, మనస్సాక్షి — ధర్మో రక్షతి రక్షితః వరకు. ఇది శాస్త్రానికి అనువాదం కాదు, సంక్షేపం కాదు, కథ కాదు. పేర్లున్న మనుషులు లేరు; చక్రం, భూమి, నది, దీపం, తూనిక, గట్టు, వేరు — ఇవే శాస్త్రాన్ని ప్రత్యక్షంగా, ఉపమానాలుగా చెబుతాయి."}, {"id": "p-j_EjEgAAQBAJ", "title": "सप्ताङ्गम्", "sub": "सप्ताङ्गानि, एकं राज्यम् — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "full": "सप्ताङ्गम्: सप्ताङ्गानि, एकं राज्यम् — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "en": "Saptaangam", "lang": "sa", "shelf": "shk", "cover": "p-j_EjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=j_EjEgAAQBAJ", "blurbAny": "कौटिल्यः राज्यस्य सप्त अङ्गानि अवदत्: स्वामी अमात्यः जनपदः दुर्गं कोशः दण्डः मित्रम् (अर्थशास्त्रम् ६।१)। इदं काव्यं चतुर्विंशतौ स्थानेषु स्थित्वा पश्यति — अर्थः विद्याचतुष्टयं विनयः षड्वर्गः सप्ताङ्गानि मन्त्रः चाराः आयव्ययौ अध्यक्षाः मण्डलं षाड्गुण्यम् उपायाः व्यसनं च — प्रजासुखे सुखं राज्ञः इति यावत्। इदं शास्त्रस्य अनुवादः न, सङ्क्षेपः न, कथा न। नामयुक्ताः जनाः न सन्ति; मण्डलं तुला दुर्गं कोशः दीपः कर्णधारः च — एते एव शास्त्रं साक्षात् उपमारूपेण च वदन्ति। प्रत्येकम् अङ्गं राज्यस्य एव न, मनोरूपस्य राज्यस्य अपि प्रयोज्यम्: स्वामी अहमेव, अमात्यः विवेकः, जनपदः इन्द्रियाणि, दुर्गं नियमः, कोशः श्रमः, दण्डः स्वनिग्रहः, मित्रं श्रद्धा।"}, {"id": "p-R_EjEgAAQBAJ", "title": "సప్తాంగం", "sub": "ఏడు అంగాలు, ఒకే రాజ్యం — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "full": "సప్తాంగం: ఏడు అంగాలు, ఒకే రాజ్యం — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "en": "Saptaangam", "lang": "te", "shelf": "shk", "cover": "p-R_EjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=R_EjEgAAQBAJ", "blurbAny": "కౌటిల్యుడు రాజ్యానికి ఏడు అంగాలు చెప్పాడు: స్వామి, అమాత్యుడు, జనపదం, దుర్గం, కోశం, దండం, మిత్రం (అర్థశాస్త్రం 6.1). ఈ కావ్యం ఇరవై నాలుగు చోట్ల ఆగి చూస్తుంది — అర్థం, నాలుగు విద్యలు, వినయం, షడ్వర్గం, ఏడు అంగాలు, మంత్రం, చారులు, ఆయవ్యయం, అధ్యక్షులు, మండలం, షాడ్గుణ్యం, ఉపాయాలు, వ్యసనం — ప్రజాసుఖే సుఖం రాజ్ఞః వరకు. ఇది శాస్త్రానికి అనువాదం కాదు, సంక్షేపం కాదు, కథ కాదు. పేర్లున్న మనుషులు లేరు; మండలం, తూనిక, కోట, ఖజానా, దీపం, చుక్కాని — ఇవే శాస్త్రాన్ని ప్రత్యక్షంగా, ఉపమానాలుగా చెబుతాయి. ప్రతి అంగం ఒక రాజ్యానికే కాదు, ఒక మనసు అనే రాజ్యానికీ వర్తిస్తుంది: స్వామి నేనే, అమాత్యుడు వివేకం, జనపదం ఇంద్రియాలు, కోట నియమం, కోశం శ్రమ, దండం స్వీయనిగ్రహం, మిత్రం శ్రద్ధ."}, {"id": "p-zPQjEgAAQBAJ", "title": "नीतिपथः", "sub": "चतुर्विंशतिः वक्राः, एकः पन्थाः — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "full": "नीतिपथः: चतुर्विंशतिः वक्राः, एकः पन्थाः — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "en": "NeetI PathaH", "lang": "sa", "shelf": "shk", "cover": "p-zPQjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=zPQjEgAAQBAJ", "blurbAny": "निन्दन्तु नीतिनिपुणा यदि वा स्तुवन्तु… न्याय्यात् पथः प्रविचलन्ति पदं न धीराः (नीतिशतकम् ८४) — नीतिनिपुणाः निन्दन्तु स्तुवन्तु वा, धीराः न्याय्यात् पथः एकमपि पदं न चलन्ति। इदं काव्यं चतुर्विंशतौ स्थानेषु स्थित्वा पश्यति — नीतिः विद्या विनयः सत्सङ्गः मैत्री दुर्जनः धनं वाक् गर्वः उद्यमः धैर्यं परीक्षा परोपकारः सभा विवेकः च — पदं न धीराः प्रविचलन्ति इति यावत्। इदं शास्त्रस्य अनुवादः न, सङ्क्षेपः न, कथा न। नामयुक्ताः जनाः न सन्ति; पन्थाः दीपः कनकपरीक्षा कमलपत्रं वृक्षः वालुकाघटी च — एते एव शास्त्रं साक्षात् उपमारूपेण च वदन्ति। सुभाषितपरम्परायाः चमत्कृतिं रक्षन् काव्यं प्रत्येकां नीतिं बाह्यलोकाय अन्तर्लोकाय च परिवर्तयति; दुर्जनान् आलस्यं सभाश्च प्रति लघु व्यङ्ग्यम् अस्ति।"}, {"id": "p-lPQjEgAAQBAJ", "title": "నీతిపథం", "sub": "ఇరవై నాలుగు మలుపులు, ఒకే బాట — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "full": "నీతిపథం: ఇరవై నాలుగు మలుపులు, ఒకే బాట — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "en": "Neeti Patham", "lang": "te", "shelf": "shk", "cover": "p-lPQjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=lPQjEgAAQBAJ", "blurbAny": "నిందంతు నీతినిపుణా యది వా స్తువంతు… న్యాయ్యాత్ పథః ప్రవిచలంతి పదం న ధీరాః (నీతిశతకం 84) — నీతి చెప్పిన వారు తిట్టినా పొగిడినా ధీరులు న్యాయమార్గం నుంచి ఒక్క అడుగు కూడా జరగరు. ఈ కావ్యం ఇరవై నాలుగు చోట్ల ఆగి చూస్తుంది — నీతి, విద్య, వినయం, సత్సంగం, మైత్రి, దుర్జనుడు, ధనం, వాక్కు, గర్వం, ఉద్యమం, ధైర్యం, పరీక్ష, పరోపకారం, సభ, వివేకం — పదం న ధీరాః ప్రవిచలంతి వరకు. ఇది శాస్త్రానికి అనువాదం కాదు, సంక్షేపం కాదు, కథ కాదు. పేర్లున్న మనుషులు లేరు; బాట, దీపం, బంగారు పరీక్ష, తామర ఆకు, చెట్టు, ఇసుక గడియారం — ఇవే శాస్త్రాన్ని ప్రత్యక్షంగా, ఉపమానాలుగా చెబుతాయి."}, {"id": "p-r-wjEgAAQBAJ", "title": "आयुर्वेदः", "sub": "चतुर्विंशतिः दृश्यानि, एकः दीपः — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "full": "आयुर्वेदः: चतुर्विंशतिः दृश्यानि, एकः दीपः — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "en": "AyurvedaH", "lang": "sa", "shelf": "shk", "cover": "p-r-wjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=r-wjEgAAQBAJ", "blurbAny": "आयुर्वेदः नाम आयुषः विज्ञानम्। अष्टाङ्गहृदयम् तद् विज्ञानम् अष्टसु अङ्गेषु अवदत्; इदं काव्यं तेषु चतुर्विंशतौ स्थानेषु स्थित्वा पश्यति — आयुः, दिनचर्या, त्रिदोषः, धातवः, अग्निः, ओजः, षड्रसाः, निदानम्, चिकित्सा, पथ्यम्, रसायनम्, अन्तः। इदं शास्त्रस्य अनुवादः न, सङ्क्षेपः न, कथा न। अस्मिन् नामयुक्ताः जनाः न सन्ति; दीपः, आकाशः, नदी, कर्मारकुल्या, सेतुः, रथः — एतानि एव शास्त्रं प्रतिफलयन्ति। प्रतिसर्गम् एका अविच्छिन्ना कविता — शास्त्रवचनं, प्रकृतिबिम्बम्, मनसः प्रतिरूपं च संश्लिष्य चलन्ति। त्रिः पठितं चेत् सर्गः सम्पूर्णम् अवगम्यते — प्रथमं बिम्बानि, ततः सरणिः, अन्ते भावः। प्रतिपङ्क्तिः द्वयोः अर्धयोः, मध्ये यत्या; युग्मरूपेण अन्त्यानुप्रासः।"}, {"id": "p-N-wjEgAAQBAJ", "title": "ఆయుర్వేదం", "sub": "ఇరవై నాలుగు దృశ్యాలు, ఒకే దీపం — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "full": "ఆయుర్వేదం: ఇరవై నాలుగు దృశ్యాలు, ఒకే దీపం — దార్శనిక మనోవైజ్ఞానిక వచన కావ్యం", "en": "AyurvedaM", "lang": "te", "shelf": "shk", "cover": "p-N-wjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=N-wjEgAAQBAJ", "blurbAny": "ఆయుర్వేదం అంటే ఆయువు గురించిన జ్ఞానం. అష్టాంగహృదయం ఆ జ్ఞానాన్ని ఎనిమిది అంగాలుగా చెప్పింది; ఈ కావ్యం అందులో ఇరవై నాలుగు చోట్ల నిలిచి చూస్తుంది — ఆయువు, దినచర్య, త్రిదోషం, ధాతువులు, అగ్ని, ఓజస్సు, షడ్రసాలు, నిదానం, చికిత్స, పథ్యం, రసాయనం, అంతం. ఇది శాస్త్రానికి అనువాదం కాదు, సంక్షేపం కాదు, కథ కాదు. ఇందులో పేర్లు పెట్టిన మనుషులు లేరు; దీపం, ఆకాశం, నది, కొలిమి, ఆనకట్ట, రథం — ఇవే శాస్త్రాన్ని ప్రతిఫలిస్తాయి. ప్రతి సర్గ ఒకే అవిచ్ఛిన్న కవిత — శాస్త్రపు మాట, ప్రకృతి బింబం, మనసులోని ప్రతిరూపం పెనవేసుకుని సాగుతాయి. మూడుసార్లు చదివితే సర్గ పూర్తిగా అర్థమవుతుంది — మొదట బింబాలు, తరువాత సరళి, చివరికి భావం. ప్రతి పంక్తి రెండు అర్ధాలుగా, మధ్య యతితో; జంటగా అంత్యప్రాస."}, {"id": "p-xOsjEgAAQBAJ", "title": "अन्नमयम्", "sub": "द्वाविंशतिः दृश्यानि, एका स्थाली — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "full": "अन्नमयम्: द्वाविंशतिः दृश्यानि, एका स्थाली — दार्शनिकं मनोवैज्ञानिकं गद्यकाव्यम्", "en": "AnnamayaM", "lang": "sa", "shelf": "shk", "cover": "p-xOsjEgAAQBAJ", "play": "https://play.google.com/store/books/details?id=xOsjEgAAQBAJ", "blurbAny": "अन्नं ब्रह्मेति उपनिषद् अवदत्; देहः अन्नमयः कोशः इति शास्त्रम् अवदत्। इदं काव्यं द्वाविंशतौ स्थानेषु स्थित्वा पश्यति — किं पक्तव्यम्, कथं पक्तव्यम्, कदा भोक्तव्यम्, कियद् भोक्तव्यम्, कथं भोक्तव्यम्; अन्नदानं तृप्तिं यावत्। इदं शास्त्रस्य अनुवादः न, सङ्क्षेपः न, कथा न। नामयुक्ताः जनाः न सन्ति; क्षेत्रम्, चुल्ली, स्थाली, मन्थदण्डः, पर्णम्, दीपः — एते एव शास्त्रं साक्षात् उपमानरूपेण च वदन्ति। अद्यतनं वीथिभोजनं, कोशस्थं भोजनं, स्थित्वा भोजनं च काव्यं लघुना व्यङ्ग्येन पश्यति — निन्दया न, शास्त्रस्य पार्श्वे स्थापयित्वा। प्रतिपङ्क्तिः द्वयोः अर्धयोः, मध्ये यत्या; युग्मरूपेण अन्त्यानुप्रासः। आन्ध्रमूलस
